; Jet Browser -- jet.ini: the User-Agent the browser sends (and navigator.userAgent).
; Edit on the card; read when Jet Browser starts (restart it after a change).
; Lines starting with ; or # are comments. An empty or missing value keeps the built-in one.
;
; Which one a page gets, first match wins:
;   1. [sites]: the site's own line (example.com also covers www.example.com, m.example.com;
;      the toolbar's pill then says "Custom")
;   2. a site switched with the toolbar's pill (right of the address; kept in site-modes):
;      Desktop: [user_agent] desktop, Mobile: [user_agent] mobile
;   3. [user_agent] default (the pill's "Standard")
;   4. user_agent: in SD:/res/Choices (the old place)
;   5. built in: Mozilla/5.0 (X11; Linux aarch64) NetSurf/3.12

[user_agent]
; every site (empty: NetSurf's own -- the search engines serve their light pages, no bot check)
default =
; the sites switched to "Desktop" (empty: Chrome on Windows)
desktop =
; the sites switched to "Mobile" (empty: Chrome on Android)
mobile =

[sites]
; one line per site: site = User-Agent. Examples (remove the ; to use one):
; m.facebook.com = Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Mobile Safari/537.36
; github.com = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36
;
; Other User-Agents:
;   Chrome on Android: Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Mobile Safari/537.36
;   Chrome on Windows: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36
;   Firefox on Linux:  Mozilla/5.0 (X11; Linux aarch64; rv:131.0) Gecko/20100101 Firefox/131.0
;   NetSurf:           Mozilla/5.0 (X11; Linux aarch64) NetSurf/3.12
