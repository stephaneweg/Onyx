# SD:/etc/input.ini -- InputKit's bindings (user/Kits/inputkit/inputkit.h): the keyboard and the gamepads as ONE input.
# A program asks for an ACTION -- up, accept, back... --, never for "the arrow key or the D-pad"; this file says which
# keys and which pad buttons each action is. One line an action, several sources separated by commas, "none": no
# source. The lines below are the defaults (the file may hold only what it changes). Read by each program when it
# starts.
#
# The actions: up down left right (the focus, the caret), accept (open, confirm), back (cancel, close), alt1 (the
# second action: close the chosen app, remove), alt2 (the options: a context menu), prev next (the tab, the category,
# the section before / after), menu (the app's menus), home, start select (a game's), l2 r2.
#
# A key: Up Down Left Right Enter Esc Tab Space Backspace Delete Home End PageUp PageDown F1..F12 or a character,
# with Ctrl+ Shift+ Alt+ before it. A pad's button, by its place (SD:/etc/gamepad.ini says which raw button it is on
# each model -- the Control Panel's Gamepad applet): up down left right a b x y l r l2 r2 select start l3 r3 home.
# (PocketUI's own keys are not here: the CMD / Super key pressed and released is the menu, held it is Home.)

[keys]
#up     = Up
#down   = Down
#left   = Left
#right  = Right
#accept = Enter
#back   = Esc
#alt1   = Delete
#alt2   = Shift+F10
#prev   = Ctrl+PageUp, Ctrl+Shift+Tab
#next   = Ctrl+PageDown, Ctrl+Tab
#menu   = F10
#home   = Ctrl+Esc
#start  = none
#select = none

[pad]
#up     = up
#down   = down
#left   = left
#right  = right
#accept = a
#back   = b
#alt1   = x
#alt2   = y
#prev   = l
#next   = r
#menu   = none
#home   = home
#start  = start
#select = select
#l2     = l2
#r2     = r2
