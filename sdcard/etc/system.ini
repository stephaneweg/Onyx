# Onyx system settings (read at boot).
# verbose:  1 = log app lifecycle (start/spawn/exit/kill) to the kernel log (kmsg).
# timezone: minutes offset from UTC for the local clock (60 = CET, 120 = CEST).
# ntp:      time server to sync against once WLAN is up ("off": the clock is not set).
# hostname: the name the Pi gives the network (DHCP), at the next start; default "raspberrypi".
#           Setup (the first-run wizard) writes timezone, ntp and hostname.
# ramfs:    the size of RAM:, the volume in memory (Jet Browser's caches; its files are lost at a
#           restart): MB ("ramfs=64") or a share of the free memory ("ramfs=10%"); "ramfs=0": no
#           RAM: volume. Default (no line): 128 MB, at most a quarter of the free memory.
verbose=0
timezone=120
ntp=pool.ntp.org
