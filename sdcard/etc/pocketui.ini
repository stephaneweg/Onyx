# SD:/etc/pocketui.ini -- PocketUI's settings (the graphics server of the pocket and console modes).
#
# [cards]: the apps NOT shown full screen. Every app's main window fills the screen under the menu bar (one at a
# time; a window of a fixed size smaller than the screen is centred on its own background colour); the apps named
# here (one a line: their folder's name, SD:/apps/<name>.app) keep their window's size as a card in the middle,
# framed, the rest of the screen behind it. An app may also ask for it itself: "pocket = card" in its app.txt.
# A program's other windows (a dialog, an about box, a second window) and its pop-ups are cards in any case.
# Read again whenever a program opens its first window: a change applies to the programs started next.
[cards]
# the Calculator: a small tool over what you were doing (docs/COMPACT-SHELL-STUDY.md section 6.8)
tinycalc

# [look]: the pocket mode's theme. Without the line: Onyx Noir -- flat and dark, made for a small screen (a
# handheld's 640 x 480): no gradient, no bevel, no shadow, the screen's background the glass' black. "theme =" names
# another theme of SD:/etc/theme.txt's list (Peach, Steel, Sage, Brick, Slate, Milk, Dark Coffee, Onyx Noir), or
# "system": what SD:/etc/theme.txt says, as on the desktop. Read by every program when it starts (and by PocketUI
# itself at its start: restart the session -- `session switch pocket` -- to see a change everywhere). The console
# mode and the desktop do not read it.
[look]
#theme = Onyx Noir

# [buttons]: a handheld's buttons (a D-pad, A / B / X / Y, L / R, Start / Select: the Waveshare PocketTerm35). There is
# no pointer on such a device: each button TYPES A KEY, so the shell, the top band's Menu and the apps are driven the
# same way by the pad, a keyboard or a remote client. One line a button, what it types -- the defaults:
#   up = Up    down = Down    left = Left    right = Right     the D-pad: the arrows
#   a = Enter              open, confirm, activate
#   b = Esc                back, cancel, close
#   x = Delete             the second action: close the chosen app (the switcher, the Running pills), remove
#   y = Shift+F10          the focused control's context menu
#   l = Ctrl+PageUp        the category / tab / section before
#   r = Ctrl+PageDown      ... after
#   start = Super          Home; on the home: the open apps
#   select = F10           the Menu entry of the top band (Alt alone does it too)
# A key: Up Down Left Right Enter Esc Tab Space Backspace Delete Home End PageUp PageDown F1..F12 or a character, with
# Ctrl+ Shift+ Alt+ Super+ before it; Super alone: the Super key pressed and released; none: nothing.
# A device whose buttons are a GAMEPAD (USB): the pocket shell reads it and types these keys (in a game or an emulator
# the pad is the game's; Select + Start together is Home there).
# A device whose buttons are KEYS of its keyboard: nothing to do if they are the keys above; if they are OTHER keys,
# say which key IS each button with "<button>.key = <key>" (e.g. "a.key = F5"): that key then types the button's.
# Read when the pocket shell starts (the session: `session switch pocket`).
[buttons]
#select = F10
#a.key = F5
