# SD:/etc/pocketui.ini -- PocketUI's settings (the graphics server of the pocket and console modes).
#
# [cards]: the apps NOT shown full screen. Every app's main window fills the screen under the menu bar (one at a
# time; a window of a fixed size smaller than the screen is centred on its own background colour); the apps named
# here (one a line: their folder's name, SD:/apps/<name>.app) keep their window's size as a card in the middle,
# framed, the rest of the screen behind it. An app may also ask for it itself: "pocket = card" in its app.txt.
# A program's other windows (a dialog, an about box, a second window) and its pop-ups are cards in any case.
# Read again whenever a program opens its first window: a change applies to the programs started next.
[cards]
# the Calculator: a small tool over what you were doing (docs/COMPACT-SHELL-STUDY.md section 6.8)
tinycalc

# [look]: the pocket mode's theme. Without the line: Onyx Noir -- flat and dark, made for a small screen (a
# handheld's 640 x 480): no gradient, no bevel, no shadow, the screen's background the glass' black. "theme =" names
# another theme of SD:/etc/theme.txt's list (Peach, Steel, Sage, Brick, Slate, Milk, Dark Coffee, Onyx Noir), or
# "system": what SD:/etc/theme.txt says, as on the desktop. Read by every program when it starts (and by PocketUI
# itself at its start: restart the session -- `session switch pocket` -- to see a change everywhere). The console
# mode and the desktop do not read it.
[look]
#theme = Onyx Noir
