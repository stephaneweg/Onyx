# Onyx file associations -- read by the File Viewer and the Shelf (user/fileassoc.h).
# One "extension = app" per line: opening a file launches SD:apps/<app>.app/main with
# the file's path as its argument. Folders open in the File Viewer, .app bundles and
# programs run. Extensions are case-insensitive; '#' starts a comment.
txt  = tinypad
md   = tinypad
ini  = tinypad
cfg  = tinypad
conf = tinypad
log  = tinypad
csv  = tinypad
c    = tinypad
h    = tinypad
cpp  = tinypad
hpp  = tinypad
json = tinypad
html = tinypad
htm  = tinypad
css  = tinypad
kmap = tinypad
sh   = tinypad
doc  = writer
bmp  = imageview
gif  = imageview
png  = imageview
jpg  = imageview
jpeg = imageview
jpe  = imageview
pcx  = imageview
webp = imageview
bas  = qbasic
