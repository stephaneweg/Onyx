<!doctype html>
<html><head><meta charset="utf-8"><title>a scroller in a frame</title></head>
<body style="margin:0;overflow:hidden">
<!-- the consent screen of js-scrollers.html in a full-viewport fixed iframe (as sites embed
     theirs): the wheel over it scrolls its inner panel -->
<iframe src="js-scrollers.html" style="position:fixed;top:0;left:0;width:100%;height:100%;border:0"></iframe>
</body></html>
