<!doctype html>
<html><head><meta charset="utf-8"><title>the CSS Font Loading API</title></head><body>
<!-- new FontFace + document.fonts.add: the face fetched, given to NetSurf, the text laid out in it -->
<p><span id="t" style="font-family: TestMono, serif; font-size: 20px">iiiiiiiiii</span></p>
<script>
var before = document.getElementById('t').getBoundingClientRect().width;
var f = new FontFace('TestMono', 'url(../../../../third_party/dejavu-fonts-ttf-2.37/ttf/DejaVuSansMono.ttf) format("truetype")');
console.log('fontface status ' + f.status + ' ' + (document.fonts instanceof FontFaceSet));
document.fonts.add(f);
document.fonts.ready.then(function () {
	console.log('fontface ready ' + f.status + ' ' + document.fonts.size);
	setTimeout(function () {
		var after = document.getElementById('t').getBoundingClientRect().width;
		console.log('fontface wider ' + (after > before * 1.5));
	}, 400);
});
</script>
</body></html>
