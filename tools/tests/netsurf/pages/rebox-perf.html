<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>rebox perf</title>
<!-- Onyx: the cost of a rebox and a layout on a big page (NS_PERF=1): 5000 articles, a
     script changing one class every 100 ms (the time of each rebox:boxes / layout). -->
<style>
body { font: 14px sans-serif; margin: 8px }
.row { display: flex; gap: 8px; padding: 2px; border-bottom: 1px solid #ddd }
.row:nth-child(odd) { background: #f4f4f4 }
.row .t { flex: 1 }
.row .n { width: 60px; text-align: right; color: #666 }
.on { background: #fd0 !important }
</style></head>
<body>
<div id="list"></div>
<script>
const list = document.getElementById('list');
let html = '';
for (let i = 0; i < 2500; i++)
	html += '<div class="row"><span class="t">Article ' + i + ' <b>title</b></span><span class="n">' + i + '</span></div>';
list.innerHTML = html;
let k = 0;
setInterval(() => {
	const rows = list.children;
	rows[k % rows.length].classList.remove('on');
	k += 37;
	rows[k % rows.length].classList.add('on');
}, 100);
</script>
</body></html>
