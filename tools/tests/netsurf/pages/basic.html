<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Basic</title>
<style>
body { font-family: sans-serif; margin: 16px; background: #f4f1ea; color: #222; }
h1 { color: #7a3e1d; border-bottom: 2px solid #c98; }
.box { background: #fff; border: 1px solid #aaa; padding: 8px; margin: 8px 0; }
.flex { display: flex; justify-content: space-between; }
.flex div { background: #cde; padding: 6px; width: 25%; }
</style></head>
<body>
<h1>NetSurf on Onyx — basic page</h1>
<p>Plain text, <b>bold</b>, <i>italic</i>, <a href="#">a link</a>, <code>code</code>.</p>
<div class="box">A box with a border and padding.</div>
<div class="flex"><div>one</div><div>two</div><div>three</div></div>
<ul><li>list item 1</li><li>list item 2</li></ul>
<form><input type="text" value="text field"> <input type="checkbox" checked> check <button>Button</button></form>
</body></html>
