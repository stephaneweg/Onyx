<!doctype html><html><head><title>media queries on resize</title><style>
#m { width: 200px; height: 40px; background: rgb(255, 0, 0); }
@media (min-width: 1300px) { #m { background: rgb(0, 128, 0); } }
</style></head><body>
<!-- the window resized: the @media rules follow the new viewport (the selection's media was the
     load's size for ever) -- and matchMedia's change event fires -->
<div id="m"></div>
<script>
var mq = matchMedia('(min-width: 1300px)');
function report(when) {
	console.log('mqresize ' + when + ' width ' + innerWidth + ' bg ' + getComputedStyle(document.getElementById('m')).backgroundColor + ' matches ' + mq.matches);
}
mq.addEventListener('change', function (e) { console.log('mqresize change ' + e.matches); });
window.addEventListener('resize', function () { setTimeout(function () { report('resized'); }, 300); });
report('load');
</script></body></html>
