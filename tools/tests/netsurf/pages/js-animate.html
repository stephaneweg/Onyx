<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Web Animations</title>
<!-- tools/tests/netsurf/jstest.sh: the Web Animations API and requestAnimationFrame
     (html/onyx_anim.c, dom.js) -- element.animate() with keyframe arrays and property-indexed
     keyframes, options, finished / onfinish, pause / play, currentTime, reverse, cancel
     (oncancel, the finished promise rejected), finish(), fill, playbackRate, easing,
     getAnimations(), commitStyles(); requestAnimationFrame paced by the frames (its time
     stamps, cancelAnimationFrame). Each check logs "OK waapi name" / "FAIL waapi name"; the
     last line is "waapi done N". -->
<style>
body { margin: 0; font: 14px sans-serif; }
.box { position: absolute; left: 10px; width: 50px; height: 20px; background: #69c; }
</style></head><body>
<div class="box" id="a" style="top: 10px"></div><div class="box" id="b" style="top: 40px"></div>
<div class="box" id="c" style="top: 70px"></div><div class="box" id="d" style="top: 100px"></div>
<div class="box" id="e" style="top: 130px"></div><div class="box" id="f" style="top: 160px"></div>
<div class="box" id="g" style="top: 190px"></div><div class="box" id="h" style="top: 220px"></div>
<div class="box" id="i" style="top: 250px"></div>
<script>
let n = 0, pending = 0;
function check(name, cond, extra) {
  n++;
  console.log((cond ? 'OK ' : 'FAIL ') + 'waapi ' + name + (cond || extra === undefined ? '' : ' (' + extra + ')'));
}
const $ = id => document.getElementById(id);
const cs = (id, p) => getComputedStyle($(id)).getPropertyValue(p);
const num = v => parseFloat(v);
const tx = v => { const m = /matrix\(([^)]*)\)/.exec(v); return m ? +m[1].split(',')[4] : (v === 'none' ? 0 : NaN); };
const at = (ms, fn) => { pending++; setTimeout(() => { try { fn(); } catch (e) { check('exception ' + e, false); } if (--pending === 0) console.log('waapi done ' + n); }, ms); };

check('classes', typeof Animation === 'function' && typeof KeyframeEffect === 'function' &&
  typeof $('a').animate === 'function' && document.timeline instanceof DocumentTimeline);

/* a: keyframes array, 400 ms, finished + onfinish */
const a = $('a').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400 });
let onfinish = 0, finishedResolved = false;
a.onfinish = () => onfinish++;
a.finished.then(x => { finishedResolved = x === a; });
check('playState running', a.playState === 'running', a.playState);
check('instanceof', a instanceof Animation && a.effect instanceof KeyframeEffect);
check('getKeyframes', a.effect.getKeyframes().length === 2 && a.effect.getKeyframes()[1].offset === 1);
check('getTiming', a.effect.getTiming().duration === 400);

/* b: property-indexed, transform, easing, fill forwards */
const b = $('b').animate({ transform: ['translateX(0px)', 'translateX(100px)'] },
  { duration: 300, fill: 'forwards', easing: 'ease-in-out' });

/* c: paused, currentTime set */
const c = $('c').animate([{ marginLeft: '0px' }, { marginLeft: '200px' }], 2000);
c.pause();
c.currentTime = 1000;

/* d: cancel */
const d = $('d').animate([{ opacity: 0.2 }, { opacity: 0.2 }], { duration: 5000 });
let oncancel = 0, rejected = '';
d.oncancel = () => oncancel++;
d.finished.catch(e => { rejected = e.name; });

/* e: finish() at once, fill both */
const e = $('e').animate([{ opacity: 0.3 }, { opacity: 0.7 }], { duration: 10000, fill: 'both' });

/* f: iterations + direction + delay */
const f = $('f').animate([{ transform: 'translateX(0px)' }, { transform: 'translateX(100px)' }],
  { duration: 300, iterations: 3, direction: 'alternate', delay: 100 });

/* g: playbackRate 2 */
const g = $('g').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 800 });
g.playbackRate = 2;

/* i: animations filling forwards, one after the other: the earlier ones replaced */
const i1 = $('i').animate([{ opacity: 1 }, { opacity: 0.5 }], { duration: 100, fill: 'forwards' });
const i2 = $('i').animate([{ opacity: 1 }, { opacity: 0.4 }], { duration: 150, fill: 'forwards' });
let removed = 0;
i1.onremove = () => removed++;

/* h: reverse midway */
const h = $('h').animate([{ transform: 'translateX(0px)' }, { transform: 'translateX(200px)' }], 600);

at(10, () => {
  e.finish();
  check('finish()', Math.abs(num(cs('e', 'opacity')) - 0.7) < 0.01 && e.playState === 'finished', cs('e', 'opacity') + ' ' + e.playState);
  check('document.getAnimations', document.getAnimations().length >= 7, document.getAnimations().length);
  check('element.getAnimations', $('a').getAnimations().length === 1 && $('a').getAnimations()[0] === a);
  d.cancel();
});
at(200, () => {
  const o = num(cs('a', 'opacity'));
  check('opacity midway', o > 0.25 && o < 0.8, o);
  check('currentTime', a.currentTime > 120 && a.currentTime < 320, a.currentTime);
  check('paused at currentTime', Math.abs(num(cs('c', 'margin-left')) - 100) < 1 && c.playState === 'paused', cs('c', 'margin-left') + ' ' + c.playState);
  check('cancelled: base value', num(cs('d', 'opacity')) === 1 && d.playState === 'idle', cs('d', 'opacity') + ' ' + d.playState);
  const og = num(cs('g', 'opacity'));
  check('playbackRate 2', og < 0.7, og);
  h.reverse();
  c.play();
});
at(700, () => {
  check('finished', a.playState === 'finished' && onfinish === 1 && finishedResolved, a.playState + ' ' + onfinish + ' ' + finishedResolved);
  check('fill none: base', num(cs('a', 'opacity')) === 1, cs('a', 'opacity'));
  check('fill forwards', tx(cs('b', 'transform')) === 100, cs('b', 'transform'));
  check('cancel events', oncancel === 1 && rejected === 'AbortError', oncancel + ' ' + rejected);
  check('reversed back to the start', tx(cs('h', 'transform')) === 0 && h.playState === 'finished', cs('h', 'transform') + ' ' + h.playState);
  const mc = num(cs('c', 'margin-left'));
  check('resumed from 1000 ms', mc > 140, mc);
  const ff = tx(cs('f', 'transform'));
  check('iterations alternate', ff >= 0 && ff <= 100 && f.playState === 'running', ff + ' ' + f.playState);
  check('fill both after finish', Math.abs(num(cs('e', 'opacity')) - 0.7) < 0.01, cs('e', 'opacity'));
  check('replaced', removed === 1 && i1.replaceState === 'removed' && $('i').getAnimations().length === 1 &&
    Math.abs(num(cs('i', 'opacity')) - 0.4) < 0.01, removed + ' ' + i1.replaceState + ' ' + $('i').getAnimations().length + ' ' + cs('i', 'opacity'));
  check('finished without fill: gone, state kept', a.currentTime === 400 && a.effect.getComputedTiming().progress === null, a.currentTime);
  /* commitStyles: the value kept in the style attribute */
  b.commitStyles();
  b.cancel();
});
at(900, () => {
  check('commitStyles', tx(cs('b', 'transform')) === 100 && /transform/.test($('b').getAttribute('style') || ''), cs('b', 'transform') + ' ' + $('b').getAttribute('style'));
  /* play again after the end */
  a.play();
  check('play again', a.playState === 'running', a.playState);
});

/* requestAnimationFrame: frames with increasing times, ~60 Hz, the times on performance.now()'s clock */
const times = [];
let cancelled = true;
const frame = t => { times.push(t); if (times.length < 20) requestAnimationFrame(frame); };
requestAnimationFrame(frame);
const cid = requestAnimationFrame(() => { cancelled = false; });
cancelAnimationFrame(cid);
at(1200, () => {
  check('rAF frames', times.length === 20, times.length);
  check('rAF times increase', times.every((t, i) => i === 0 || t > times[i - 1]), times.join(','));
  const span = times[times.length - 1] - times[0];
  check('rAF pace', span > 150 && span < 1000, span);
  check('rAF time is performance.now', Math.abs(times[0] - performance.now()) < 2000 && times[0] > 0, times[0]);
  check('cancelAnimationFrame', cancelled);
  check('iterations done', f.playState === 'finished' && tx(cs('f', 'transform')) === 0, f.playState + ' ' + cs('f', 'transform'));
});
</script>
</body></html>
