<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>HTTP/2</title></head>
<body><p>fetch / XHR over HTTP/2 (httptest.sh: h2srv.py, https://127.0.0.1)</p>
<script>
/* Each check logs "h2 <name> <result>": the scripts' requests over one HTTP/2 connection --
 * a POST body, a body bigger than the flow-control windows, a streamed response read as it
 * comes (fetch's reader, XHR's progress), many requests at once, the cookies. */
const log = s => console.log(s);

async function run() {
	const e = await fetch('/echo', { method: 'POST', body: 'hello h2', headers: { 'Content-Type': 'text/plain' } });
	log('h2 echo ' + e.status + ' ' + (await e.text()).split(' cookie=')[0]);

	const b = await fetch('/big?n=3000000');
	const ab = await b.arrayBuffer();
	const u8 = new Uint8Array(ab);
	let ok = ab.byteLength === 3000000;
	for (let i = 0; ok && i < u8.length; i += 9973) ok = u8[i] === i % 251;
	log('h2 big ' + ab.byteLength + ' ' + ok);

	const t0 = Date.now();
	const s = await fetch('/stream?n=5');
	log('h2 stream head ' + s.status + ' early=' + (Date.now() - t0 < 700));
	const rd = s.body.getReader();
	let parts = 0, text = '', first = 0;
	for (;;) {
		const { value, done } = await rd.read();
		if (done) break;
		if (parts++ === 0) first = Date.now() - t0;
		text += new TextDecoder().decode(value);
	}
	log('h2 stream parts>2=' + (parts > 2) + ' first<600=' + (first < 600) + ' ' + text.trim().split('\n').length + ' lines');

	const all = await Promise.all(Array.from({ length: 24 }, (_, i) =>
		fetch('/small?i=' + i).then(r => r.text())));
	log('h2 parallel ' + all.filter((t, i) => t === 'small ' + i).length);

	const c = await fetch('/echo');
	log('h2 cookie ' + /sid=abc123/.test(await c.text()));

	const x = new XMLHttpRequest();
	let progress = 0;
	x.onprogress = () => { progress++; };
	x.onload = () => {
		log('h2 xhr ' + x.status + ' progress>1=' + (progress > 1) + ' ' + x.responseText.trim().split('\n').length);
		log('h2 done');
	};
	x.open('GET', '/stream?n=4');
	x.send();
}
run().catch(err => log('h2 error ' + err));
</script></body></html>
