<!doctype html>
<!-- dltest.sh (docs/06 §38): the page zoom -- what the scripts see (devicePixelRatio, innerWidth,
     scrollY: CSS px), a click on the red box mapped through the zoom -->
<title>Zoom</title>
<style>
body { margin: 0; font: 16px sans-serif; }
#t { position: absolute; left: 100px; top: 100px; width: 100px; height: 50px; background: #c33; }
#tall { height: 3000px; }
</style>
<div id=t></div><div id=tall></div>
<script>
let last = '';
setInterval(() => {
	const s = 'zoominfo dpr ' + devicePixelRatio + ' w ' + innerWidth + ' h ' + innerHeight + ' sy ' + scrollY;
	if (s !== last) { last = s; console.log(s); }
}, 100);
document.getElementById('t').addEventListener('click', e => console.log('hit-target ' + e.clientX + ',' + e.clientY));
document.addEventListener('click', e => console.log('click-at ' + e.clientX + ',' + e.clientY));
</script>
