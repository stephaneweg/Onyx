<!DOCTYPE html>
<html><head><title>frame input child</title>
<style>body { margin: 0; background: #eef } #t { position: absolute; left: 10px; top: 10px; width: 100px; height: 20px; }
#c { position: absolute; left: 130px; top: 12px; width: 13px; height: 13px; margin: 0 } #tall { height: 900px }</style></head>
<body>
<!-- Onyx: the frame of frames-input.html (iframetest.sh): a click, typing and the wheel in it -->
<input id="t"><input type="checkbox" id="c"><div id="tall"></div>
<script>
var n = new URLSearchParams(location.search).get('n') || '';
window.childVar = 'v' + n;
document.getElementById('t').addEventListener('input', function () { console.log('framein ' + n + ' input ' + this.value); });
document.getElementById('t').addEventListener('focus', function () { console.log('framein ' + n + ' focus'); });
document.getElementById('c').addEventListener('click', function () { console.log('framein ' + n + ' checkbox ' + this.checked); });
var said = false;
window.addEventListener('scroll', function () { if (!said && window.scrollY > 0) { said = true; console.log('framein ' + n + ' scrolled'); } });
document.addEventListener('keydown', function (e) { if (e.key === 'Enter') console.log('framein ' + n + ' enter'); });
</script>
</body></html>
