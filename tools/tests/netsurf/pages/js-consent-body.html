<!doctype html>
<html style="height:100%;overflow:hidden"><head><meta charset="utf-8"><title>consent: the body scrolls</title>
<style>
body { margin: 0; height: 100%; overflow-y: auto; font: 15px sans-serif; }
.card { height: 300px; margin: 12px 16px; background: #eee; }
#allow { display: block; margin: 16px; height: 40px; }
</style></head>
<body>
<h1 style="margin:16px">Voulez-vous autoriser les cookies ?</h1>
<div class="card">1</div><div class="card">2</div><div class="card">3</div><div class="card">4</div>
<button id="allow" type="button">Autoriser tous les cookies</button>
<script>
var a = document.getElementById('allow');
document.body.addEventListener('scroll', function () { console.log('body scrolled'); });
a.addEventListener('click', function () { console.log('allowed'); });
</script>
</body></html>
