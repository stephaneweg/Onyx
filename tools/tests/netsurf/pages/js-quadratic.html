<!doctype html><html><head><title>quadratic audit: behaviour</title></head><body>
<!-- Onyx: what the quadratic audit's fixes (docs/06-JET-BROWSER.md §36) must keep: the kept
     child lists and tag lists follow the tree, getElementById its index, compareDocumentPosition,
     the options collection's writes, the listeners, the mutation observers, the timers' order,
     form.elements. Each check logs "OK quad <name>" / "FAIL quad <name> ...", then "quad done N". -->
<div id="root"><p id="a">a</p><p id="b">b</p><span id="c">c</span></div>
<form id="f"><input name="i1"></form><input form="f" name="i2">
<select id="s"><option>o0</option><option>o1</option><optgroup><option>o2</option></optgroup></select>
<script>
var n = 0;
function check(name, ok, info) { n++; console.log((ok ? 'OK quad ' : 'FAIL quad ') + name + (ok ? '' : ' ' + info)); }
var root = document.getElementById('root');

/* child lists: the same object while unchanged, a new one after a change */
var k1 = root.childNodes, k2 = root.childNodes;
check('childNodes same', k1 === k2 && k1.length === 3, k1.length);
root.appendChild(document.createElement('i'));
check('childNodes after append', root.childNodes.length === 4 && k1.length === 3, root.childNodes.length);
check('children', root.children.length === 4 && root.children[3].localName === 'i' && root.childElementCount === 4, root.children.length);
root.removeChild(root.lastChild);
check('children after remove', root.children.length === 3, root.children.length);
check('tag list', document.getElementsByTagName('p').length === 2, document.getElementsByTagName('p').length);
var extra = document.createElement('p'); root.appendChild(extra);
check('tag list after append', document.getElementsByTagName('p').length === 3, document.getElementsByTagName('p').length);
root.removeChild(extra);
var t = document.createTextNode('x'); document.getElementById('a').appendChild(t);
check('text child', document.getElementById('a').childNodes.length === 2, document.getElementById('a').childNodes.length);

/* structural pseudo-classes */
check('nth-child', [].map.call(root.querySelectorAll(':nth-child(2n+1)'), function (e) { return e.id; }).join() === 'a,c', '');
check('nth-last-child', root.querySelector('p:nth-last-child(2)').id === 'b', '');
check('of-type', root.querySelector('p:last-of-type').id === 'b' && root.querySelector('span:only-of-type').id === 'c' && root.querySelector('p:first-of-type').id === 'a', '');
check('nth-of-type', [].map.call(root.querySelectorAll('p:nth-of-type(2)'), function (e) { return e.id; }).join() === 'b', '');

/* getElementById: changes, removals, duplicates, detached elements */
var b = document.getElementById('b');
b.id = 'b2';
check('byId renamed', document.getElementById('b') === null && document.getElementById('b2') === b, '');
b.id = 'b';
var dup = document.createElement('div'); dup.id = 'b';
document.body.appendChild(dup);
check('byId duplicate first', document.getElementById('b') === b, '');
root.removeChild(b);
check('byId removed', document.getElementById('b') === dup, '');
dup.remove();
check('byId none', document.getElementById('b') === null, '');
root.insertBefore(b, document.getElementById('c'));
check('byId back', document.getElementById('b') === b && document.querySelector('#b') === b, '');
var det = document.createElement('div'); det.id = 'det';
check('byId detached', document.getElementById('det') === null, '');
var wrap = document.createElement('div'); wrap.innerHTML = '<span id="deep"><b id="deeper"></b></span>';
document.body.appendChild(wrap);
check('byId subtree inserted', document.getElementById('deeper') !== null && document.getElementById('deep').firstChild === document.getElementById('deeper'), '');
wrap.firstChild.removeAttribute('id');
check('byId attribute removed', document.getElementById('deep') === null, '');
wrap.remove();
check('byId subtree removed', document.getElementById('deeper') === null, '');
var tpl = document.createElement('template'); tpl.innerHTML = '<i id="intpl"></i>'; document.body.appendChild(tpl);
check('byId not in a template', document.getElementById('intpl') === null, '');

/* compareDocumentPosition */
var a = document.getElementById('a'), c = document.getElementById('c');
check('cdp following', a.compareDocumentPosition(c) === 4 && c.compareDocumentPosition(a) === 2, a.compareDocumentPosition(c));
check('cdp contains', root.compareDocumentPosition(a) === 20 && a.compareDocumentPosition(root) === 10, '');
check('cdp disconnected', a.compareDocumentPosition(det) === 1 && a.compareDocumentPosition(a) === 0, '');
check('cdp deep', a.firstChild.compareDocumentPosition(document.getElementById('s')) === 4, '');

/* the options collection */
var s = document.getElementById('s');
check('options', s.options.length === 3 && s.length === 3 && s.options === s.options && s.options[2].index === 2, s.options.length);
s.options[s.options.length] = new Option('o3', 'v3');
check('options set at the end', s.length === 4 && s.options[3].value === 'v3', s.length);
s.options.length = 1;
check('options length cut', s.length === 1 && s.options[0].text === 'o0', s.length);
s.options.length = 0;
check('options cleared', s.length === 0 && s.options.length === 0, s.length);
s.add(new Option('x', 'x'));
check('options after add', s.options.length === 1 && s.options[0].index === 0, s.options.length);

/* form.elements follows the tree */
var f = document.getElementById('f');
check('form elements', f.elements.length === 2, f.elements.length);
var in3 = document.createElement('input'); in3.name = 'i3'; f.appendChild(in3);
check('form elements after append', f.elements.length === 3 && f.elements.namedItem('i3') === in3, f.elements.length);
in3.setAttribute('form', 'none'); in3.remove();
check('form elements after remove', f.elements.length === 2, f.elements.length);

/* listeners: once each, removal, order */
var log = [];
function l1() { log.push(1); } function l2() { log.push(2); }
root.addEventListener('ping', l1); root.addEventListener('ping', l2); root.addEventListener('ping', l1);
root.addEventListener('ping', l1, true);
root.dispatchEvent(new Event('ping'));
check('listeners once each', log.join() === '1,1,2' || log.join() === '1,2,1', log.join());
log = [];
root.removeEventListener('ping', l1); root.removeEventListener('ping', l1, true);
root.addEventListener('ping', l1);
root.dispatchEvent(new Event('ping'));
check('listener removed and added again: last', log.join() === '2,1', log.join());
var many = []; log = [];
for (var i = 0; i < 100; i++) { (function (k) { var f = function () { log.push(k); }; many.push(f); root.addEventListener('pong', f); })(i); }
for (var i = 0; i < 100; i += 2) root.removeEventListener('pong', many[i]);
root.dispatchEvent(new Event('pong'));
check('many listeners removed', log.length === 50 && log[0] === 1 && log[49] === 99, log.length);

/* mutation observers: nested targets give a record once */
var recs = 0, recsB = 0;
var mo = new MutationObserver(function (l) { recs += l.length; });
mo.observe(root, { childList: true, subtree: true });
mo.observe(a, { childList: true });
var moB = new MutationObserver(function (l) { recsB += l.length; });
moB.observe(a, { attributes: true });
a.appendChild(document.createElement('u'));
a.setAttribute('title', 'x');
document.body.appendChild(document.createElement('u'));

/* the timers: due together, in the order they were set */
var order = [];
setTimeout(function () { order.push('a'); }, 0);
setTimeout(function () { order.push('b'); }, 0);
var cleared = setTimeout(function () { order.push('x'); }, 0);
setTimeout(function () { order.push('c'); }, 0);
clearTimeout(cleared);
setTimeout(function () { order.push('d'); }, 20);
setTimeout(function () {
	check('timers in order', order.join() === 'a,b,c,d', order.join());
	check('observer records once', recs === 1 && recsB === 1, recs + ' ' + recsB);
	mo.disconnect();
	a.appendChild(document.createElement('u'));
	setTimeout(function () {
		check('observer disconnected', recs === 1, recs);
		console.log('quad done ' + n);
	}, 10);
}, 100);
</script></body></html>
