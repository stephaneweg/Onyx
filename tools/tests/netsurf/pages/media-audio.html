<!doctype html>
<!-- mediatest.sh: <audio controls src=?src> played to the end (the sound: SIM_SOUNDOUT), then
     new Audio(?second) played; the events, the duration, volume / muted / playbackRate. -->
<html><head><title>media-audio</title></head>
<body style="margin:8px;background:#fff">
<audio id="a" controls></audio>
<p>after</p>
<script>
const q = new URLSearchParams(location.search);
const a = document.getElementById('a');
const seen = [];
for (const e of ['loadstart', 'durationchange', 'loadedmetadata', 'loadeddata', 'canplay', 'canplaythrough', 'play',
		'playing', 'pause', 'ended', 'error', 'volumechange', 'ratechange'])
	a.addEventListener(e, () => { seen.push(e); console.log('ev ' + e + ' t=' + a.currentTime.toFixed(2) + ' rs=' + a.readyState); });
a.volume = 0.5;
a.volume = 1;
a.addEventListener('canplay', () => { if (!a._s) { a._s = 1; a.play(); } });
a.addEventListener('ended', () => {
	const s = __onyxMediaStats(a);
	console.log('summary duration=' + a.duration.toFixed(3) + ' t=' + a.currentTime.toFixed(3) + ' sound=' + s.sound +
		' rect=' + Math.round(a.getBoundingClientRect().width) + 'x' + Math.round(a.getBoundingClientRect().height));
	console.log('order ' + seen.join(','));
	if (q.get('second')) {
		const b = new Audio(q.get('second'));
		b.addEventListener('loadedmetadata', () => console.log('second duration=' + b.duration.toFixed(3) + ' paused=' + b.paused));
		b.addEventListener('ended', () => { console.log('second ended t=' + b.currentTime.toFixed(3)); console.log('done'); });
		b.play().then(() => console.log('second play resolved'), e => console.log('second play rejected ' + e.name));
	} else {
		console.log('done');
	}
});
a.src = q.get('src') || 'tone.flac';
</script>
</body></html>
