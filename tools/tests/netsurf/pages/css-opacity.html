<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>opacity groups</title>
<!-- Onyx: compositing groups (docs/06 §21). fxtest.sh compares it with Chromium pixel by pixel
     (the regions below, no text); jstest.sh checks the clicks and the rectangles. -->
<style>
html, body { margin: 0; background: #fff; }
.mark { position: absolute; left: 0; top: 0; width: 6px; height: 6px; background: #f0f; }
.cell { position: absolute; width: 140px; height: 140px; }
.sq { position: absolute; width: 80px; height: 80px; }
.r { background: #e00; } .g { background: #0a0; } .b { background: #00d; } .y { background: #fc0; }
</style></head><body>
<div class="mark"></div>

<!-- 1: an opacity over the page -->
<div class="cell" style="left:10px; top:10px">
  <div class="sq r" style="left:10px; top:10px; opacity:.5"></div>
</div>

<!-- 2: a group: two overlapping children in a translucent parent (no double blend where
     they overlap) -->
<div class="cell" style="left:160px; top:10px; background:#ddd">
  <div style="position:absolute; left:0; top:0; width:140px; height:140px; opacity:.5">
    <div class="sq b" style="left:10px; top:10px"></div>
    <div class="sq y" style="left:50px; top:50px"></div>
  </div>
</div>

<!-- 3: nested opacities -->
<div class="cell" style="left:310px; top:10px">
  <div style="position:absolute; left:10px; top:10px; width:120px; height:120px; background:#0a0; opacity:.6">
    <div style="position:absolute; left:20px; top:20px; width:80px; height:80px; background:#00d; opacity:.5"></div>
  </div>
</div>

<!-- 4: opacity on a z-indexed positioned box over its sibling, and a static one under -->
<div class="cell" style="left:460px; top:10px">
  <div class="sq r" style="left:10px; top:10px; z-index:2; opacity:.7"></div>
  <div class="sq b" style="left:50px; top:50px; z-index:1"></div>
</div>

<!-- 5: an opacity group is a stacking context: its positioned child stays inside it -->
<div class="cell" style="left:610px; top:10px">
  <div style="width:100px; height:100px; margin:10px; background:#0a0; opacity:.5">
    <div style="position:relative; left:30px; top:30px; width:80px; height:80px; background:#00d"></div>
  </div>
</div>

<!-- 6: opacity 0 (nothing drawn: still clicked) -->
<div class="cell" style="left:310px; top:160px; background:#ddd">
  <div id="zero" class="sq r" style="left:30px; top:30px; opacity:0"></div>
</div>

<!-- 7: a static box with an opacity over a later sibling's (painted after the in-flow
     content, as a positioned box with z-index 0) -->
<div class="cell" style="left:10px; top:160px">
  <div style="width:80px; height:80px; background:#e00; opacity:.5; margin:10px"></div>
  <div style="width:80px; height:80px; background:#00d; margin-top:-50px; margin-left:50px"></div>
</div>

<!-- 8: a rounded, shadowed translucent card -->
<div class="cell" style="left:160px; top:160px; background:#fc0">
  <div style="position:absolute; left:20px; top:20px; width:100px; height:100px; background:#00d; border-radius:20px; box-shadow:4px 4px 8px #000; opacity:.4"></div>
</div>

<script>
document.getElementById('zero').addEventListener('click', function () {
  console.log('opacity 0 clicked');
});
var r = document.getElementById('zero').getBoundingClientRect();
console.log('zero rect ' + r.left + ',' + r.top + ',' + r.width + ',' + r.height);
</script>
</body></html>
