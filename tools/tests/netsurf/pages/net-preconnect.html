<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Preconnect</title>
<script>
/* (nettest.sh: the second server, on the next port, preconnected while the page is parsed) */
const other = 'http://127.0.0.1:' + (+location.port + 1);
document.write('<link rel="preconnect" href="' + other + '/">');
document.write('<link rel="dns-prefetch" href="//localhost:' + location.port + '/">');
</script>
</head>
<body><p>&lt;link rel=preconnect&gt; and &lt;link rel=dns-prefetch&gt;</p>
<script>
setTimeout(async () => {
	const r = await fetch(other + '/cors?acao=origin&t=pre');
	console.log('preconnect fetch ' + r.status);
}, 800);
</script>
</body></html>
