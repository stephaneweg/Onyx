<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160" viewBox="0 0 320 160">
  <style>
    .axis { stroke: #5f6368; stroke-width: 1 }
    .label { font-family: Arial, sans-serif; font-size: 12px; fill: #3c4043 }
    .title { font: bold 16px sans-serif; }
  </style>
  <rect width="320" height="160" fill="#fff"/>
  <text x="160" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#202124">Visitors &amp; pages</text>
  <line class="axis" x1="40" y1="130" x2="300" y2="130"/>
  <line class="axis" x1="40" y1="30" x2="40" y2="130"/>
  <rect x="60" y="70" width="40" height="60" fill="#4285f4"/>
  <rect x="130" y="50" width="40" height="80" fill="#ea4335"/>
  <rect x="200" y="90" width="40" height="40" fill="#fbbc04"/>
  <text class="label" x="80" y="147" text-anchor="middle">Mon</text>
  <text class="label" x="150" y="147" text-anchor="middle">Tue</text>
  <text class="label" x="220" y="147" text-anchor="middle">Wed</text>
  <text class="label" x="35" y="134" text-anchor="end">0</text>
  <text class="label" x="35" y="54" text-anchor="end">80</text>
  <text x="250" y="45" font-size="11" fill="#34a853">max <tspan font-weight="bold">80</tspan> &#8594;</text>
</svg>
