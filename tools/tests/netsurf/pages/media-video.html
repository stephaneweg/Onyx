<!doctype html>
<!-- mediatest.sh: a <video src> played to the end (events, frames, pixels), then a seek.
     ?src=<file> (the clips of tools/tests/av/mkmedia.py, served by mediasrv.py) -->
<html><head><title>media-video</title></head>
<body style="margin:0;background:#fff">
<video id="v" width="192" height="128" controls></video>
<div id="out">-</div>
<script>
const q = new URLSearchParams(location.search);
const v = document.getElementById('v');
const seen = [];
for (const e of ['loadstart', 'durationchange', 'loadedmetadata', 'loadeddata', 'canplay', 'canplaythrough',
		'play', 'playing', 'pause', 'seeking', 'seeked', 'ended', 'waiting', 'error', 'emptied', 'resize'])
	v.addEventListener(e, () => {
		seen.push(e);
		console.log('ev ' + e + ' t=' + v.currentTime.toFixed(2) + ' rs=' + v.readyState + ' ns=' + v.networkState);
	});
let tu = 0, frames = 0, last = -1, mono = true, started = false, phase = 0;
v.addEventListener('timeupdate', () => { tu++; });
function rvfc() {
	v.requestVideoFrameCallback((now, m) => {
		frames++;
		if (m.mediaTime < last) mono = false;
		last = m.mediaTime;
		rvfc();
	});
}
rvfc();
v.addEventListener('canplay', () => {
	if (started) return;
	started = true;
	v.play().then(() => console.log('play resolved paused=' + v.paused), e => console.log('play rejected ' + e.name));
});
v.addEventListener('ended', () => {
	const f = __onyxMediaFrame(v);
	const pq = v.getVideoPlaybackQuality();
	console.log('summary frames=' + frames + ' mono=' + mono + ' timeupdates=' + tu + ' duration=' +
		v.duration.toFixed(2) + ' size=' + v.videoWidth + 'x' + v.videoHeight + ' paused=' + v.paused +
		' decoded=' + pq.totalVideoFrames + ' dropped=' + pq.droppedVideoFrames);
	console.log('order ' + seen.join(','));
	const s = __onyxMediaStats(v);
	console.log('stats sound=' + s.sound + ' sync_ms=' + (s.syncUs / 1000).toFixed(1) + ' decode_ms=' + (s.decodeUs / 1000).toFixed(2));
	console.log('buffered ' + v.buffered.length + ' ' + (v.buffered.length ? v.buffered.start(0).toFixed(2) + '-' + v.buffered.end(0).toFixed(2) : ''));
	if (f) console.log('frame pts=' + f[0].toFixed(3) + ' sum=' + f[1] + ' ' + f[2] + 'x' + f[3]);
	phase = 1;
	v.currentTime = +(q.get('seek') || 1.0);
});
v.addEventListener('seeked', () => {
	if (phase !== 1) return;
	phase = 2;
	/* the frame at the target: presented with seeked or soon after (a loaded machine) -- poll */
	const t0 = Date.now();
	const report = () => {
		const f = __onyxMediaFrame(v);
		if ((!f || Math.abs(f[0] - v.currentTime) > 0.001) && Date.now() - t0 < 5000) {
			setTimeout(report, 20);
			return;
		}
		console.log('seekframe t=' + v.currentTime.toFixed(3) + ' pts=' + (f ? f[0].toFixed(3) + ' sum=' + f[1] : 'none') +
			' paused=' + v.paused);
		console.log('done');
	};
	report();
});
v.addEventListener('error', () => console.log('error code=' + (v.error && v.error.code) + ' ' + (v.error && v.error.message)));
console.log('canPlayType webm=' + v.canPlayType('video/webm') + ' i420=' + v.canPlayType('video/webm; codecs="i420"') +
	' vp9=' + v.canPlayType('video/webm; codecs="vp9"') + ' mp4=' + v.canPlayType('video/mp4; codecs="i420"'));
v.src = q.get('src') || 'clip.webm';
</script>
</body></html>
