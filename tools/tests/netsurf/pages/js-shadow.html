<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Shadow DOM</title>
<!-- tools/tests/netsurf/jstest.sh: shadow DOM -- attachShadow, ShadowRoot, the encapsulation
     (children, serialization, selectors), slots (assignment, assignedNodes, slotchange),
     declarative shadow roots, custom elements in shadow trees, the events (retargeting,
     composedPath, composed), the style scoping (:host, ::slotted, ::part, adoptedStyleSheets,
     the document's rules not matching inside) and the boxes (the flat tree).
     "OK shadow name" / "FAIL shadow name", then "shadow done N". -->
<style>
  body { margin: 0; font: 16px sans-serif; }
  span { color: rgb(255, 0, 0); }
  .light { font-weight: bold; }
  #styled::part(label) { color: rgb(0, 0, 255); }
  #styled::part(other) { color: rgb(255, 0, 0); }
  x-card { color: rgb(10, 20, 30); }
  div.or { font-size: 11px; color: rgb(9, 9, 9); }
  #slotted-light { background-color: rgb(4, 4, 4); }
</style>
<script>
let n = 0;
function check(name, cond) { n++; console.log((cond ? 'OK ' : 'FAIL ') + 'shadow ' + name); }
function cs(el, p) { return getComputedStyle(el).getPropertyValue(p); }
</script>
</head><body>
<div id="host1"><span id="l1" class="light">light</span></div>
<x-card id="card"><span slot="title" id="t1">Title</span>Body text<b id="lb">bold</b><i slot="nowhere" id="nw">lost</i></x-card>
<div id="dsd"><template shadowrootmode="open"><p id="dp">declared <slot></slot></p><style>p { color: rgb(0, 128, 0); }</style></template><span id="dl">light</span></div>
<div id="dsd2"><template shadowrootmode="closed"><em>closed</em></template></div>
<div id="styled"></div>
<div id="outer-rule" class="or"><b id="slotted-light">x</b><i id="sl2">y</i></div>
<p id="after">after</p>
<script>
try {
  /* ---- attachShadow, ShadowRoot */
  const host1 = document.getElementById('host1');
  const r1 = host1.attachShadow({ mode: 'open' });
  check('ShadowRoot', r1 instanceof ShadowRoot && r1 instanceof DocumentFragment &&
    r1.nodeType === 11 && r1.nodeName === '#document-fragment');
  check('mode host', r1.mode === 'open' && r1.host === host1 && host1.shadowRoot === r1);
  check('delegatesFocus default', r1.delegatesFocus === false && r1.slotAssignment === 'named');
  let threw = '';
  try { host1.attachShadow({ mode: 'open' }); } catch (e) { threw = e.name; }
  check('attach twice', threw === 'NotSupportedError');
  threw = '';
  try { document.createElement('img').attachShadow({ mode: 'open' }); } catch (e) { threw = e.name; }
  check('img cannot', threw === 'NotSupportedError');
  threw = '';
  try { document.createElement('div').attachShadow({ mode: 'bogus' }); } catch (e) { threw = e.name; }
  check('bad mode', threw === 'TypeError');
  const closedHost = document.createElement('section');
  const rc = closedHost.attachShadow({ mode: 'closed' });
  check('closed', rc.mode === 'closed' && closedHost.shadowRoot === null && rc.host === closedHost);

  /* ---- the encapsulation */
  r1.innerHTML = '<span id="s1">shadow <b>text</b></span><slot></slot>';
  check('innerHTML', r1.innerHTML === '<span id="s1">shadow <b>text</b></span><slot></slot>' &&
    r1.childNodes.length === 2 && r1.firstChild.id === 's1');
  const s1 = r1.getElementById('s1');
  check('getElementById in root', s1 !== null && r1.querySelector('b').textContent === 'text');
  check('not in the host', host1.children.length === 1 && host1.firstElementChild.id === 'l1' &&
    host1.innerHTML === '<span id="l1" class="light">light</span>');
  check('not in the document', document.getElementById('s1') === null &&
    document.querySelector('#s1') === null && document.querySelectorAll('b').length === 2);
  check('parentNode', s1.parentNode === r1 && s1.parentElement === null && r1.parentNode === null);
  check('getRootNode', s1.getRootNode() === r1 && s1.getRootNode({ composed: true }) === document &&
    host1.getRootNode() === document);
  check('isConnected', s1.isConnected === true && r1.isConnected === true);
  check('contains', !host1.contains(s1) && r1.contains(s1));
  check('closest stops', s1.querySelector('b').closest('div') === null);

  /* ---- slots */
  const card = document.getElementById('card');
  const rs = card.attachShadow({ mode: 'open' });
  rs.innerHTML = '<header><slot name="title" id="st">Default title</slot></header>' +
    '<main><slot id="sd"></slot></main><footer><slot name="foot" id="sf"><em id="fb">fallback</em></slot></footer>';
  const st = rs.getElementById('st'), sd = rs.getElementById('sd'), sf = rs.getElementById('sf');
  const t1 = document.getElementById('t1'), lb = document.getElementById('lb');
  check('HTMLSlotElement', st instanceof HTMLSlotElement && st.name === 'title' && sd.name === '');
  check('assignedNodes named', st.assignedNodes().length === 1 && st.assignedNodes()[0] === t1);
  check('assignedNodes default', sd.assignedNodes().length === 2 &&
    sd.assignedNodes()[0].nodeType === 3 && sd.assignedNodes()[1] === lb &&
    sd.assignedElements().length === 1);
  check('assignedSlot', t1.assignedSlot === st && lb.assignedSlot === sd &&
    card.childNodes[1].assignedSlot === sd && document.getElementById('nw').assignedSlot === null);
  check('slot property', t1.slot === 'title' && lb.slot === '');
  check('flatten fallback', sf.assignedNodes().length === 0 &&
    sf.assignedNodes({ flatten: true }).length === 1 && sf.assignedNodes({ flatten: true })[0].id === 'fb');

  /* ---- declarative shadow roots */
  const dsd = document.getElementById('dsd');
  check('declarative', dsd.shadowRoot !== null && dsd.shadowRoot.mode === 'open' &&
    dsd.shadowRoot.getElementById('dp') !== null && dsd.querySelector('template') === null &&
    dsd.children.length === 1);
  check('declarative closed', document.getElementById('dsd2').shadowRoot === null &&
    document.getElementById('dsd2').querySelector('template') === null);
  check('declarative slot', dsd.shadowRoot.querySelector('slot').assignedNodes()[0] === document.getElementById('dl'));
  check('getHTML', dsd.getHTML({ serializableShadowRoots: false }).indexOf('shadowrootmode') < 0 &&
    host1.getHTML({ shadowRoots: [r1] }).startsWith('<template shadowrootmode="open"><span id="s1">'));

  /* ---- events */
  const log = [];
  document.addEventListener('ping', e => log.push('doc:' + (e.target.id || e.target.nodeName)));
  host1.addEventListener('ping', e => log.push('host:' + (e.target.id || e.target.nodeName)));
  r1.addEventListener('ping', e => log.push('root:' + (e.target.id || e.target.nodeName)));
  let path = null;
  s1.addEventListener('ping', e => { log.push('in:' + e.target.id); path = e.composedPath(); });
  s1.dispatchEvent(new Event('ping', { bubbles: true, composed: true }));
  check('retarget composed', log.join('|') === 'in:s1|root:s1|host:host1|doc:host1');
  check('composedPath', path && path[0] === s1 && path[1] === r1 && path[2] === host1 &&
    path.includes(document) && path[path.length - 1] === window);
  log.length = 0;
  s1.dispatchEvent(new Event('ping', { bubbles: true }));
  check('not composed stops', log.join('|') === 'in:s1|root:s1');
  log.length = 0;
  card.addEventListener('ping', e => log.push('card:' + e.target.id + ':' + e.composedPath().length));
  st.addEventListener('ping', e => log.push('slot:' + e.target.id));
  t1.dispatchEvent(new Event('ping', { bubbles: true }));
  check('through the slot', log.join('|').startsWith('slot:t1|card:t1'));
  const ev = new Event('ping', { bubbles: true, composed: true });
  s1.dispatchEvent(ev);
  check('target after', ev.target === host1);

  /* ---- custom elements in shadow trees */
  const clog = [];
  class XInner extends HTMLElement {
    connectedCallback() { clog.push('inner connected'); }
  }
  customElements.define('x-inner', XInner);
  class XOuter extends HTMLElement {
    constructor() { super(); this.attachShadow({ mode: 'open' }).innerHTML = '<x-inner id="xi"></x-inner><slot></slot>'; }
    connectedCallback() { clog.push('outer connected'); }
  }
  customElements.define('x-outer', XOuter);
  const xo = document.createElement('x-outer');
  /* (Chrome upgrades x-inner at once, NetSurf once connected -- as js-ce.html's detached
   * innerHTML: both connect it with its host) */
  check('ce shadow detached', xo.shadowRoot !== null && xo.shadowRoot.firstChild.id === 'xi' &&
    clog.length === 0);
  document.body.appendChild(xo);
  check('ce shadow connected', clog.join('|') === 'outer connected|inner connected' &&
    xo.shadowRoot.firstChild instanceof XInner);
  xo.remove();

  /* ---- slotchange */
  window.slotchanges = [];
  sd.addEventListener('slotchange', e => slotchanges.push(e.target.id));
  const nb = document.createElement('u');
  card.appendChild(nb);

  /* ---- styles: ::part, adoptedStyleSheets, :host() */
  const styled = document.getElementById('styled');
  const rst = styled.attachShadow({ mode: 'open' });
  rst.innerHTML = '<span part="label" id="pl">label</span><span id="np">plain</span><span part="x other" id="po">o</span>';
  const sheet = new CSSStyleSheet();
  sheet.replaceSync(':host { display: block; width: 300px; } span { background-color: rgb(1, 2, 3); } :host(.big) { font-size: 21px; }');
  const orr = document.getElementById('outer-rule').attachShadow({ mode: 'open' });
  orr.innerHTML = '<style>:host(#outer-rule.or) { font-size: 30px; color: rgb(0, 1, 2) !important; } ' +
    '::slotted(b) { background-color: rgb(5, 5, 5); color: rgb(6, 6, 6); } ::slotted(*) { font-size: 17px; } ' +
    ':host-context(body) p { color: rgb(7, 7, 7); } slot { color: rgb(8, 8, 8); }</style>' +
    '<p id="hc">p</p><slot id="osl"></slot>';
  rst.adoptedStyleSheets = [sheet];
  styled.classList.add('big');
  check('adoptedStyleSheets', rst.adoptedStyleSheets.length === 1 && rst.adoptedStyleSheets[0] === sheet);
  check('part', document.getElementById('pl') === null && rst.getElementById('pl').part.contains('label'));

  /* the boxes and styles, laid out (getComputedStyle / rects lay the changes out first) */
  check('style: document rule not inside', cs(s1, 'color') !== 'rgb(255, 0, 0)');
  check('style: inherited from host', cs(rs.querySelector('header'), 'color') === 'rgb(10, 20, 30)');
  check('style: light span keeps the document rule', cs(document.getElementById('l1'), 'color') === 'rgb(255, 0, 0)');
  check('style: declarative <style>', cs(dsd.shadowRoot.getElementById('dp'), 'color') === 'rgb(0, 128, 0)');
  check('style: a shadow <style> not the document\'s', cs(document.getElementById('after'), 'color') === 'rgb(0, 0, 0)' &&
    document.styleSheets.length === 1);
  check('style: ::part', cs(rst.getElementById('pl'), 'color') === 'rgb(0, 0, 255)' &&
    cs(rst.getElementById('np'), 'color') === 'rgb(0, 0, 0)' && cs(rst.getElementById('po'), 'color') === 'rgb(255, 0, 0)');
  check('style: adopted sheet', cs(rst.getElementById('np'), 'background-color') === 'rgb(1, 2, 3)');
  check('style: :host', cs(styled, 'width') === '300px');
  check('style: :host()', cs(styled, 'font-size') === '21px');
  const outer = document.getElementById('outer-rule');
  check('style: outer rule wins over :host', cs(outer, 'font-size') === '11px');
  check('style: inner !important wins', cs(outer, 'color') === 'rgb(0, 1, 2)');
  const sl1 = document.getElementById('slotted-light');
  check('style: outer rule wins over ::slotted', cs(sl1, 'background-color') === 'rgb(4, 4, 4)');
  check('style: ::slotted', cs(sl1, 'color') === 'rgb(6, 6, 6)' && cs(document.getElementById('sl2'), 'font-size') === '17px');
  check('style: slotted inherits from the slot', cs(document.getElementById('sl2'), 'color') === 'rgb(8, 8, 8)');
  check('style: :host-context', cs(orr.getElementById('hc'), 'color') === 'rgb(7, 7, 7)');
  sheet.replaceSync(':host { width: 200px; }');
  check('style: adopted sheet replaced', cs(styled, 'width') === '200px');

  const r = s1.getBoundingClientRect();
  check('box: shadow content drawn', r.width > 0 && r.height > 0);
  check('box: light child slotted drawn', document.getElementById('l1').getBoundingClientRect().width > 0);
  check('box: slotted drawn', t1.getBoundingClientRect().width > 0 && lb.getBoundingClientRect().width > 0);
  check('box: unassigned not drawn', document.getElementById('nw').getBoundingClientRect().width === 0);
  check('box: fallback drawn', rs.getElementById('fb').getBoundingClientRect().width > 0);
  check('box: slot order', t1.getBoundingClientRect().top < lb.getBoundingClientRect().top);
} catch (e) {
  console.log('FAIL shadow exception ' + e + ' ' + e.stack);
}
setTimeout(() => {
  try {
    check('slotchange', window.slotchanges && window.slotchanges.length >= 1 && window.slotchanges[0] === 'sd');
  } catch (e) { console.log('FAIL shadow late ' + e); }
  console.log('shadow done ' + n);
}, 100);
</script>
</body></html>
