<!DOCTYPE html>
<html>
<head><title>XML documents in frames</title></head>
<body>
<script>
// xmltest.sh: XML documents in frames, looked at through their contentDocument (docs/06 section 43).
var fails = 0, pending = 0;
function check(name, got, want) {
	if (got === want) console.log("XMLT ok " + name);
	else { fails++; console.log("XMLT FAIL " + name + ": got [" + got + "] want [" + want + "]"); }
}
function frame(src, f) {
	pending++;
	var i = document.createElement("iframe");
	i.width = 300; i.height = 150;
	i.onload = function () {
		try { f(i, i.contentDocument); } catch (e) { fails++; console.log("XMLT FAIL " + src + ": threw " + e); }
		if (--pending == 0) console.log("XMLT xmlframes done fails=" + fails);
	};
	i.src = src;
	document.body.appendChild(i);
}
var TREE = "This XML file does not appear to have any style information";
frame("data.xml", function (i, d) {
	check("tree view", d.body.textContent.indexOf(TREE) >= 0, true);
	check("tree view element", d.body.textContent.indexOf("<title>XML Developer's Guide</title>") >= 0, true);
	check("tree view namespaced attribute", d.body.textContent.indexOf('x:lang="en"') >= 0, true);
	check("tree view comment", d.body.textContent.indexOf("<!-- a catalog -->") >= 0, true);
	check("tree view cdata", d.body.textContent.indexOf("<![CDATA[a <cdata> section]]>") >= 0, true);
});
frame("data.xml?type=application/rss%2Bxml", function (i, d) {
	check("tree view of +xml", d.body.textContent.indexOf(TREE) >= 0, true);
});
frame("bad.xhtml", function (i, d) {
	check("error box", d.getElementsByTagName("parsererror").length, 1);
	check("error position", d.body.textContent.indexOf("error on line 6 at column 18") >= 0, true);
	check("error stops the parse", d.getElementsByTagName("script").length, 0);
});
frame("empty.xml", function (i, d) {
	check("encoding error", d.body.textContent.indexOf("error on line 2") >= 0, true);
});
frame("styled.xml", function (i, d) {
	check("xml+css root", d.documentElement.nodeName, "catalog");
	check("xml+css type", d.contentType, "application/xml");
	var t = d.getElementsByTagName("title")[0];
	check("xml+css style", i.contentWindow.getComputedStyle(t).color, "rgb(0, 128, 0)");
	check("xml+css element class", t instanceof i.contentWindow.HTMLElement, false);
});
frame("pic.svg", function (i, d) {
	check("svg document", d.documentElement.nodeName + " " + d.contentType, "svg image/svg+xml");
	check("getSVGDocument", i.getSVGDocument() === d, true);
	var r = d.getElementById("r");
	check("svg rect class", r instanceof i.contentWindow.SVGRectElement, true);
	check("svg rect width", r.width.baseVal.value, 180);
	var t = d.createElementNS("http://www.w3.org/2000/svg", "text");
	t.appendChild(d.createTextNode("abcd"));
	d.documentElement.appendChild(t);
	check("svg getNumberOfChars", t.getNumberOfChars(), 4);
});
frame("catalog.xml", function (i, d) {
	check("xslt in a frame", d.querySelectorAll("#cds tr").length, 5);
});
frame("page.xhtml", function (i, d) {
	check("xhtml in a frame", d.contentType + " " + d.getElementById("p1").tagName, "application/xhtml+xml p");
});
pending++;
var o = document.createElement("object");
o.width = 200; o.height = 120;
o.onload = function () {
	var d = o.contentDocument;
	check("object contentDocument", d && d.documentElement.nodeName, "svg");
	check("object getSVGDocument", o.getSVGDocument() === d, true);
	if (--pending == 0) console.log("XMLT xmlframes done fails=" + fails);
};
o.data = "pic.svg";
document.body.appendChild(o);
</script>
</body>
</html>
