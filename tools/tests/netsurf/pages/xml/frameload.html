<!DOCTYPE html>
<title>frame loads</title>
<p id="out">waiting</p>
<script>
// xmltest.sh: each frame's load event comes, whatever its resource; a frame on a type Jet does
// not show has an empty document; the XML ones their documents (docs/06 section 43)
var t0 = Date.now(), n = 0;
function add(src, tag) {
	var f = document.createElement(tag);
	f.onload = function () {
		n++;
		var d = f.contentDocument;
		console.log("XMLT load " + tag + " " + src + " doc=" +
			(d ? (d.documentElement ? d.documentElement.nodeName.toLowerCase() : "empty") : "null"));
		if (n == 6) console.log("XMLT loads done");
	};
	f.onerror = function () { n++; console.log("XMLT error " + tag + " " + src); };
	if (tag == 'object') f.data = src; else f.src = src;
	document.body.appendChild(f);
}
add("acid-svg.svg", "object");
add("blob.unk", "iframe");
add("nothere.html", "iframe");
add("empty.xml", "iframe");
add("xhtml1.txml", "iframe");
add("acid-svg.svg", "iframe");
function notify(s) { console.log("XMLT notify " + s); }
</script>
