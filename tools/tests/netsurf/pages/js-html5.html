<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>HTML5 DOM</title>
<!-- tools/tests/netsurf/jstest.sh: the HTML parser as the scripts see it (fragments in their
     context, namespaces, templates, serialisation, DOMParser) and the messaging APIs
     (MessageChannel, postMessage, structuredClone). Each check logs "OK name" / "FAIL name";
     the last line is "html5 done N". -->
</head><body>
<table id="t"><tr id="row"><td>x</td></tr></table>
<template id="tpl"><p class="in">in the template</p><script>window.tplRan = true;</script></template>
<svg id="svg" viewBox="0 0 10 10"><foreignObject><div>html</div></foreignObject><clipPath id="c"/></svg>
<math id="math"><mi>x</mi></math>
<select id="sel"><option>one<option>two</select>
<p id="p1">a<b>b<i>c</b>d</i>e</p>
<xyz:abc id="odd"></xyz:abc>
<script>
let n = 0;
function check(name, cond) { n++; console.log((cond ? 'OK ' : 'FAIL ') + 'html5 ' + name); }
try {
  /* the parser's tree */
  const p1 = document.getElementById('p1');
  check('adoption agency', p1.innerHTML === 'a<b>b<i>c</i></b><i>d</i>e');
  check('select options', document.getElementById('sel').children.length === 2);
  check('odd name', document.getElementById('odd').localName === 'xyz:abc');
  /* templates */
  const tpl = document.getElementById('tpl');
  check('template no children', tpl.childNodes.length === 0);
  check('template content', tpl.content.nodeType === 11 && tpl.content.firstChild.className === 'in');
  check('template script not run', window.tplRan !== true);
  check('template innerHTML', tpl.innerHTML.startsWith('<p class="in">in the template</p>'));
  tpl.innerHTML = '<td>cell</td>';
  check('template innerHTML set', tpl.content.firstChild.localName === 'td' && tpl.childNodes.length === 0);
  const clone = document.importNode(tpl.content, true);
  check('template content cloned', clone.firstChild.textContent === 'cell');
  /* namespaces */
  const svg = document.getElementById('svg');
  check('svg namespace', svg.namespaceURI === 'http://www.w3.org/2000/svg');
  check('svg tagName', svg.tagName === 'svg' && svg.firstChild.tagName === 'foreignObject');
  check('svg viewBox', svg.getAttribute('viewBox') === '0 0 10 10');
  check('svg class', svg instanceof SVGElement && svg instanceof Element && !(svg instanceof HTMLElement));
  check('foreignObject html', svg.firstChild.firstChild.namespaceURI === 'http://www.w3.org/1999/xhtml');
  check('clipPath', document.getElementById('c').localName === 'clipPath');
  check('math namespace', document.getElementById('math').namespaceURI === 'http://www.w3.org/1998/Math/MathML');
  check('html namespace', document.body.namespaceURI === 'http://www.w3.org/1999/xhtml' && document.body.tagName === 'BODY');
  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  check('createElementNS', circle.namespaceURI === 'http://www.w3.org/2000/svg' && circle.localName === 'circle');
  circle.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#a');
  check('setAttributeNS', circle.getAttributeNS('http://www.w3.org/1999/xlink', 'href') === '#a');
  check('unknown element', document.createElement('foo') instanceof HTMLUnknownElement &&
    !(document.createElement('foo-bar') instanceof HTMLUnknownElement) &&
    !(document.createElement('section') instanceof HTMLUnknownElement));
  /* fragments in their context */
  const row = document.getElementById('row');
  row.innerHTML = '<td>1</td><td>2</td>';
  check('innerHTML in a tr', row.cells ? row.cells.length === 2 : row.children.length === 2);
  const t = document.createElement('table');
  t.innerHTML = '<col>';
  check('innerHTML in a table', t.firstChild && t.firstChild.nodeName === 'COLGROUP');
  const h = document.createElement('html');
  h.innerHTML = '';
  check('innerHTML in html', h.firstChild && h.firstChild.nodeName === 'HEAD' && h.lastChild.nodeName === 'BODY');
  const d = document.createElement('div');
  d.innerHTML = '<table><form><input type=hidden><input></form><div></div></table>';
  check('foster parenting', d.firstChild.nodeName === 'INPUT' && d.lastChild.nodeName === 'TABLE');
  d.innerHTML = '&lang;&rang;&Kopf;&notinva;';
  check('entities', d.textContent === '⟨⟩𝕂∉');
  d.innerHTML = '<svg><path d="M0"/></svg><math><mi>x</mi></math>';
  check('foreign in innerHTML', d.firstChild.namespaceURI === 'http://www.w3.org/2000/svg' &&
    d.lastChild.namespaceURI === 'http://www.w3.org/1998/Math/MathML');
  const s = document.createElement('script');
  s.innerHTML = '<b>&amp;</b>';
  check('script innerHTML raw', s.textContent === '<b>&amp;</b>' && s.innerHTML === '<b>&amp;</b>');
  const ta = document.createElement('textarea');
  ta.innerHTML = '<b>&amp;</b>';
  check('textarea innerHTML rcdata', ta.textContent === '<b>&</b>');
  /* serialisation */
  d.innerHTML = '<p title="a&quot;b<>">x&nbsp;<br>&lt;</p><!--c-->';
  check('serialize', d.innerHTML === '<p title="a&quot;b&lt;&gt;">x&nbsp;<br>&lt;</p><!--c-->');
  check('outerHTML', d.firstChild.outerHTML.startsWith('<p title='));
  d.firstChild.outerHTML = '<span>1</span><span>2</span>';
  check('outerHTML set', d.children.length === 2 && d.firstChild.localName === 'span');
  const tr = document.createElement('tr');
  document.createElement('tbody').appendChild(tr);
  tr.insertAdjacentHTML('beforeend', '<td>a</td>');
  check('insertAdjacentHTML context', tr.firstChild && tr.firstChild.localName === 'td');
  const r = document.createRange();
  r.setStart(row, 0);
  check('createContextualFragment', r.createContextualFragment('<td>z</td>').firstChild.localName === 'td');
  /* documents */
  const doc = new DOMParser().parseFromString('<title>T</title><p id=x>hi', 'text/html');
  check('DOMParser html', doc.nodeType === 9 && doc.title === 'T' && doc.querySelector('p').textContent === 'hi');
  const x = new DOMParser().parseFromString('<a xmlns="urn:a"><b c="1">t</b></a>', 'application/xml');
  check('DOMParser xml', x.documentElement.localName === 'a' && x.documentElement.namespaceURI === 'urn:a' &&
    x.documentElement.firstChild.getAttribute('c') === '1');
  const bad = new DOMParser().parseFromString('<a><b></a>', 'text/xml');
  check('DOMParser xml error', bad.documentElement.localName === 'parsererror');
  check('XMLSerializer', new XMLSerializer().serializeToString(document.createElement('br')) ===
    '<br xmlns="http://www.w3.org/1999/xhtml" />');	/* (the XML serialization, as Chrome: docs/06 section 43) */
  const hd = document.implementation.createHTMLDocument('X');
  check('createHTMLDocument', hd.title === 'X' && hd.body !== null);
  /* structuredClone */
  const o = { a: [1, 'b', { c: new Date(5) }], m: new Map([[1, 2]]), s: new Set([3]), r: /x/g };
  o.self = o;
  const c2 = structuredClone(o);
  check('structuredClone', c2 !== o && c2.a[2].c.getTime() === 5 && c2.m.get(1) === 2 &&
    c2.s.has(3) && c2.r.flags === 'g' && c2.self === c2);
  let threw = false;
  try { structuredClone(() => 1); } catch (e) { threw = e.name === 'DataCloneError'; }
  check('structuredClone function', threw);
  const u8 = new Uint8Array([1, 2, 3]);
  check('structuredClone typed', structuredClone(u8)[2] === 3 && structuredClone(u8).buffer !== u8.buffer);
  /* messaging (asynchronous) */
  const order = [];
  const ch = new MessageChannel();
  ch.port2.onmessage = e => { order.push('m' + e.data.v); };
  ch.port1.postMessage({ v: 1 });
  ch.port1.postMessage({ v: 2 });
  Promise.resolve().then(() => order.push('micro'));
  order.push('sync');
  window.addEventListener('message', e => {
    order.push('w' + e.data);
    if (e.data === 9) {
      check('MessageChannel order', order.join(',') === 'sync,micro,m1,m2,w9');
      check('postMessage origin', e.origin === location.origin && e.source === window);
      const bc1 = new BroadcastChannel('b'), bc2 = new BroadcastChannel('b');
      bc2.onmessage = ev => {
        check('BroadcastChannel', ev.data === 'hi');
        console.log('html5 done ' + n);
      };
      bc1.postMessage('hi');
    }
  });
  setTimeout(() => window.postMessage(9, '*'), 10);
} catch (e) {
  console.log('FAIL html5 exception ' + e + ' ' + e.stack);
}
</script>
</body></html>
