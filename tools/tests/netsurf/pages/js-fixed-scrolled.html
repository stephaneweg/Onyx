<!doctype html>
<html><head><meta charset="utf-8"><title>a fixed dialog over a scrolled page</title>
<style>
/* a consent dialog fixed in the viewport over a page already scrolled down (docs/06 §41): the
   fixed boxes are laid out at the scroll offset 0 and painted where the viewport is -- the
   pointer, the wheel, the scripts' rectangles must find them there too */
html, body { margin: 0; font: 15px sans-serif; }
.long { height: 3000px; background: linear-gradient(#eef, #fee); }
#ov { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); }
#panel { position: absolute; top: 40px; left: 60px; width: 500px; height: 400px; overflow-y: auto;
	background: #fff; }
#panel p { margin: 0; height: 150px; border-bottom: 1px solid #ccc; }
#name { display: block; margin: 10px; width: 200px; }
#accept { display: block; margin: 10px; width: 160px; height: 40px; }
</style></head>
<body>
<div class="long">The page</div>
<div id="ov"><div id="panel">
 <input id="name" type="text">
 <p>Cookies 1</p><p>Cookies 2</p><p>Cookies 3</p><p>Cookies 4</p>
 <button id="accept" type="button">Accept</button>
</div></div>
<script>
var panel = document.getElementById('panel'), y0 = 0, said = false;
panel.addEventListener('scroll', function () {
	if (!said && panel.scrollTop > 0) { said = true; console.log('panel scrolled, page ' + (scrollY === y0 ? 'still' : 'moved ' + (scrollY - y0))); }
});
document.getElementById('accept').addEventListener('click', function () { console.log('accepted'); });
document.getElementById('name').addEventListener('input', function (e) { console.log('typed ' + e.target.value); });
addEventListener('load', function () {
	scrollTo(0, 500);
	y0 = scrollY;
	var r = panel.getBoundingClientRect();
	console.log('page at ' + scrollY + ', panel top ' + Math.round(r.top) + ', offsetTop ' + panel.offsetTop);
	var e = document.elementFromPoint(r.left + 100, r.top + 200);
	console.log('under the panel: ' + (e && panel.contains(e) ? 'the panel' : e ? e.tagName + '.' + e.className : 'none'));
});
</script>
</body></html>
