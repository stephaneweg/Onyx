<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Retained layers</title>
<!-- tools/tests/netsurf/gputest.sh: hovers that change only a layer's transform or opacity -- with
     gpu_compositing a composite, nothing painted (html_redraw_layer_update) -- and one that
     changes a colour too (painted as ever); text over and under the cards. -->
<style>
body { margin: 0; font: 15px sans-serif; background: #eef; }
.row { display: flex; gap: 40px; padding: 40px; }
.card { width: 160px; height: 110px; background: #fff; border-radius: 10px; padding: 10px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3); }
#a { transform: rotate(3deg); }
#a:hover { transform: rotate(-8deg) scale(0.95); }
#b { opacity: 0.9; }
#b:hover { opacity: 0.5; }
#c { transform: scale(0.9); opacity: 0.8; }
#c:hover { transform: scale(1.05); opacity: 1; background: #fd8; }
p { margin: 0 40px; }
</style></head><body>
<p>Hover the cards: a turns, b fades, c grows and changes colour.</p>
<div class="row"><div class="card" id="a">a: rotated</div><div class="card" id="b">b: faded</div>
<div class="card" id="c">c: scaled, faded</div></div>
<p>Text under the cards, text under the cards, text under the cards.</p>
</body></html>
