<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JS fetch</title></head>
<body>
<h1>fetch, XMLHttpRequest, Headers, Response</h1>
<div id="results"></div>
<script>
/* Each check logs "OK name" or "FAIL name"; "fetch: done" once the asynchronous ones are over.
 * The requests go to file:// (js-fetch.json next to this page), to data: URLs and to a missing
 * file -- the PC bench has no network. */
function check(name, cond) { console.log((cond ? 'OK ' : 'FAIL ') + name); }
const pending = [];

/* Headers, Response, Request: no network */
try {
  const h = new Headers({ 'Content-Type': 'text/plain', 'X-A': '1' });
  h.append('x-a', '2');
  check('Headers get', h.get('content-type') === 'text/plain' && h.get('X-A') === '1, 2');
  check('Headers iterate', [...h.keys()].join() === 'content-type,x-a');
  const r = new Response('{"a":1}', { status: 201, headers: { 'Content-Type': 'application/json' } });
  check('Response ok', r.ok && r.status === 201);
  pending.push(r.json().then(j => check('Response json', j.a === 1)));
  check('Response.json', Response.json({ b: 2 }).headers.get('content-type') === 'application/json');
  const q = new Request('js-fetch.json', { method: 'post', body: new URLSearchParams({ k: 'v w' }) });
  check('Request', q.method === 'POST' && /js-fetch\.json$/.test(q.url) &&
        q.headers.get('content-type').startsWith('application/x-www-form-urlencoded'));
  check('TextDecoder utf8', new TextDecoder().decode(new TextEncoder().encode('été')) === 'été');
} catch (e) { console.log('FAIL sync ' + e); }

/* fetch: a file, a data: URL, a missing file */
pending.push(fetch('js-fetch.json').then(r => {
  check('fetch status', r.status === 200 && r.ok);
  check('fetch url', /js-fetch\.json$/.test(r.url));
  return r.json();
}).then(j => check('fetch json', j.name === 'onyx' && j.list.length === 3))
  .catch(e => check('fetch json (' + e + ')', false)));

pending.push(fetch('data:text/plain,hello%20world').then(r => r.text())
  .then(t => check('fetch data:', t === 'hello world'))
  .catch(e => check('fetch data: (' + e + ')', false)));

pending.push(fetch('js-fetch-missing.json').then(r => check('fetch missing: not ok', !r.ok))
  .catch(() => check('fetch missing: rejected', true)));

/* fetch aborted */
{
  const c = new AbortController();
  const p = fetch('js-fetch.json', { signal: c.signal });
  c.abort();
  pending.push(p.then(() => check('fetch abort', false), e => check('fetch abort', e.name === 'AbortError')));
}

/* XMLHttpRequest */
pending.push(new Promise(done => {
  const x = new XMLHttpRequest();
  const states = [];
  x.onreadystatechange = () => states.push(x.readyState);
  x.onload = () => {
    check('xhr status', x.status === 200);
    check('xhr text', JSON.parse(x.responseText).name === 'onyx');
    check('xhr states', states.join() === '1,2,3,4');
    check('xhr header', x.getAllResponseHeaders().length >= 0);
    done();
  };
  x.onerror = () => { check('xhr (error)', false); done(); };
  x.open('GET', 'js-fetch.json');
  x.send();
}));
pending.push(new Promise(done => {
  const x = new XMLHttpRequest();
  x.responseType = 'json';
  x.addEventListener('load', () => { check('xhr json', x.response && x.response.list[1] === 2); done(); });
  x.addEventListener('error', () => { check('xhr json (error)', false); done(); });
  x.open('GET', 'js-fetch.json');
  x.send();
}));
pending.push(new Promise(done => {
  const x = new XMLHttpRequest();
  x.onabort = () => { check('xhr abort', x.readyState === 0 || x.readyState === 4); done(); };
  x.open('GET', 'js-fetch.json');
  x.send();
  x.abort();
}));

Promise.all(pending).then(() => console.log('fetch: done'));
</script>
</body></html>
