<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>HTML5 APIs</title>
<!-- tools/tests/netsurf/jstest.sh: history (pushState changes the URL, popstate), streams,
     Blob / File / FileReader / blob: URLs, and the other APIs of html5.js. "OK apis name" /
     "FAIL apis name", then "apis done N". -->
</head><body>
<p id="p">apis</p>
<script>
let n = 0;
function check(name, cond) { n++; console.log((cond ? 'OK ' : 'FAIL ') + 'apis ' + name); }
const steps = [];
function later(fn) { steps.push(fn); }
async function run() {
  /* history */
  const start = location.href;
  history.pushState({ a: 1 }, '', '?page=2#x');
  check('pushState url', location.search === '?page=2' && location.hash === '#x' && history.state.a === 1);
  history.replaceState({ a: 2 }, '');
  check('replaceState', history.state.a === 2 && history.length === 2);
  let pop = null;
  window.addEventListener('popstate', e => { pop = e.state; });
  history.back();
  await new Promise(r => setTimeout(r, 30));
  check('back popstate', pop === null && location.href === start);
  history.forward();
  await new Promise(r => setTimeout(r, 30));
  check('forward popstate', pop && pop.a === 2 && location.search === '?page=2');
  let threw = false;
  try { history.pushState(null, '', 'http://example.invalid/'); } catch (e) { threw = e.name === 'SecurityError'; }
  check('pushState other origin', threw);
  /* streams */
  const rs = new ReadableStream({ start(c) { c.enqueue('a'); c.enqueue('b'); c.close(); } });
  const reader = rs.getReader();
  const r1 = await reader.read(), r2 = await reader.read(), r3 = await reader.read();
  check('ReadableStream read', r1.value === 'a' && r2.value === 'b' && r3.done);
  let pulled = 0;
  const pulls = new ReadableStream({ pull(c) { pulled++; c.enqueue(pulled); if (pulled === 3) c.close(); } }, { highWaterMark: 0 });
  const got = [];
  for await (const v of pulls) got.push(v);
  check('ReadableStream pull + async iteration', got.join() === '1,2,3');
  const upper = new TransformStream({ transform(ch, c) { c.enqueue(String(ch).toUpperCase()); } });
  const out = [];
  await ReadableStream.from(['x', 'y']).pipeThrough(upper).pipeTo(new WritableStream({ write(ch) { out.push(ch); } }));
  check('pipeThrough / pipeTo', out.join('') === 'XY');
  const [t1, t2] = ReadableStream.from([1, 2]).tee();
  const a1 = []; for await (const v of t1) a1.push(v);
  const a2 = []; for await (const v of t2) a2.push(v);
  check('tee', a1.join() === '1,2' && a2.join() === '1,2');
  const td = new Response('héllo').body.pipeThrough(new TextDecoderStream());
  let txt = ''; for await (const s of td) txt += s;
  check('Response.body stream', txt === 'héllo');
  const resp = new Response('{"k":1}');
  check('body tested then json', !!resp.body && (await resp.json()).k === 1);
  /* Blob, File, FileReader, blob: URLs */
  const blob = new Blob(['ab', new Uint8Array([99]), new Blob(['é'])], { type: 'Text/Plain' });
  check('Blob bytes', blob.size === 5 && blob.type === 'text/plain' && (await blob.text()) === 'abcé');
  check('Blob slice', (await blob.slice(1, 3).text()) === 'bc' && (await blob.slice(-2).arrayBuffer()).byteLength === 2);
  const file = new File(['x'], 'f.txt', { lastModified: 5 });
  check('File', file.name === 'f.txt' && file.lastModified === 5 && file instanceof Blob);
  const fr = new FileReader();
  const dataURL = await new Promise(r => { fr.onload = () => r(fr.result); fr.readAsDataURL(new Blob(['hi'], { type: 'text/plain' })); });
  check('FileReader dataURL', dataURL === 'data:text/plain;base64,aGk=' && fr.readyState === 2);
  const url = URL.createObjectURL(blob);
  const fetched = await (await fetch(url)).text();
  check('blob: URL fetch', url.startsWith('blob:') && fetched === 'abcé');
  URL.revokeObjectURL(url);
  let failed = false;
  try { await fetch(url); } catch (e) { failed = true; }
  check('revokeObjectURL', failed);
  for (const s of steps) await s();
  console.log('apis done ' + n);
}
run().catch(e => console.log('FAIL apis exception ' + e + ' ' + e.stack));
</script>
</body></html>
