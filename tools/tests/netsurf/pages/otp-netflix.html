<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>one-time code: Netflix's InputPinCodeV2</title>
<!-- netflix.com's sign-in code step (docs/06 section 45), reduced: its design system's
     <InputPinCodeV2> (React) -- ONE text field (autocomplete="one-time-code",
     inputmode="numeric", pattern="[0-9]*"), its text transparent (caret-color black,
     monospace, letter-spacing / text-indent putting the caret on the next box), over its
     "chrome": a box absolutely positioned BEHIND it (z-index: -1 in the field wrapper's
     stacking context: position: relative; z-index: 0) that draws the six boxes from the
     value (filled digits, then placeholders). The value is React-controlled: onChange keeps
     the digits only, at most six (paste "98-76 54": 987654); on focus the caret goes to the
     end (setSelectionRange in an animation frame). -->
<style>
body { margin: 0; font: 16px sans-serif; }
.container { display: block; margin: 20px; }
.wrapper { align-items: center; color: black; display: inline-flex; font-size: 26px; gap: 4px;
  letter-spacing: normal; line-height: 100%; padding: 4px; position: relative; text-align: left;
  z-index: 0; --char-width: clamp(1ch, var(--char-width-px), 2ch); }
.wrapper > input { appearance: none; background: transparent; background-clip: padding-box;
  border: 0 solid transparent; color: inherit; font: inherit; letter-spacing: inherit;
  line-height: inherit; margin: 0; padding: 0; text-align: inherit; }
.wrapper > input { min-height: 32px; min-width: 32px; width: 300px; text-align: center;
  font-family: monospace; color: transparent; caret-color: black;
  letter-spacing: clamp(0ch, calc(var(--char-width) - 1ch), 1ch); }
.wrapper > input:focus, .wrapper > input:focus-visible { outline: 0; }
.chrome { align-items: center; background: rgb(255, 255, 255); border: 2px solid black;
  border-radius: 4px; bottom: 0; color: transparent; display: flex; justify-content: center;
  left: 0; position: absolute; right: 0; top: 0; user-select: none; z-index: -1; }
.chars { width: 100%; height: 100%; justify-content: center; align-items: center; display: flex; }
.char, .ph { text-align: center; display: inline-block; width: var(--char-width); }
.char { color: black; } .ph { color: darkgray; }
</style>
<script src="react/react.production.min.js"></script>
<script src="react/react-dom.production.min.js"></script>
</head><body>
<div id="app"></div>
<script>
var h = React.createElement;
var PATTERN = '******';
function digitsOnly(v) { return ('' + (v == null ? '' : v)).replace(/\D/g, '').slice(0, 6); }
function PinCode() {
	var st = React.useState(''), value = st[0], setValue = st[1];
	var rest = value.split('').reverse();
	var B = PATTERN.replace(/\*/g, function () { var c = rest.pop(); return c != null ? c : '*'; });
	var filled = B.replace(/\*.*/g, '');
	var shown = B.replace(/\*/g, '○');
	var indent = 'calc((' + B.length + ' * var(--char-width) * -1) + (' + filled.length +
		' * var(--char-width)))';
	function onChange(e) {
		var n = digitsOnly(e.target.value);
		console.log('change ' + JSON.stringify(e.target.value) + ' -> ' + n);
		if (n !== value) {
			setValue(n);
			if (n.length === 6) console.log('complete ' + n);
		}
	}
	function onFocus(e) {
		var t = e.target;
		console.log('focus ' + (document.activeElement === t));
		requestAnimationFrame(function () { t.setSelectionRange(t.value.length, t.value.length); });
	}
	var chars = shown.split('').map(function (c, i) {
		return i < filled.length ? h('span', { key: 'c' + i, className: 'char' }, c) :
			h('span', { key: 'p' + i, className: 'ph' }, c);
	});
	return h('div', { className: 'container' },
		h('div', { className: 'wrapper', style: { '--char-width-px': 'calc(300px / 6)' } },
			h('input', { id: 'pin', value: value, type: 'text', autoComplete: 'one-time-code',
				pattern: '[0-9]*', inputMode: 'numeric', style: { textIndent: indent },
				onChange: onChange, onFocus: onFocus }),
			h('div', { className: 'chrome', 'aria-hidden': true },
				h('div', { className: 'chars', id: 'chars' }, chars))));
}
ReactDOM.createRoot(document.getElementById('app')).render(h(PinCode));
window.addEventListener('mousedown', function (e) {
	console.log('mousedown ' + e.target.tagName.toLowerCase() + (e.target.id ? '#' + e.target.id : ''));
}, true);
window.addEventListener('keyup', function (e) {
	if (e.key === '6' || e.key === 'v') {
		var i = document.getElementById('pin');
		console.log('shown ' + document.getElementById('chars').textContent + ' value ' + i.value +
			' sel ' + i.selectionStart + ',' + i.selectionEnd);
	}
});
</script>
</body></html>
