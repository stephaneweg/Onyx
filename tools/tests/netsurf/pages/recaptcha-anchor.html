<!DOCTYPE html>
<html><head><title>recaptcha anchor mimic</title>
<style>body { margin: 0; background: #f9f9f9; font: 14px sans-serif; width: 302px; height: 76px; border: 1px solid #d3d3d3 }
#box { position: absolute; left: 12px; top: 25px; width: 24px; height: 24px; border: 2px solid #c1c1c1; background: #fff; box-sizing: border-box; cursor: pointer }
#box.checked { background: #0a0; border-color: #0a0 } #label { position: absolute; left: 50px; top: 28px }</style></head>
<body>
<!-- Onyx: recaptcha-outer.html's "anchor" frame (another origin): the checkbox -->
<div id="box" role="checkbox" aria-checked="false" tabindex="0"></div><span id="label">I'm not a robot</span>
<script>
'use strict';
function log(s) { console.log('recap anchor ' + s); }
var q = new URLSearchParams(location.search), co = q.get('co');
var toPage = null, toBframe = null, box = document.getElementById('box');
var r = [];
try { void parent.document; r.push('PARENTDOC'); } catch (x) { r.push(x.name); }
try { void top.location.href; r.push('TOPHREF'); } catch (x) { r.push('href-' + x.name); }
r.push(top === parent ? 'top' : 'TOP?');
r.push('len' + top.length);
log('sees ' + r.join(' '));
window.addEventListener('message', function (e) {
	var d = e.data;
	if (e.origin !== co) return;
	if (d.type === 'wrong') { log('got a message for another origin'); return; }
	if (d.type !== 'init') return;
	log('init ports ' + e.ports.length + ' source parent ' + (e.source === parent));
	toPage = e.ports[0];
	toBframe = e.ports[1];
	toBframe.onmessage = function (m) {
		if (m.data.type === 'solved') {
			box.className = 'checked';
			box.setAttribute('aria-checked', 'true');
			log('solved ' + m.data.token);
			toPage.postMessage({ type: 'checked' });
			parent.postMessage({ type: 'token', token: m.data.token }, co);
		}
	};
	toBframe.postMessage({ type: 'hello', from: 'anchor' });
});
box.addEventListener('click', function () {
	log('clicked');
	if (toPage) toPage.postMessage({ type: 'show', id: 'c' + Date.now() % 1000 });
});
parent.postMessage({ type: 'ready', role: 'anchor' }, co);
</script>
</body></html>
