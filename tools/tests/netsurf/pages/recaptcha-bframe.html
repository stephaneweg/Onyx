<!DOCTYPE html>
<html><head><title>recaptcha challenge mimic</title>
<style>body { margin: 0; background: #fff; font: 14px sans-serif; width: 398px; height: 298px; border: 1px solid #ccc }
#ask { position: absolute; left: 10px; top: 8px; background: #1a73e8; color: #fff; width: 380px; height: 24px }
.tile { position: absolute; top: 40px; width: 80px; height: 80px; background: #9ab }
.tile.on { background: #36c } #verify { position: absolute; left: 290px; top: 250px; width: 90px; height: 30px; background: #1a73e8; color: #fff; text-align: center; line-height: 30px }</style></head>
<body>
<!-- Onyx: recaptcha-outer.html's challenge frame (another origin): a tile, "Verify" -->
<div id="ask">Select all squares with a frame</div>
<div class="tile" id="t0" style="left: 10px"></div><div class="tile" id="t1" style="left: 100px"></div>
<div id="verify">VERIFY</div>
<script>
'use strict';
function log(s) { console.log('recap bframe ' + s); }
var toPage = null, toAnchor = null, challenge = null, picked = [];
function co() { return document.referrer ? new URL(document.referrer).origin : '*'; }
window.addEventListener('message', function (e) {
	var d = e.data;
	if (!d || d.type !== 'init') return;
	log('init ports ' + e.ports.length);
	toPage = e.ports[0];
	toAnchor = e.ports[1];
	toPage.onmessage = function (m) {
		if (m.data.type === 'challenge') {
			challenge = m.data.id;
			log('challenge ' + (challenge ? 'given' : 'none'));
		}
	};
	toAnchor.onmessage = function (m) { log('anchor says ' + m.data.type + ' ' + m.data.from); };
});
for (var i = 0; i < 2; i++)
	document.getElementById('t' + i).addEventListener('click', function () {
		this.classList.toggle('on');
		picked.push(this.id);
		log('tile ' + this.id);
	});
document.getElementById('verify').addEventListener('click', function () {
	if (!challenge || !picked.length) { log('verify without a challenge'); return; }
	var token = 'tok-' + picked.join('') + '-ok';
	log('verified');
	toAnchor.postMessage({ type: 'solved', token: token });
	toPage.postMessage({ type: 'verified' });
});
parent.postMessage({ type: 'ready', role: 'bframe' }, '*');
</script>
</body></html>
