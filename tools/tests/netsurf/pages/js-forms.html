<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>HTML5 forms</title>
<!-- tools/tests/netsurf/jstest.sh: input types (value sanitization, valueAsNumber /
     valueAsDate, stepUp / stepDown), the constraint validation API, submission blocked while
     invalid, <output>, <dialog>, <details>. "OK forms name" / "FAIL forms name", then
     "forms done N". -->
</head><body>
<form id="f" action="about:blank">
 <input id="req" name="req" required>
 <input id="mail" type="email" value="a@b.org">
 <button id="go">go</button>
</form>
<input id="outside" form="f" name="o">
<output id="out" for="req mail">5</output>
<details id="det"><summary>more</summary>hidden text</details>
<dialog id="dlg"><form method="dialog"><button id="ok" value="yes">OK</button></form></dialog>
<script>
let n = 0;
function check(name, cond) { n++; console.log((cond ? 'OK ' : 'FAIL ') + 'forms ' + name); }
function input(type, attrs) {
  const i = document.createElement('input');
  i.setAttribute('type', type);
  for (const k in attrs || {}) i.setAttribute(k, attrs[k]);
  return i;
}
try {
  /* types and sanitization */
  check('types', ['email', 'url', 'tel', 'search', 'number', 'range', 'date', 'month', 'week',
    'time', 'datetime-local', 'color'].every(t => input(t).type === t) && input('datetime').type === 'text');
  let i = input('number'); i.value = 'foo'; check('number sanitize', i.value === '');
  i.value = '12.5'; check('number valueAsNumber', i.valueAsNumber === 12.5);
  i = input('range'); check('range default', i.value === '50');
  i.value = '150'; check('range clamp', i.value === '100');
  i = input('color'); i.value = 'red'; check('color sanitize', i.value === '#000000');
  i.value = '#AABBCC'; check('color lower', i.value === '#aabbcc');
  i = input('date'); i.value = '2024-02-30'; check('date invalid', i.value === '');
  i.value = '2024-02-29'; check('date valueAsNumber', i.valueAsNumber === Date.UTC(2024, 1, 29));
  check('date valueAsDate', i.valueAsDate.getUTCDate() === 29);
  i.stepUp(); check('date stepUp', i.value === '2024-03-01');
  i = input('time'); i.value = '10:30'; i.stepUp(5); check('time stepUp', i.value === '10:35');
  i = input('month'); i.valueAsDate = new Date(Date.UTC(2020, 5, 15)); check('month valueAsDate', i.value === '2020-06');
  i = input('week'); i.value = '2020-W53'; check('week', i.value === '2020-W53' && input('week').value === '');
  i = input('datetime-local'); i.value = '2020-01-02 03:04'; check('datetime-local normalize', i.value === '2020-01-02T03:04');
  i = input('text'); i.value = 'a\nb'; check('text newlines', i.value === 'ab');
  i = input('number', { min: '10', max: '20', step: '5' }); i.value = '12';
  check('stepMismatch', i.validity.stepMismatch && !i.validity.valid);
  i.stepUp(); check('number stepUp aligned', i.value === '15');
  i.value = '25'; check('rangeOverflow', i.validity.rangeOverflow);
  let threw = false; try { input('text').stepUp(); } catch (e) { threw = e.name === 'InvalidStateError'; }
  check('stepUp text throws', threw);
  /* validity */
  const req = document.getElementById('req'), mail = document.getElementById('mail');
  check('valueMissing', req.validity.valueMissing && !req.checkValidity());
  let invalidFired = 0;
  req.addEventListener('invalid', () => invalidFired++);
  req.checkValidity();
  check('invalid event', invalidFired === 1);
  mail.value = 'nope'; check('email typeMismatch', mail.validity.typeMismatch);
  mail.value = 'x@y.z'; check('email ok', mail.validity.valid);
  const u = input('url'); u.value = 'foo'; check('url typeMismatch', u.validity.typeMismatch);
  u.value = 'http://foo.org'; check('url ok', u.validity.valid);
  const pat = input('text', { pattern: '[a-z]{3}' }); pat.value = 'abcd';
  check('patternMismatch', pat.validity.patternMismatch);
  pat.setCustomValidity('custom'); check('customError', pat.validity.customError && pat.validationMessage === 'custom');
  check('willValidate', !input('hidden').willValidate && input('text').willValidate);
  check(':invalid selector', document.querySelector('#req:invalid') === req);
  check(':in-range selector', !!document.querySelector('#nope') === false);
  /* form association and submission */
  const f = document.getElementById('f');
  check('form attribute', document.getElementById('outside').form === f);
  check('elements with form attribute', [...f.elements].includes(document.getElementById('outside')));
  check('form checkValidity', f.checkValidity() === false);
  let submitted = 0;
  f.addEventListener('submit', e => { submitted++; e.preventDefault(); });
  f.requestSubmit();
  check('submission blocked', submitted === 0);
  req.value = 'filled';
  f.requestSubmit();
  check('submission when valid', submitted === 1);
  f.noValidate = true; req.value = '';
  f.requestSubmit();
  check('novalidate', submitted === 2);
  check('formAction', document.getElementById('go').formAction.startsWith('about:blank') && 'formNoValidate' in input('submit'));
  /* output */
  const out = document.getElementById('out');
  out.value = '7';
  check('output', out.value === '7' && out.defaultValue === '5' && out.htmlFor.length === 2 && out.type === 'output');
  /* details, dialog: sizes once laid out (the load) */
  window.addEventListener('load', () => {
    const det = document.getElementById('det');
    let toggled = null;
    det.addEventListener('toggle', e => { toggled = e.newState; });
    const h0 = det.offsetHeight;
    det.open = true;
    const h1 = det.offsetHeight;
    check('details open', det.hasAttribute('open') && h1 > h0 && h0 > 0);
    const dlg = document.getElementById('dlg');
    check('dialog closed hidden', dlg.offsetHeight === 0);
    let closed = null;
    dlg.addEventListener('close', () => { closed = dlg.returnValue; });
    dlg.showModal();
    check('dialog showModal', dlg.open && document.querySelector('dialog:modal') === dlg && dlg.offsetHeight > 0);
    document.getElementById('ok').click();
    check('dialog form closes', !dlg.open);
    setTimeout(() => {
      check('dialog close event', closed === 'yes');
      check('details toggle event', toggled === 'open');
      console.log('forms done ' + n);
    }, 50);
  });
} catch (e) {
  console.log('FAIL forms exception ' + e + ' ' + e.stack);
}
</script>
</body></html>
