<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Window hidden</title>
<!-- tools/tests/netsurf/jstest.sh: the window hidden (minimised) then shown again (docs/06 §32) --
     document.hidden / visibilityState, visibilitychange; no requestAnimationFrame callback while
     hidden, a repeating timer slowed to a second, the frames going on once shown. The simulator
     sets the window's state ("winstate 4": minimised, "winstate 1": focused). -->
<style>
@keyframes spin { to { transform: rotate(360deg); } }
#d { width: 60px; height: 60px; margin: 20px; background: #c33; animation: spin 1s linear infinite; }
</style></head>
<body><div id="d"></div>
<script>
console.log('start hidden=' + document.hidden + ' ' + document.visibilityState);
let frames = 0, ticks = 0, hf = 0, ht = 0, t0 = 0;
(function f() { frames++; requestAnimationFrame(f); })();
setInterval(() => ticks++, 50);
document.addEventListener('visibilitychange', () => {
	console.log('visibility ' + document.visibilityState + ' hidden=' + document.hidden);
	if (document.hidden) {
		hf = frames; ht = ticks; t0 = performance.now();
		return;
	}
	const s = (performance.now() - t0) / 1000, df = frames - hf, dt = ticks - ht;
	console.log('frames while hidden ' + (df <= 2 ? 'none' : df));
	console.log('interval while hidden ' + (dt <= Math.ceil(s) + 2 ? 'slowed' : dt + ' in ' + s.toFixed(1) + ' s'));
	setTimeout(() => console.log('frames again ' + (frames > hf + df + 3 ? 'yes' : 'no')), 700);
});
</script>
</body></html>
