<!doctype html>
<!-- mediatest.sh: a 10 s <video src=?src> loaded by ranges of 64 KB; a seek to 8 s before those
     bytes came (the demuxer's index sends the loader there), the frame there, play from it. -->
<html><head><title>media-seek</title></head>
<body style="margin:0;background:#fff">
<video id="v" width="192" height="128"></video>
<script>
window.__onyxMediaChunk = 65536;
const q = new URLSearchParams(location.search);
const v = document.getElementById('v');
let phase = 0;
for (const e of ['loadedmetadata', 'seeking', 'seeked', 'play', 'playing', 'waiting', 'pause', 'error'])
	v.addEventListener(e, () => console.log('ev ' + e + ' t=' + v.currentTime.toFixed(2) + ' rs=' + v.readyState));
v.addEventListener('loadedmetadata', () => {
	console.log('duration ' + v.duration.toFixed(2) + ' buffered ' + (v.buffered.length ? v.buffered.end(v.buffered.length - 1).toFixed(2) : 'none'));
	phase = 1;
	v.currentTime = 8;
});
v.addEventListener('seeked', () => {
	if (phase !== 1) return;
	phase = 2;
	const f = __onyxMediaFrame(v);
	console.log('seekframe t=' + v.currentTime.toFixed(3) + ' pts=' + (f ? f[0].toFixed(3) + ' sum=' + f[1] : 'none'));
	v.play();
	setTimeout(() => {
		v.pause();
		const f2 = __onyxMediaFrame(v);
		console.log('after play t=' + v.currentTime.toFixed(2) + ' pts=' + (f2 ? f2[0].toFixed(2) : 'none'));
		console.log('done');
	}, 700);
});
v.src = q.get('src') || 'long.webm';
</script>
</body></html>
