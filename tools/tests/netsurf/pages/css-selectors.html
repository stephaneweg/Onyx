<!DOCTYPE html>
<html><head><title>Selectors 4</title>
<style>
p { color: rgb(0, 0, 0) }
li:nth-child(2 of .imp) { color: rgb(255, 0, 0) }
input:read-write { color: rgb(0, 128, 0) }
input:read-only { color: rgb(0, 0, 255) }
input:required { background-color: rgb(255, 255, 0) }
input:placeholder-shown { background-color: rgb(0, 255, 255) }
.k:has(img), .k2 { color: rgb(128, 0, 128) }
:dir(ltr).d { color: rgb(1, 2, 3) }
.w::-webkit-scrollbar, .w { color: rgb(4, 5, 6) }
</style></head>
<body>
<ul><li id="l1" class="imp">a</li><li id="l2">b</li><li id="l3" class="imp">c</li></ul>
<input id="i1" value="x" required> <input id="i2" readonly value="y"> <input id="i3" placeholder="p">
<p id="k" class="k">k</p><p id="k2" class="k2">k2</p><p id="d" class="d">d</p><p id="w" class="w">w</p>
<script>
function log(id, p) { console.log('sel ' + id + ' ' + getComputedStyle(document.getElementById(id)).getPropertyValue(p)); }
window.addEventListener('load', () => {
	log('l1', 'color'); log('l3', 'color'); log('i1', 'color'); log('i2', 'color');
	log('i1', 'background-color'); log('i3', 'background-color'); log('k', 'color');
	log('k2', 'color'); log('d', 'color'); log('w', 'color');
});
</script>
</body></html>
