<!doctype html>
<html><head><meta charset="utf-8"><title>inner scrollers</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; font: 16px sans-serif; }
/* a consent screen: a fixed, full-viewport overlay, its panel an overflow: auto scroller */
#ov { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); z-index: 10; }
#panel { position: absolute; top: 20px; left: 20px; right: 20px; bottom: 20px; overflow-y: auto; background: #fff; }
#panel p { margin: 0; height: 200px; border-bottom: 1px solid #ccc; }
#accept { display: block; margin: 20px; width: 160px; height: 40px; }
</style></head>
<body>
<div id="ov"><div id="panel">
 <p>Cookies 1</p><p>Cookies 2</p><p>Cookies 3</p><p>Cookies 4</p><p>Cookies 5</p><p>Cookies 6</p>
 <button id="accept" type="button">Accept</button>
</div></div>
<script>
var panel = document.getElementById('panel');
panel.addEventListener('scroll', function () { console.log('panel scrolled ' + (panel.scrollTop > 0 ? 'down' : 'top')); });
document.getElementById('accept').addEventListener('click', function () { console.log('accepted'); });
</script>
</body></html>
