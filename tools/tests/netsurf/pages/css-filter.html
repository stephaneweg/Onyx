<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>filters</title>
<!-- Onyx: filter, backdrop-filter and mix-blend-mode on a layer (docs/06 §21). fxtest.sh
     compares it with Chromium pixel by pixel. -->
<style>
html, body { margin: 0; background: #fff; }
.mark { position: absolute; left: 0; top: 0; width: 6px; height: 6px; background: #f0f; }
.cell { position: absolute; width: 140px; height: 140px; }
.pic { position: absolute; left: 30px; top: 30px; width: 80px; height: 80px;
	background: linear-gradient(90deg, #e00 0 25%, #0a0 25% 50%, #00d 50% 75%, #fc0 75%); }
.stripes { background: repeating-linear-gradient(45deg, #222 0 10px, #eee 10px 20px); }
</style></head><body>
<div class="mark"></div>

<div class="cell" style="left:10px; top:10px"><div class="pic" style="filter: blur(4px)"></div></div>
<div class="cell" style="left:160px; top:10px"><div class="pic" style="filter: brightness(1.6)"></div></div>
<div class="cell" style="left:310px; top:10px"><div class="pic" style="filter: contrast(0.4)"></div></div>
<div class="cell" style="left:460px; top:10px"><div class="pic" style="filter: grayscale(1)"></div></div>
<div class="cell" style="left:610px; top:10px"><div class="pic" style="filter: sepia(1)"></div></div>
<div class="cell" style="left:760px; top:10px"><div class="pic" style="filter: saturate(3)"></div></div>

<div class="cell" style="left:10px; top:160px"><div class="pic" style="filter: hue-rotate(90deg)"></div></div>
<div class="cell" style="left:160px; top:160px"><div class="pic" style="filter: invert(1)"></div></div>
<div class="cell" style="left:310px; top:160px"><div class="pic" style="filter: opacity(0.4)"></div></div>
<div class="cell" style="left:460px; top:160px"><div class="pic" style="filter: drop-shadow(8px 8px 4px rgba(0,0,0,.6)); border-radius: 50%"></div></div>
<div class="cell" style="left:610px; top:160px"><div class="pic" style="filter: grayscale(1) blur(2px) brightness(1.2)"></div></div>
<div class="cell" style="left:760px; top:160px"><div class="pic" style="filter: blur(3px); transform: rotate(20deg)"></div></div>

<!-- backdrop-filter over stripes; mix-blend-mode over colours -->
<div class="cell stripes" style="left:10px; top:310px"><div style="position:absolute; left:20px; top:20px; width:100px; height:100px; backdrop-filter: blur(6px); background: rgba(255,255,255,.3); border-radius: 16px"></div></div>
<div class="cell stripes" style="left:160px; top:310px"><div style="position:absolute; left:20px; top:20px; width:100px; height:100px; backdrop-filter: grayscale(1) invert(1)"></div></div>
<div class="cell" style="left:310px; top:310px; background: linear-gradient(#0cf, #fc0)"><div style="position:absolute; left:20px; top:20px; width:100px; height:100px; background:#e00; mix-blend-mode: multiply"></div></div>
<div class="cell" style="left:460px; top:310px; background: linear-gradient(#0cf, #fc0)"><div style="position:absolute; left:20px; top:20px; width:100px; height:100px; background:#e00; mix-blend-mode: screen"></div></div>
<div class="cell" style="left:610px; top:310px; background: linear-gradient(#0cf, #fc0)"><div style="position:absolute; left:20px; top:20px; width:100px; height:100px; background:#888; mix-blend-mode: difference"></div></div>
<div class="cell" style="left:760px; top:310px; background: linear-gradient(#0cf, #fc0)"><div style="position:absolute; left:20px; top:20px; width:100px; height:100px; background:#e00; mix-blend-mode: overlay"></div></div>
</body></html>
