<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Inline SVG</title>
<style>
body { margin: 16px; font: 16px sans-serif; }
.row { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
a.btn { color: #1a73e8; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
a.red { color: #d93025; }
.icon { width: 32px; height: 32px; }
.big { width: 96px; }
</style></head>
<body>
<!-- an icon sprite, hidden: its symbols used below -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z" fill="currentColor"/></symbol>
  <linearGradient id="g-warm" x1="0" x2="1"><stop offset="0" stop-color="#fbbc04"/><stop offset="1" stop-color="#ea4335"/></linearGradient>
</svg>

<div class="row">
  <a class="btn" href="#"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><use href="#i-star"/></svg>Starred</a>
  <a class="btn red" href="#"><svg class="icon" viewBox="0 0 24 24"><use xlink:href="#i-check"/></svg>Done</a>
  <svg width="48" height="48" viewBox="0 0 24 24"><use href="#i-star" fill="url(#g-warm)"/></svg>
  <svg width="120" height="40"><rect x="1" y="1" width="118" height="38" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><circle cx="20" cy="20" r="10" fill="#34a853"/></svg>
</div>

<div class="row">
  <svg class="big" viewBox="0 0 100 50">
    <style>.bar { fill: #9334e6 } .bar.alt { fill: #12b5cb }</style>
    <rect class="bar" x="5" y="20" width="20" height="30"/>
    <rect class="bar alt" x="30" y="5" width="20" height="45"/>
    <rect class="bar" x="55" y="30" width="20" height="20"/>
    <rect class="bar alt" x="80" y="10" width="15" height="40"/>
  </svg>
  <svg viewBox="0 0 10 10" style="width:40px;height:40px"><defs><clipPath id="c1"><circle cx="5" cy="5" r="4"/></clipPath></defs><rect width="10" height="10" fill="#fbbc04" clip-path="url(#c1)"/></svg>
  <span id="dyn"></span>
  <span style="--icon-c: #12b5cb"><svg style="fill:var(--icon-c);width:40px;height:40px" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></span>
</div>
<script>
document.getElementById('dyn').innerHTML =
  '<svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#ea4335"/><path d="M12 20h16" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>';
</script>
</body></html>
