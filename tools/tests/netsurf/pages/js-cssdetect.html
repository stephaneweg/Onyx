<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CSS feature detection</title>
<!-- tools/tests/netsurf/jstest.sh: the answers feature tests (css3test.com, browserscore.dev,
     Modernizr) read must be honest -- CSS.supports, element.style, the CSSOM, matchMedia say
     no to garbage and yes to what libcss keeps. "OK detect name" / "FAIL detect name", then
     "detect done N". -->
<style id="st"></style>
</head><body>
<div id="d"></div>
<script>
let n = 0;
function check(name, cond) { n++; console.log((cond ? 'OK ' : 'FAIL ') + 'detect ' + name); }
const d = document.getElementById('d'), st = document.getElementById('st');
function sheetRules(text) { st.textContent = text; return st.sheet.cssRules.length; }
try {
  /* CSS.supports(property, value) */
  check('supports value', CSS.supports('color', 'red') && CSS.supports('display', 'grid') &&
    CSS.supports('width', 'calc(100% - 2em)'));
  check('supports garbage value', !CSS.supports('color', 'notacolor') && !CSS.supports('width', 'red') &&
    !CSS.supports('display', 'garbage') && !CSS.supports('color', 'red; width: 1px') &&
    !CSS.supports('color', '') && !CSS.supports('color', 'red !important'));
  check('supports garbage property', !CSS.supports('garbage-prop', '1px') && !CSS.supports('colour', 'red') &&
    !CSS.supports('', 'red'));
  check('supports custom property', CSS.supports('--x', 'anything at all') && CSS.supports('--x', '1px'));
  /* CSS.supports(conditionText) */
  check('supports condition', CSS.supports('(color: red)') && CSS.supports('not (color: bogus)') &&
    CSS.supports('color: red') &&
    CSS.supports('(color: red) and (display: block)') && CSS.supports('(color: bogus) or (display: block)'));
  check('supports garbage condition', !CSS.supports('color: bogus') && !CSS.supports('(color: bogus)') &&
    !CSS.supports('(color: red) and (display: bogus)') && !CSS.supports('garbage') && !CSS.supports('') &&
    !CSS.supports('(color: red) and') && !CSS.supports('(color red)'));
  check('supports selector', CSS.supports('selector(a > b)') && CSS.supports('selector(:nth-child(2n+1))') &&
    CSS.supports('selector(:is(a, b))') && CSS.supports('selector(::before)'));
  check('supports garbage selector', !CSS.supports('selector(:bogus-class)') && !CSS.supports('selector(a >> b)') &&
    !CSS.supports('selector(::bogus-element)') && !CSS.supports('selector()') && !CSS.supports('selector([)'));
  check('supports end closes blocks', CSS.supports('selector(:nth-child(even of :not([hidden]))') &&
    CSS.supports('(color: red'));
  /* element.style */
  const s = d.style;
  check('style in', 'color' in s && 'backgroundColor' in s && 'gridTemplateColumns' in s &&
    !('fooBar' in s) && !('colour' in s));
  s.color = 'red';
  s.color = 'notacolor';
  check('style keeps valid', s.color === 'red' && s.length === 1);
  s.width = 'red';
  check('style refuses invalid', s.width === '' && s.length === 1);
  s.setProperty('height', '10px');
  s.setProperty('height', 'blue');
  check('setProperty refuses invalid', s.getPropertyValue('height') === '10px');
  s.cssText = '';
  s.width = '10px';
  check('style sets valid', s.width === '10px' && s.length === 1);
  s.cssText = '';
  s.fooBar = 'x';
  check('unknown property not a declaration', s.length === 0 && s.cssText === '');
  /* the CSSOM: what libcss keeps */
  check('cssom rule kept', sheetRules('a { color: red }') === 1);
  check('cssom bad selector dropped', sheetRules('a >> b { color: red }') === 0 &&
    sheetRules(':bogus-class { color: red }') === 0);
  check('cssom unknown at-rule dropped', sheetRules('@bogus-rule { a { color: red } }') === 0);
  sheetRules('a { color: notacolor; width: 10px }');
  check('cssom bad declaration dropped', st.sheet.cssRules[0].style.length === 1 &&
    st.sheet.cssRules[0].style.width === '10px' && st.sheet.cssRules[0].style.color === '');
  sheetRules('@font-face { font-family: x; bogus-descriptor: 1 }');
  check('cssom font-face descriptors', st.sheet.cssRules.length === 1 &&
    st.sheet.cssRules[0].style.getPropertyValue('bogus-descriptor') === '');
  /* matchMedia */
  check('media valid', !matchMedia('(min-width: 1px)').media.includes('not all') &&
    !matchMedia('screen and (orientation: landscape)').media.includes('not all'));
  /* (a query that does not parse is "not all"; an unknown feature is kept, false -- CSS
   * Media Queries 4's <general-enclosed>, as in Chrome) */
  check('media garbage', matchMedia('garbage and').media === 'not all' &&
    matchMedia('(min-width: 1px), garbage and').media === '(min-width: 1px), not all' &&
    matchMedia('(bogus-feature: 1)').media === '(bogus-feature: 1)' && !matchMedia('(bogus-feature: 1)').matches &&
    !matchMedia('not (bogus-feature: 1)').matches);
  check('media evaluated', matchMedia('(min-width: 1px)').matches && !matchMedia('(max-width: 1px)').matches &&
    matchMedia('(width >= 100px)').matches && !matchMedia('(width < 100px)').matches &&
    matchMedia('(orientation: ' + (innerWidth >= innerHeight ? 'landscape' : 'portrait') + ')').matches &&
    matchMedia('(hover: hover)').matches && matchMedia('(pointer: fine)').matches && matchMedia('(color)').matches &&
    matchMedia('(min-aspect-ratio: 1/100)').matches && !matchMedia('(min-aspect-ratio: 100/1)').matches &&
    matchMedia('(aspect-ratio > 1/100)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches &&
    matchMedia('(prefers-reduced-motion: no-preference)').matches && matchMedia('screen').matches && !matchMedia('print').matches);
  check('media range syntax', !matchMedia('(width >= 100px)').media.includes('not all') &&
    !matchMedia('(400px <= width <= 700px)').media.includes('not all'));
} catch (e) {
  check('exception ' + e, false);
}
console.log('detect done ' + n);
</script>
</body></html>
