<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>JS events</title>
<!-- tools/tests/netsurf/jstest.sh: the browser's events to the scripts. The targets sit at fixed
     places (absolute positions: the clicks do not depend on the fonts); the script clicks,
     types and scrolls through the simulator and checks the "console:" lines.
     Page point (x, y) = simulator point (x, y + 40): the toolbar is 40 px high. -->
<style>
body { font-family: sans-serif; font-size: 14px; margin: 0; height: 3000px; }
#menu-btn { position: absolute; left: 20px; top: 20px; width: 120px; height: 30px; margin: 0; }
#nav { position: absolute; left: 20px; top: 60px; width: 200px; height: 80px; background: #eef; display: none; z-index: 5; }
#nav.is-open { display: block; }
#nav a { position: absolute; left: 10px; top: 10px; width: 150px; height: 20px; display: block; }
#below { position: absolute; left: 0; top: 50px; width: 400px; height: 100px; background: #fee; }
#lnk { position: absolute; left: 20px; top: 180px; width: 150px; height: 20px; display: block; }
#cb { position: absolute; left: 20px; top: 220px; margin: 0; width: 16px; height: 16px; }
#f { position: absolute; left: 20px; top: 260px; margin: 0; }
#q { width: 150px; height: 20px; }
</style>
</head><body>
<div id="below"><a id="under" href="#under">under the menu</a></div>
<button id="menu-btn" type="button">Menu</button>
<nav id="nav"><a id="navlink" href="https://example.invalid/nav">nav link</a></nav>
<a id="lnk" href="https://example.invalid/">blocked link</a>
<input type="checkbox" id="cb">
<form id="f" action="/search"><input id="q" name="q" value=""></form>
<script>
const log = s => console.log(s);
document.getElementById('menu-btn').addEventListener('click', () => {
  log('menu ' + (document.getElementById('nav').classList.toggle('is-open') ? 'open' : 'closed'));
});
document.getElementById('navlink').addEventListener('click', e => { e.preventDefault(); log('nav link clicked'); });
document.getElementById('under').addEventListener('click', e => { e.preventDefault(); log('under clicked'); });
document.getElementById('lnk').onclick = e => { e.preventDefault(); log('link prevented'); };
document.getElementById('cb').addEventListener('change', e => log('checkbox ' + e.target.checked));
document.getElementById('q').addEventListener('input', e => log('input ' + e.target.value));
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); log('submit ' + document.getElementById('q').value); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') log('key Escape'); });
document.addEventListener('DOMContentLoaded', () => log('DOMContentLoaded ' + document.readyState));
window.addEventListener('load', () => {
  const r = document.getElementById('menu-btn').getBoundingClientRect();
  log('load ' + document.readyState + ' ' + r.left + ',' + r.top + ' ' + r.width + 'x' + r.height);
});
let scrolled = false;
window.addEventListener('scroll', () => { if (!scrolled && window.scrollY > 0) { scrolled = true; log('scroll'); } });
</script>
</body></html>
