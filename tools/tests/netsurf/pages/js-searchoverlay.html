<!doctype html>
<html><head><meta charset="utf-8"><title>a search overlay opened on focus</title>
<style>
body { margin: 0; font: 16px sans-serif }
#under { position: absolute; top: 0; left: 0; width: 80px; height: 40px; background: #ddd }
/* the field in an overflow: hidden form, as google.com's (#tsf) */
#f { overflow: hidden; margin: 100px 0 0 20px; width: 402px }
#box { border: 1px solid #888 }
#ta { display: block; width: 380px; height: 30px; border: 0; margin: 0; padding: 4px 10px; resize: none }
#back { display: none }
/* google.com's mobile search: the field's container made a full-screen fixed panel when
   the field takes the focus -- the field moves to the top, from under the pointer */
#box.open { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; background: #fff; z-index: 9;
	overflow: auto }
#box.open #back { display: block; width: 80px; height: 40px }
/* fixed panels inside the scroller, hidden below the viewport: not its scroll extent */
.panel { position: fixed; left: 0; width: 100%; visibility: hidden }
#sugg li { height: 24px }
</style></head>
<body>
<a id="under" href="#">under</a>
<form id="f" onsubmit="return false"><div id="box"><button id="back" type="button">back</button><textarea id="ta" rows="1"></textarea><ul id="sugg"></ul>
<div class="panel" style="top:100%;height:48px"></div><div class="panel" style="top:0;height:130%"></div></div></form>
<script>
var box = document.getElementById('box'), ta = document.getElementById('ta'),
	sugg = document.getElementById('sugg');
ta.addEventListener('focus', function () {
	box.classList.add('open');
	console.log('overlay open');
	setTimeout(function () {
		console.log('overlay scroll ' + (box.scrollHeight <= box.clientHeight + 16 ? 'none' :
			box.scrollHeight + ' > ' + box.clientHeight));
		/* the hit test as painted: the overlay's button, not the hidden panel over it */
		var e = document.elementFromPoint(30, 20);
		console.log('point ' + (e && (e.id || e.tagName)));
		var cs = getComputedStyle(box);
		console.log('computed ' + cs.zIndex + ' ' + cs.overflowY + ' ' + cs.position);
	}, 50);
});
document.getElementById('back').addEventListener('click', function () {
	box.classList.remove('open');
	console.log('back clicked');
});
document.getElementById('under').addEventListener('click', function (e) {
	e.preventDefault();
	console.log('under clicked');
});
/* the suggestions as google.com's Closure sanitizer makes their HTML: nodes built by the
   page's document, appended to a document of its own, serialized */
function sanitize(html) {
	var d = document.implementation.createHTMLDocument('');
	var f = document.createDocumentFragment();
	var tmp = document.createElement('div');
	tmp.innerHTML = html;
	while (tmp.firstChild) f.appendChild(tmp.firstChild);
	d.body.appendChild(f);
	var s = new XMLSerializer().serializeToString(d.body);
	return s.slice(s.indexOf('>') + 1, s.lastIndexOf('</'));
}
ta.addEventListener('input', function () {
	console.log('typed ' + ta.value);
	sugg.innerHTML = '';
	['', 'ercrombie', 'raham'].forEach(function (rest) {
		var li = document.createElement('li');
		try { li.innerHTML = sanitize(ta.value + '<b>' + rest + '</b>'); }
		catch (e) { console.log('sanitize error ' + e.message); }
		sugg.appendChild(li);
	});
	console.log('suggestions ' + Array.prototype.map.call(sugg.children, function (li) { return li.textContent; }).join('|'));
});
ta.addEventListener('keydown', function (e) {
	if (e.key === 'Enter') {
		e.preventDefault();
		console.log('search ' + ta.value);
	}
});

/* adoption: a node keeps its identity when it moves between documents (once parsed) */
addEventListener('load', function () {
	var d = document.implementation.createHTMLDocument('');
	var b = document.createElement('b');
	b.textContent = 'x';
	d.body.appendChild(b);
	var ok1 = b.ownerDocument === d && b.parentNode === d.body;
	var p = new DOMParser().parseFromString('<p id="parsed">parsed</p>', 'text/html').body.firstChild;
	document.body.appendChild(p);
	var ok2 = p.ownerDocument === document && document.getElementById('parsed') === p;
	var e = d.createElement('i');
	var a = document.adoptNode(e);
	var ok3 = a === e && e.ownerDocument === document;
	console.log('adopt ' + ok1 + ' ' + ok2 + ' ' + ok3);
});
</script>
</body></html>
