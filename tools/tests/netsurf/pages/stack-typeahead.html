<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>stacking: a typeahead menu</title>
<style>
/* Wikipedia's search (Codex's TypeaheadSearch in Minerva / Vector): the menu, absolute with
 * z-index 50, inside a relative wrapper with z-index auto, inside the page's relative box with
 * z-index 0 (a stacking context); the page's content after it, in relative boxes (z-index auto).
 * CSS 2.1 appendix E: the menu belongs to the outer stacking context and is painted above all
 * the boxes at z-index 0 / auto, the later ones too. */
body { margin: 0; font: 16px sans-serif; background: #fff; }
#page { position: relative; z-index: 0; background: #eee; }
header { height: 60px; padding: 10px; }
.wrap { position: relative; width: 300px; }
.wrap input { width: 280px; }
#menu { position: absolute; z-index: 50; left: 0; top: 30px; width: 300px; height: 260px;
	background: rgb(0, 0, 255); }
#menu ul { margin: 0; padding: 0 0 0 30px; height: 200px; overflow-y: auto; }	/* a static scroller */
#menu li { color: #fff; height: 40px; }
/* the footer: absolute in the menu (its containing block), under the scroller -- not clipped
 * by the scroller's overflow (Codex's "Search for pages containing ...") */
#menu li#foot { position: absolute; left: 0; bottom: 0; width: 300px; height: 40px;
	background: rgb(255, 255, 0); color: #000; list-style: none; }
.content { position: relative; color: rgb(255, 0, 0); background: transparent; }
.content p { margin: 0; padding: 8px 10px; font-size: 22px; background: rgb(255, 0, 0); }
/* a stacking context of its own: the menu-like box inside it stays under the later one */
#ctx { position: relative; z-index: 1; height: 40px; }
#ctx .pop { position: absolute; z-index: 999; left: 400px; top: 0; width: 100px; height: 120px;
	background: rgb(0, 160, 0); }
#over { position: relative; z-index: 2; left: 400px; width: 100px; height: 60px;
	background: rgb(255, 160, 0); }
/* MediaWiki's notification area: an overlay over the whole page the clicks go through
 * (pointer-events: none), a part of it taking them again (auto) */
#veil { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 9999;
	pointer-events: none; }
#tab { position: absolute; left: 400px; top: 0; width: 60px; height: 30px;
	background: rgb(128, 0, 128); pointer-events: auto; }
</style></head>
<body>
<div id="page">
 <header><form action="stack-typeahead.html"><div class="wrap"><input id="q" name="q">
  <div id="menu"><ul><li>Suggestion 1</li><li>Suggestion 2</li><li>Suggestion 3</li>
  <li id="foot">Search for pages containing</li></ul></div>
 </div></form></header>
 <div class="content"><p>Page text after the menu</p><p>more page text</p><p>and more</p>
  <p>and more</p><p>and more</p></div>
 <div id="ctx"><div class="pop"></div></div>
 <div id="over"></div>
</div>
<div id="veil"><div id="tab"></div></div>
<script>
document.getElementById('veil').addEventListener('click', function (e) {
	console.log(e.target.id === 'tab' ? 'tab clicked' : 'veil clicked');
	e.stopPropagation();
});
console.log('pointer-events ' + getComputedStyle(document.getElementById('veil')).pointerEvents + ' ' +
	getComputedStyle(document.getElementById('tab')).pointerEvents);
document.getElementById('menu').addEventListener('click', function () { console.log('menu clicked'); });
document.getElementById('foot').addEventListener('click', function (e) { e.stopPropagation(); console.log('footer clicked'); });
document.querySelector('.content').addEventListener('click', function () { console.log('content clicked'); });
</script>
</body></html>
