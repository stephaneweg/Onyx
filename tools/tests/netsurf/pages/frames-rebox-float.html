<!doctype html><html><head><title>rebox float frame</title></head><body>
<!-- an iframe in a float, the page's boxes made again by a script (a rebox): the frames are
     synced before the new boxes are laid out (the Pi crashed in box_coords: no float container) -->
<div style="float:left;width:300px"><iframe src="frame-child.html?n=f" width="200" height="80"></iframe></div>
<p id="p">text</p>
<script>
var n = 0;
var t = setInterval(function () {
	var d = document.createElement('div');
	d.textContent = 'added ' + n;
	document.body.appendChild(d);
	if (++n === 10) { clearInterval(t); setTimeout(function () { console.log('rebox float frame done'); }, 200); }
}, 50);
</script>
</body></html>
