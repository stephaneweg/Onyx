<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Shadow DOM events</title>
<!-- tools/tests/netsurf/jstest.sh: the browser's events on a shadow tree's element -- a click
     on a button in a custom element's shadow root (its listener, the host's and the
     document's with the target retargeted), a click on a slotted light element, the
     pointer over it (mouseover retargeted, :hover in the shadow tree's style). -->
<style>body { margin: 0; font: 16px sans-serif; } x-btn { display: block; }</style>
<script>
class XBtn extends HTMLElement {
  constructor() {
    super();
    const r = this.attachShadow({ mode: 'open' });
    r.innerHTML = '<style>#in { display: block; width: 200px; height: 50px; margin: 0; background-color: rgb(0, 0, 255); }' +
      ' #in:hover { background-color: rgb(255, 0, 0); } .row { height: 40px; }</style>' +
      '<div id="in">inner</div><div class="row"><slot></slot></div>';
    r.getElementById('in').addEventListener('click', e => console.log('shadow click inner ' + e.target.id));
  }
}
customElements.define('x-btn', XBtn);
</script>
</head><body>
<x-btn id="host"><span id="light" style="display: inline-block; width: 150px; height: 30px">light</span></x-btn>
<script>
const host = document.getElementById('host');
host.addEventListener('click', e => console.log('shadow click host ' + e.target.id + ' ' + e.composedPath().length));
document.addEventListener('click', e => console.log('shadow click doc ' + e.target.id));
host.addEventListener('mouseover', e => {
  if (e.target === host) {
    const inner = host.shadowRoot.getElementById('in');
    setTimeout(() => console.log('shadow hover ' + getComputedStyle(inner).backgroundColor), 30);
  }
});
</script>
</body></html>
