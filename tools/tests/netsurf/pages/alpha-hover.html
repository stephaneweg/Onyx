<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>alpha + hover</title>
<style>
:root { --line: rgba(90, 62, 43, 0.14); }
body { margin: 0; background: #f7f4ee; }
.head { position: sticky; top: 0; z-index: 20; height: 60px; background: rgba(247, 244, 238, 0.82); border-bottom: 1px solid var(--line); }
.direct { height: 40px; border-bottom: 1px solid rgba(90, 62, 43, 0.14); }
.b { height: 80px; }
.pad { height: 1200px; }
.b:hover { color: #c00; }
</style></head>
<body>
<div class="head">a translucent border through var()</div>
<div class="direct">a translucent border, direct</div>
<div class="b">hover me</div>
<div class="b">and me</div>
<div class="pad">long</div>
</body></html>
