<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>WebSocket</title></head>
<body><p id="out">WebSocket test (nettest.sh: wssrv.py)</p>
<script>
const log = s => console.log(s);
const base = 'ws://' + location.host;
log('ws types ' + typeof WebSocket + ' ' + WebSocket.OPEN + ' ' + typeof CloseEvent);
try { new WebSocket('ftp://x/'); } catch (e) { log('ws bad scheme ' + e.name); }
try { new WebSocket(base + '/ws/echo#frag'); } catch (e) { log('ws fragment ' + e.name); }
try { new WebSocket(base + '/ws/echo', ['a', 'a']); } catch (e) { log('ws dup protocol ' + e.name); }

/* the echo: text, binary (ArrayBuffer and Blob), a big text (compressed), a close */
const ws = new WebSocket(base + '/ws/echo', ['superchat', 'chat']);
ws.binaryType = 'arraybuffer';
log('ws state ' + ws.readyState);
try { ws.send('too early'); } catch (e) { log('ws send early ' + e.name); }
let n = 0;
ws.onopen = () => {
	log('ws open ' + ws.readyState + ' protocol=' + ws.protocol + ' ext=' + ws.extensions);
	ws.send('héllo €');
	ws.send(new Uint8Array([1, 2, 3, 250]));
	ws.send(new Blob(['blobby']));
	ws.send('x'.repeat(100000));
	ws.send('again');
	log('ws buffered ' + (ws.bufferedAmount >= 0));
};
ws.addEventListener('message', ev => {
	n++;
	const d = ev.data;
	if (typeof d === 'string') log('ws text ' + (d.length > 50 ? 'long ' + d.length : d));
	else log('ws binary ' + (d instanceof ArrayBuffer) + ' ' + Array.from(new Uint8Array(d)).join(','));
	if (n === 5) ws.close(1000, 'done');
});
ws.onclose = ev => {
	log('ws close ' + ev.code + ' ' + ev.reason + ' ' + ev.wasClean + ' ' + ws.readyState);
	log('ws cookie ' + document.cookie);
	frag();
};

/* fragments, a ping, a big binary as a Blob, the server's close */
function frag() {
	const w = new WebSocket(base + '/ws/frag');
	w.onmessage = ev => {
		if (typeof ev.data === 'string') log('frag text ' + ev.data);
		else log('frag blob ' + (ev.data instanceof Blob) + ' ' + ev.data.size);
	};
	w.onclose = ev => {
		log('frag close ' + ev.code + ' ' + ev.reason + ' ' + ev.wasClean);
		bad();
	};
}

/* a protocol error: error then close 1006 */
function bad() {
	const w = new WebSocket(base + '/ws/bad');
	let err = false;
	w.onerror = () => { err = true; };
	w.onmessage = () => log('bad message (not expected)');
	w.onclose = ev => {
		log('bad close ' + err + ' ' + ev.code + ' ' + ev.wasClean);
		refused();
	};
}

/* nothing listening: error, close 1006 */
function refused() {
	const w = new WebSocket('ws://127.0.0.1:1/');
	w.onerror = () => log('refused error');
	w.onclose = ev => {
		log('refused close ' + ev.code);
		early();
	};
}

/* closed before it opened; the server closing on request */
function early() {
	const w = new WebSocket(base + '/ws/echo');
	w.close();
	log('early state ' + w.readyState);
	w.onclose = ev => {
		log('early close ' + ev.code + ' ' + ev.wasClean);
		const s = new WebSocket(base + '/ws/echo');
		s.onopen = () => s.send('close-me');
		s.onclose = e => log('server close ' + e.code + ' ' + e.reason + ' ' + e.wasClean);
	};
}
</script></body></html>
