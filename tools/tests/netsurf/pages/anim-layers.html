<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Animated layers</title>
<!-- tools/tests/netsurf/gputest.sh: a spin (transform) and a pulse (opacity) -- with gpu_compositing,
     composite-only frames ("ONYX-COMP ... composite only", NS_PERF) -->
<style>
body { margin: 0; font: 15px sans-serif; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
#spin { margin: 40px; width: 80px; height: 80px; background: #36c; animation: spin 1s linear infinite; }
#pulse { margin: 40px; width: 200px; height: 60px; background: #c63; animation: pulse 1.2s ease-in-out infinite; }
</style></head><body>
<div id="spin">spin</div><div id="pulse">pulse</div>
<p>Some text under them.</p>
</body></html>
