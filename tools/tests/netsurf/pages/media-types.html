<!doctype html>
<!-- mediatest.sh: what the build answers -- canPlayType, MediaSource.isTypeSupported,
     navigator.mediaCapabilities.decodingInfo, the API's shape (what YouTube's player checks). -->
<html><head><title>media-types</title></head>
<body>
<script>
const v = document.createElement('video');
const types = ['video/webm', 'video/mp4', 'audio/mpeg', 'audio/flac', 'audio/wav', 'audio/ogg',
	'video/webm; codecs="vp9"', 'video/webm; codecs="vp09.00.10.08"', 'video/webm; codecs="vp8"',
	'video/mp4; codecs="avc1.42E01E"', 'video/mp4; codecs="av01.0.05M.08"', 'audio/webm; codecs="opus"',
	'audio/mp4; codecs="mp4a.40.2"', 'audio/webm; codecs="pcm"', 'video/webm; codecs="i420, pcm"',
	'video/mp4; codecs="i420"', 'audio/mp4; codecs="flac"', 'video/x-nothing'];
for (const t of types)
	console.log('type ' + t + ' can=' + JSON.stringify(v.canPlayType(t)) + ' mse=' + MediaSource.isTypeSupported(t));
console.log('codecs ' + __onyxMediaCodecs());
console.log('api ' + [typeof MediaSource, typeof SourceBuffer, typeof TimeRanges, typeof MediaError,
	typeof v.requestVideoFrameCallback, typeof v.getVideoPlaybackQuality, typeof document.exitFullscreen,
	document.fullscreenEnabled, typeof navigator.mediaCapabilities.decodingInfo,
	'HAVE_ENOUGH_DATA=' + HTMLMediaElement.HAVE_ENOUGH_DATA, v.networkState, v.readyState, v.paused,
	isNaN(v.duration)].join(','));
Promise.all([
	navigator.mediaCapabilities.decodingInfo({ type: 'media-source', video: { contentType: 'video/webm; codecs="i420"', width: 640, height: 360, bitrate: 1e6, framerate: 30 } }),
	navigator.mediaCapabilities.decodingInfo({ type: 'media-source', video: { contentType: 'video/webm; codecs="vp9"', width: 3840, height: 2160, bitrate: 2e7, framerate: 60 } }),
	navigator.mediaCapabilities.decodingInfo({ type: 'file', audio: { contentType: 'audio/flac' } }),
]).then(r => {
	for (const x of r) console.log('caps supported=' + x.supported + ' smooth=' + x.smooth + ' powerEfficient=' + x.powerEfficient);
	console.log('done');
});
</script>
</body></html>
