<!doctype html>
<html><head><meta charset="utf-8"><title>script time</title>
<style>#c { --color: red }</style></head>
<body>
<p id="out">script time</p>
<div id="c" class="a b" style="--inline: 4px"><span class="b">1</span><span class="a  b c">2</span><i class=" b	a ">3</i></div>
<script>
/* Onyx (tools/tests/netsurf/jstest.sh, run with NS_SCRIPT_TIMEOUT=1): the time limit stops a
 * stuck script, not a working one (qjs.c qjs_interrupt); the console's bounded formatting;
 * getElementsByClassName's native walk; getComputedStyle of a custom property */
const out = document.getElementById('out');

/* getElementsByClassName */
const c = document.getElementById('c');
const names = l => Array.from(l, e => e.textContent || e.id).join(',');
console.log('classes ab ' + names(c.getElementsByClassName('a b')));
console.log('classes b ' + document.getElementsByClassName(' b ').length);
console.log('classes c ' + names(document.getElementsByClassName('c')));
console.log('classes none ' + document.getElementsByClassName(' \t').length);
console.log('classes miss ' + document.getElementsByClassName('a x').length);

/* getComputedStyle: a custom property (not laid out for it) */
console.log('custom inline ' + getComputedStyle(c).getPropertyValue('--inline'));

/* the console: JSON for small objects, a name for big ones, strings whole */
console.log({ a: 1, b: 'two', c: [1, 2, 3], d: null, e: undefined, f: { g: true } });
const big = {}; for (let i = 0; i < 5000; i++) big['k' + i] = { v: i };
const t0 = Date.now();
for (let i = 0; i < 200; i++) console.debug('', big);
console.log('console big ' + (Date.now() - t0 < 2000 ? 'fast' : 'slow'));
console.log('long ' + 'x'.repeat(300).length + ' ' + 'y'.repeat(300));

/* a script working past the limit (1 s): it changes the page all along, so it runs on */
let n = 0;
const end = Date.now() + 2500;
while (Date.now() < end) { out.textContent = 'busy ' + (++n); }
console.log('busy done');

/* a stuck one (no change of the page): stopped (each step queued by the one before) */
setTimeout(() => {
	window.stuckEnd = false;
	setTimeout(() => {
		console.log('after stuck ' + window.stuckEnd);
		/* a runaway that changes the page for ever: stopped at 4 times the limit */
		setTimeout(() => {
			setTimeout(() => {
				const s = (Date.now() - window.runawayStart) / 1000;
				console.log('after runaway ' + (s > 3 && s < 8 ? 'stopped' : 'wrong ' + s));
			}, 50);
			window.runawayStart = Date.now();
			for (;;) out.textContent = 'runaway ' + (++n);
		}, 0);
	}, 50);
	const e2 = Date.now() + 3500;
	while (Date.now() < e2) {}
	window.stuckEnd = true;
}, 10);
</script>
</body></html>
