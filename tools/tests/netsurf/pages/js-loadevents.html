<!-- load / error events: <img>, <link>, <script src> inserted, new Image() (and its natural size) -->
<!doctype html><body><img id="a" src="layout/a.jpg" onload="console.log('img a load '+this.naturalWidth+'x'+this.naturalHeight+' '+this.complete)">
<img id="b" src="nope.png" onerror="console.log('img b error')">
<script>1</script><link rel="stylesheet" href="js-loadevents.css" onload="console.log('link load')">
<script>
var s=document.createElement('script'); s.src="js-loadevents.js"; s.onload=function(){console.log('script load '+window.sjs)}; document.head.appendChild(s);
var e=document.createElement('script'); e.src='missing.js'; e.onerror=function(){console.log('script error')}; document.head.appendChild(e);
var i=new Image(); i.onload=function(){console.log('detached load '+i.naturalWidth+'x'+i.naturalHeight+' '+i.complete)}; i.src="layout/a.jpg";
var j=new Image(); j.onerror=function(){console.log('detached error')}; j.src='nothing.gif';
</script>
