<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>negative z-index: under the in-flow content</title>
<!-- CSS 2.1 appendix E: a stacking context paints its boxes with a negative z-index after
     its own background and before its in-flow content (docs/06 section 45):
     1. a field wrapper (relative, z-index 0) -- its "chrome" (absolute, z-index -1, blue)
        under the in-flow block after it in the tree (green): the green over the blue,
        the clicks the green's (Netflix's code field over its boxes);
     2. a z-index -1 box (red) inside a relative box with z-index auto that has a white
        background: the red is its stacking context's (the page's), painted under the
        white -- not seen;
     3. the page's own: a z-index -1 box (orange) at the page's level under a later
        in-flow paragraph's text and under a static block's yellow background;
     4. the order among negatives: -2 (purple) under -1 (teal);
     5. inside an overflow: hidden box, a z-index -1 box clipped to it. -->
<style>
body { margin: 0; font: 16px sans-serif; }
#ctx { position: relative; z-index: 0; width: 200px; height: 60px; margin: 10px; }
#chrome { position: absolute; left: 0; top: 0; width: 200px; height: 60px; z-index: -1;
  background: rgb(0, 0, 255); }
#field { width: 100px; height: 60px; background: rgb(0, 160, 0); }
#auto { position: relative; width: 200px; height: 60px; margin: 10px; background: rgb(255, 255, 255); }
#hid { position: absolute; left: 0; top: 0; width: 200px; height: 60px; z-index: -1;
  background: rgb(255, 0, 0); }
#under { position: absolute; left: 10px; top: 160px; width: 200px; height: 60px; z-index: -1;
  background: rgb(255, 160, 0); }
#yellow { margin: 0 10px; width: 100px; height: 60px; background: rgb(255, 255, 0); }
#m2 { position: absolute; left: 300px; top: 10px; width: 100px; height: 100px; z-index: -2;
  background: rgb(128, 0, 128); }
#m1 { position: absolute; left: 350px; top: 10px; width: 100px; height: 100px; z-index: -1;
  background: rgb(0, 128, 128); }
#clip { position: absolute; left: 300px; top: 160px; width: 100px; height: 60px; overflow: hidden;
  z-index: 0; }
#clipped { position: absolute; left: 50px; top: 0; width: 200px; height: 60px; z-index: -1;
  background: rgb(255, 0, 255); }
</style>
</head><body>
<div id="ctx"><div id="chrome"></div><div id="field"></div></div>
<div id="auto"><div id="hid"></div></div>
<div id="under"></div>
<div id="yellow"></div>
<div id="m2"></div><div id="m1"></div>
<div id="clip"><div id="clipped"></div></div>
<script>
document.addEventListener('click', function (e) { console.log('clicked ' + e.target.id); });
</script>
</body></html>
