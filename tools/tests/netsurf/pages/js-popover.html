<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Popover API</title>
<!-- tools/tests/netsurf/jstest.sh: the Popover API -- showPopover / hidePopover /
     togglePopover, beforetoggle (cancelled) and toggle, the auto popovers' stack, the
     popovertarget buttons, showModal hiding them, the UA sheet's hiding and libcss's
     :popover-open (a sibling's colour), :modal; then the user's click outside (the light
     dismiss) and Escape (jstest.sh; a script's events do not dismiss, as in Chrome).
     "OK popover name" / "FAIL popover name", then "popover done N". -->
<style>
#p1:popover-open + span { color: rgb(9, 9, 9); }
#dlg:modal + span { color: rgb(7, 7, 7); }
</style>
</head><body>
<div id="p1" popover>one</div><span id="s1">s1</span>
<div id="p2" popover="auto">two <div id="p2in" popover>inner</div></div>
<div id="p3" popover="manual">three</div>
<div id="p4" popover>four</div>
<div id="plain">not a popover</div>
<button id="b1" popovertarget="p1">b1</button>
<button id="b2" popovertarget="p1" popovertargetaction="show">b2</button>
<dialog id="dlg">modal</dialog><span id="s2">s2</span>
<script>
let n = 0;
function check(name, cond) { n++; console.log((cond ? 'OK ' : 'FAIL ') + 'popover ' + name); }
const $ = id => document.getElementById(id);
const open = el => el.matches(':popover-open');
const color = id => getComputedStyle($(id)).getPropertyValue('color');
const events = [];
for (const id of ['p1', 'p2', 'p3', 'p4']) {
  $(id).addEventListener('beforetoggle', e => events.push(id + ' before ' + e.newState));
  $(id).addEventListener('toggle', e => events.push(id + ' toggle ' + e.oldState + '>' + e.newState));
}
try {
  check('api', 'showPopover' in HTMLElement.prototype && 'hidePopover' in HTMLElement.prototype &&
    'togglePopover' in HTMLElement.prototype && typeof ToggleEvent === 'function' &&
    'popoverTargetElement' in HTMLButtonElement.prototype && 'onbeforetoggle' in HTMLElement.prototype);
  check('reflect', $('p1').popover === 'auto' && $('p3').popover === 'manual' && $('plain').popover === null);
  check('supports', CSS.supports('selector(:popover-open)') && CSS.supports('selector(:modal)'));
  check('closed at first', !open($('p1')) && $('p1').getBoundingClientRect().width === 0);
  $('p1').showPopover();
  check('show', open($('p1')) && events.includes('p1 before open'));
  let threw = '';
  try { $('plain').showPopover(); } catch (e) { threw = e.name; }
  check('not a popover', threw === 'NotSupportedError');
  $('p1').showPopover();	/* (already showing: nothing) */
  $('p3').showPopover();
  $('p2').showPopover();
  check('auto stack', open($('p2')) && !open($('p1')) && open($('p3')));
  $('p2in').showPopover();
  check('nested stays', open($('p2')) && open($('p2in')));
  $('p4').addEventListener('beforetoggle', e => { if (e.newState === 'open') e.preventDefault(); });
  $('p4').showPopover();
  check('cancelled', !open($('p4')) && open($('p2')));
  check('toggle returns', $('p3').togglePopover() === false && !open($('p3')) &&
    $('p3').togglePopover(true) === true && open($('p3')));
  $('b1').click();
  check('invoker show', open($('p1')) && !open($('p2')) && $('b1').popoverTargetElement === $('p1'));
  $('b2').click();
  check('invoker action show', open($('p1')) && $('b2').popoverTargetAction === 'show');
  $('b1').click();
  check('invoker toggle hide', !open($('p1')));
  $('p1').showPopover();
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  document.body.click();
  check('scripts do not dismiss', open($('p1')));
  $('p3').hidePopover();
  $('p3').hidePopover();	/* (not showing: nothing) */
  check('manual hide', !open($('p3')));
  $('p3').showPopover();
  $('dlg').showModal();
  check('modal', $('dlg').matches(':modal') && !open($('p1')) && open($('p3')));
  $('p1').showPopover();
} catch (e) {
  check('exception ' + e, false);
}
setTimeout(() => {
  check('toggle events', events.includes('p1 toggle closed>open') &&
    !events.some(e => e.startsWith('p4 toggle')));
  check('libcss :popover-open', color('s1') === 'rgb(9, 9, 9)');
  check('ua sheet shows', $('p1').getBoundingClientRect().width > 0 && getComputedStyle($('p1')).getPropertyValue('position') === 'fixed');
  check('libcss :modal', color('s2') === 'rgb(7, 7, 7)');
  $('dlg').close();
  $('p1').hidePopover();
  setTimeout(() => {
    check('libcss closed again', color('s1') !== 'rgb(9, 9, 9)' && color('s2') !== 'rgb(7, 7, 7)' &&
      $('p1').getBoundingClientRect().width === 0);
    /* the user's turn: a click outside hides p2 (p3 is manual), then Escape hides p1 */
    $('p2').showPopover();
    console.log('popover ready');
    window.addEventListener('click', e => {
      if (!e.isTrusted) return;
      check('light dismiss', !open($('p2')) && open($('p3')));
      $('p1').showPopover();
    });
    window.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      check('escape', !open($('p1')) && open($('p3')));
      console.log('popover done ' + n);
    });
  }, 200);
}, 200);
</script>
</body></html>
