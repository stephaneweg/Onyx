<!DOCTYPE html>
<html><head><title>CSS Values 4 math</title>
<style>
body { margin: 0; font-size: 16px }
div { height: 10px; width: 50px }
#a { width: round(down, 57.5px, 10px) }
#b { width: calc(100px * sin(30deg)) }
#c { width: mod(118px, 50px) }
#d { width: calc(10px * pow(2, 3)) }
#e { width: calc(1px * round(pi * 10)) }
#f { width: 10dvw }
#g { width: calc(2px * abs(-20)) }
#h { width: hypot(30px, 40px) }
#i { width: 5cqi }
</style></head>
<body>
<div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div><div id="e"></div>
<div id="f"></div><div id="g"></div><div id="h"></div><div id="i"></div>
<script>
window.addEventListener('load', () => {
	for (const id of 'abcdefghi')
		console.log('math ' + id + ' ' + getComputedStyle(document.getElementById(id)).width + ' vw ' + innerWidth);
});
</script>
</body></html>
