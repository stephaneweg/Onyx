<!doctype html><html><head><title>fragment</title></head><body style="margin:0">
<!-- the user scrolls up from a fragment while the page still reflows (late content):
     the view stays where the user put it (NetSurf scrolled back to the fragment) -->
<div style="height:120px;background:#c33;color:#fff;font-size:40px">TOP</div>
<div style="height:2000px;background:linear-gradient(#eee,#88f)"></div>
<h2 id="target" style="margin:0;height:60px;background:#3c3">target</h2>
<div id="late"></div>
<div style="height:600px"></div>
<script>
var n = 0, t = setInterval(function () {
	var p = document.createElement('p'); p.textContent = 'late ' + n;
	document.getElementById('late').appendChild(p);
	if (++n == 30) clearInterval(t);
}, 100);
</script>
</body></html>
