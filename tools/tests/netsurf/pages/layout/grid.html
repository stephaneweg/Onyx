<!doctype html>
<html><head><style>
body{margin:8px;font:16px sans-serif}
.g{display:grid;width:600px;background:#eee;margin-bottom:10px}
.g>div{background:#8af;border:1px solid #336;min-height:10px}
</style></head><body>
<div class="g" id="g1" style="grid-template-columns:100px 1fr 2fr;gap:10px"><div id="g1a"></div><div id="g1b"></div><div id="g1c"></div><div id="g1d" style="height:30px"></div></div>
<div class="g" id="g2" style="grid-template-columns:repeat(3,1fr);grid-auto-rows:40px;gap:5px 10px"><div id="g2a" style="grid-column:span 2"></div><div id="g2b"></div><div id="g2c"></div><div id="g2d" style="grid-row:span 2"></div><div id="g2e"></div></div>
<div class="g" id="g3" style="grid-template-areas:'h h' 's m' 'f f';grid-template-columns:150px 1fr;grid-template-rows:40px 100px 30px"><div id="g3h" style="grid-area:h"></div><div id="g3s" style="grid-area:s"></div><div id="g3m" style="grid-area:m"></div><div id="g3f" style="grid-area:f"></div></div>
<div class="g" id="g4" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px"><div id="g4a"></div><div id="g4b"></div><div id="g4c"></div><div id="g4d"></div><div id="g4e"></div><div id="g4f"></div></div>
<div class="g" id="g5" style="grid-template-columns:auto 1fr auto"><div id="g5a">auto one</div><div id="g5b">fr</div><div id="g5c">last auto</div></div>
<div class="g" id="g6" style="grid-template-columns:1fr 1fr;grid-template-rows:50px"><div id="g6a" style="grid-area:1/1/2/3"></div><div id="g6b" style="grid-area:1/1/2/2;background:#f88"></div></div>
<div class="g" id="g7" style="grid-template-columns:100px 100px;justify-content:center;align-items:center;grid-template-rows:60px"><div id="g7a" style="height:20px"></div><div id="g7b" style="height:20px;align-self:end;justify-self:start;width:40px"></div></div>
<div class="g" id="g8" style="grid-template-columns:1fr 3fr;height:200px;grid-template-rows:1fr auto"><div id="g8a"></div><div id="g8b"></div><div id="g8c" style="height:30px"></div><div id="g8d"></div></div>
<div class="g" id="g9" style="grid-auto-flow:column;grid-template-rows:30px 30px"><div id="g9a"></div><div id="g9b"></div><div id="g9c"></div></div>
<div class="g" id="g10" style="grid-template-columns:minmax(0,1fr) 200px"><div id="g10a">A very long line of text inside a minmax zero column that should wrap nicely</div><div id="g10b"></div></div>
<div class="g" id="g11" style="grid-template-columns:repeat(4,1fr);gap:4px"><div id="g11a" style="grid-column:2/4"></div><div id="g11b" style="grid-column:-2/-1"></div><div id="g11c"></div></div>
<div style="display:inline-grid;grid-template-columns:50px 50px;background:#ddd" id="ig"><div id="iga" style="height:20px;background:#8af"></div><div id="igb" style="height:30px;background:#8af"></div></div>
<div class="g" id="g12" style="grid-template-columns:200px 1fr;padding:10px;border:2px solid #000"><div id="g12a" style="margin:5px"></div><div id="g12b" style="padding:5px"></div></div>
</body></html>
