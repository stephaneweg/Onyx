<!doctype html>
<html><head><style>
body{margin:8px;font:16px sans-serif}
.c{display:flex;flex-direction:column;width:300px;background:#eee;margin-bottom:10px}
.c>div{background:#8af;border:1px solid #336}
</style></head><body>
<!-- definite height, grow -->
<div class="c" id="c1" style="height:200px"><div id="c1a" style="height:20px"></div><div id="c1b" style="flex:1"></div><div id="c1c" style="flex:2"></div></div>
<!-- auto height: no grow -->
<div class="c" id="c2"><div id="c2a" style="height:20px"></div><div id="c2b" style="flex:1"></div><div id="c2c">text</div></div>
<!-- min-height: grow fills it -->
<div class="c" id="c3" style="min-height:150px"><div id="c3a" style="height:20px"></div><div id="c3b" style="flex:1"></div><div id="c3c" style="height:20px"></div></div>
<!-- max-height: shrink -->
<div class="c" id="c4" style="max-height:100px"><div id="c4a" style="height:80px"></div><div id="c4b" style="height:80px"></div></div>
<!-- justify in column -->
<div class="c" id="c5" style="height:120px;justify-content:center"><div id="c5a" style="height:20px"></div><div id="c5b" style="height:20px"></div></div>
<div class="c" id="c6" style="height:120px;justify-content:space-between"><div id="c6a" style="height:20px"></div><div id="c6b" style="height:20px"></div></div>
<!-- align (cross = width) -->
<div class="c" id="c7" style="align-items:center"><div id="c7a" style="width:100px;height:10px"></div><div id="c7b">shrink to fit</div><div id="c7c" style="align-self:stretch;height:10px"></div><div id="c7d" style="align-self:flex-end;width:50px;height:10px"></div></div>
<div class="c" id="c8" style="align-items:flex-start"><div id="c8a">fit</div><div id="c8b" style="margin-left:auto">right</div><div id="c8c" style="margin:0 auto">mid</div></div>
<!-- auto margins in column -->
<div class="c" id="c9" style="height:150px"><div id="c9a" style="height:20px"></div><div id="c9b" style="height:20px;margin-top:auto"></div></div>
<!-- percent heights of children of items -->
<div class="c" id="c10" style="height:200px"><div id="c10a" style="flex:1"><div id="c10a1" style="height:50%;background:#f88"></div></div><div id="c10b" style="height:40px"></div></div>
<!-- shrink with content minimum -->
<div class="c" id="c11" style="height:60px"><div id="c11a" style="height:50px"></div><div id="c11b" style="height:50px"></div><div id="c11c">text min</div></div>
<!-- column-reverse -->
<div class="c" id="c12" style="flex-direction:column-reverse;height:100px"><div id="c12a" style="height:20px"></div><div id="c12b" style="height:30px"></div></div>
<!-- wrap in column -->
<div class="c" id="c13" style="flex-wrap:wrap;height:100px"><div id="c13a" style="height:40px;width:80px"></div><div id="c13b" style="height:40px;width:80px"></div><div id="c13c" style="height:40px;width:80px"></div></div>
<!-- gap in column -->
<div class="c" id="c14" style="gap:12px"><div id="c14a" style="height:10px"></div><div id="c14b" style="height:10px"></div><div id="c14c" style="height:10px"></div></div>
<!-- basis in column -->
<div class="c" id="c15" style="height:200px"><div id="c15a" style="flex:0 0 50px"></div><div id="c15b" style="flex:1 1 0"></div><div id="c15c" style="flex:1 1 30%"></div></div>
<!-- nested column in row with stretch -->
<div style="display:flex;height:100px;width:300px;background:#ddd" id="n1"><div id="n1a" style="display:flex;flex-direction:column;width:100px;background:#cfc"><div id="n1a1" style="flex:1;background:#8c8"></div><div id="n1a2" style="height:20px;background:#484"></div></div><div id="n1b" style="flex:1;background:#ccf"><div id="n1b1" style="height:100%;background:#88f"></div></div></div>
<!-- padding/border on column container -->
<div class="c" id="c16" style="height:100px;padding:10px;border:5px solid #000"><div id="c16a" style="flex:1"></div></div>
<div class="c" id="c17" style="height:100px;padding:10px;border:5px solid #000;box-sizing:border-box"><div id="c17a" style="flex:1"></div></div>
</body></html>
