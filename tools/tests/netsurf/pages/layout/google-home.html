<!doctype html>
<html><head><style>
body,html{height:100%;margin:0;padding:0}
body{font-family:Roboto,sans-serif;font-size:10pt}
#main{display:flex;flex-direction:column;min-height:100%}
header{display:flex;min-height:48px;width:100%;background:#eef}
.a{padding:12px 16px}
.icon{width:24px;height:24px;display:block;background:#88f}
.grow{flex:1 0 auto;background:#fee}
.right{flex:0 0 auto;position:relative;z-index:1;padding-top:calc(0*12px)}
#content{flex:1;padding-top:20px}
.box{display:flex;border-radius:25px;height:48px;margin:0 8px;border:1px solid #dadce0}
.grid{display:grid;flex:1}
.ta{line-height:24px;background:none;margin:0;padding:0;border-color:transparent;border-style:solid;border-width:12px 0;font-size:16px;display:flex;flex:1;width:100%;max-height:144px;white-space:nowrap;resize:none;overflow:hidden;grid-area:1/1/2/2;box-sizing:border-box}
.hid{visibility:hidden}
</style></head><body>
<div id="main">
<header><div class="a" id="menu"><span class="icon"></span></div><div id="tabs"><a>Tous</a> <a>Images</a></div><div class="grow" id="grow"></div><div class="right" id="right"><a id="signin">Connexion</a></div></header>
<div id="content"><div id="logo" style="text-align:center;margin:36px auto 18px;width:160px;line-height:0"><span style="display:inline-block;width:160px;height:56px;background:#4a4"></span></div>
<form id="f"><div class="box" id="box"><button id="b1" style="width:48px">s</button><div class="grid" id="grid"><textarea class="ta" id="ta" rows="1"></textarea><div class="ta hid" id="h1"></div></div><div id="btns" style="display:flex"><button id="b2" style="width:48px">m</button><button id="b3" style="width:48px">l</button></div></div></form>
</div>
<footer id="foot" style="background:#f2f2f2;height:40px"></footer>
</div>
<dialog id="dlg"><div style="height:30px">dialog</div></dialog>
</body></html>
