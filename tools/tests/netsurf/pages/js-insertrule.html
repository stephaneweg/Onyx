<!doctype html><html><head><title>insertRule</title><style id="s"></style></head><body>
<!-- google.com's way: thousands of rules inserted one by one (insertRule) -- written back to
     the <style> once per script turn, not once per rule (NetSurf parsed the whole sheet each
     time: 10 000+ sheet conversions for a search page on the Pi) -->
<div id="d" class="c1999">x</div>
<script>
var t0 = Date.now(), sh = document.getElementById('s').sheet;
for (var i = 0; i < 2000; i++)
	sh.insertRule('.c' + i + ' { width: ' + (100 + i % 7) + 'px; display: block }', sh.cssRules.length);
console.log('insertRule rules ' + sh.cssRules.length);
console.log('insertRule time ' + (Date.now() - t0) + ' ms');
setTimeout(function () {
	var w = document.getElementById('d').offsetWidth;	/* (the sheet converted: applied) */
	console.log('insertRule applied ' + (w === 100 + 1999 % 7 ? 'yes' : 'no ' + w));
}, 400);
setTimeout(function () {
	sh.insertRule('#d { width: 50px !important }', sh.cssRules.length);
	setTimeout(function () { console.log('insertRule later ' + (document.getElementById('d').offsetWidth === 50 ? 'yes' : 'no')); }, 100);
}, 500);
</script></body></html>
