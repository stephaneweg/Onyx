<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JS hover</title>
<style>
body { margin: 0; }
#outer { position: absolute; left: 0; top: 0; width: 400px; height: 200px; background: #cde; }
#inner { position: absolute; left: 50px; top: 50px; width: 100px; height: 100px; background: #89a; }
#other { position: absolute; left: 0; top: 300px; width: 400px; height: 100px; background: #dca; }
</style></head>
<body>
<div id="outer"><div id="inner">inner</div></div>
<div id="other">other</div>
<script>
/* The simulator moves the pointer: outer, then inner, then other. */
const log = [];
for (const id of ['outer', 'inner', 'other']) {
  const e = document.getElementById(id);
  for (const t of ['mouseenter', 'mouseleave'])
    e.addEventListener(t, ev => { log.push(t + ':' + id); console.log('hover ' + t + ' ' + id); });
}
document.getElementById('inner').addEventListener('mouseover', ev =>
  console.log('hover over inner from ' + (ev.relatedTarget ? ev.relatedTarget.id : 'null')));
let moves = 0;
document.addEventListener('mousemove', () => { if (++moves === 1) console.log('hover mousemove'); });
</script>
</body></html>
