<!DOCTYPE html>
<html><head><title>frame child</title></head>
<body style="margin:4px;background:#dfe">
<!-- Onyx: the child of frames-api.html / frames-input.html (iframetest.sh): it says it is ready,
     answers its parent's commands ("echo", "port", "sib", "bc"), and logs what is typed and
     clicked in it -->
<p id="p">child</p><input id="t" size="8"><input type="checkbox" id="c">
<div style="height:600px"></div><p id="end">end</p>
<script>
var q = new URLSearchParams(location.search), n = q.get('n') || '';
window.childVar = 'v' + n;
window.childFn = function (x) { return x * 2; };
function reply(e, v) { e.source.postMessage(v, '*'); }
window.onmessage = function (e) {
	var d = e.data;
	if (!d || typeof d !== 'object') return;
	if (d.cmd === 'echo') reply(e, { echo: d.v, origin: e.origin, srcIsParent: e.source === parent, from: n });
	if (d.cmd === 'port' || d.cmd === 'port2') {
		var p = d.cmd === 'port' ? e.ports[0] : d.port;
		p.onmessage = function (m) {
			if (m.data === 'bye') { p.postMessage('closing'); p.close(); return; }
			p.postMessage({ pong: m.data, n: n });
		};
		p.postMessage('ready ' + d.cmd + ' ' + e.ports.length);
	}
	if (d.cmd === 'sib') {
		/* a message to a sibling frame (parent.frames[i]), its echo back to here */
		var sib = parent.frames[d.idx];
		window.addEventListener('message', function on(m) {
			if (m.data && m.data.echo === 'sib-' + n) {
				window.removeEventListener('message', on);
				parent.postMessage({ sibling: m.data.from, srcIsSib: m.source === sib }, '*');
			}
		});
		sib.postMessage({ cmd: 'echo', v: 'sib-' + n }, '*');
	}
	if (d.cmd === 'bc') {
		var bc = new BroadcastChannel('frames-bc');
		bc.onmessage = function (m) { bc.postMessage('child ' + n + ' got ' + m.data); };
		reply(e, { bcReady: n });
	}
};
document.getElementById('t').addEventListener('input', function () { console.log('child ' + n + ' input ' + this.value); });
document.getElementById('c').addEventListener('click', function () { console.log('child ' + n + ' checkbox ' + this.checked); });
window.addEventListener('scroll', function () { if (window.scrollY > 0 && !window.scrolled) { window.scrolled = true; console.log('child ' + n + ' scrolled'); } });
parent.postMessage({ ready: n, name: window.name, topIsParent: top === parent, len: window.length, iw: innerWidth, ih: innerHeight,
	selfFrame: parent === window ? -1 : 0 }, '*');
if (top !== parent)	/* (a frame in a frame: to the top window too) */
	top.postMessage({ topReady: n, parentVar: parent.nestedVar, isFrame0: parent.frames[0] === window }, '*');
</script>
</body></html>
