<!doctype html><html><head><meta charset="utf-8"></head><body style="color:#c00"><div id="d"></div>
<!-- createElementNS: an <svg> made by a script (React) is SVG -- its prototype, its names and attributes in their case, drawn -->
<svg id="p" viewBox="0 0 10 10" width="40" height="40"><rect width="10" height="10" fill="#00c"/></svg>
<script>
var NS='http://www.w3.org/2000/svg';
var s=document.createElementNS(NS,'svg'); s.setAttribute('viewBox','0 0 10 10'); s.setAttribute('width','40'); s.setAttribute('height','40');
var g=document.createElementNS(NS,'linearGradient');
var c=document.createElementNS(NS,'circle'); c.setAttribute('cx','5'); c.setAttribute('cy','5'); c.setAttribute('r','5'); c.setAttribute('fill','currentColor');
s.appendChild(g); s.appendChild(c); document.getElementById('d').appendChild(s);
console.log('ns '+s.namespaceURI+' '+(s instanceof SVGSVGElement)+' '+g.tagName+' '+s.getAttribute('viewBox')+' '+document.getElementById('p').getAttribute('viewBox')+' '+(document.getElementById('p') instanceof SVGElement));
</script></body></html>
