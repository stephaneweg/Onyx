<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>transforms</title>
<!-- Onyx: transforms beyond a translation, painted through a layer (docs/06 §21). fxtest.sh
     compares it with Chromium; jstest.sh checks the rectangles and a click through a
     rotation. -->
<style>
html, body { margin: 0; background: #fff; }
.mark { position: absolute; left: 0; top: 0; width: 6px; height: 6px; background: #f0f; }
.cell { position: absolute; width: 140px; height: 140px; }
.sq { position: absolute; left: 30px; top: 30px; width: 80px; height: 80px; }
.r { background: #e00; } .g { background: #0a0; } .b { background: #00d; } .y { background: #fc0; }
</style></head><body>
<div class="mark"></div>

<!-- 1: rotate -->
<div class="cell" style="left:10px; top:10px"><div id="rot" class="sq r" style="transform: rotate(45deg)"></div></div>
<!-- 2: scale about the top left corner -->
<div class="cell" style="left:160px; top:10px"><div class="sq g" style="transform: scale(1.3, .6); transform-origin: top left"></div></div>
<!-- 3: skew -->
<div class="cell" style="left:310px; top:10px"><div class="sq b" style="transform: skewX(20deg)"></div></div>
<!-- 4: a matrix -->
<div class="cell" style="left:460px; top:10px"><div class="sq y" style="transform: matrix(.8, .3, -.2, .9, 5, 10)"></div></div>
<!-- 5: translate then rotate (the centring idiom) -->
<div class="cell" style="left:610px; top:10px"><div class="sq r" style="left:70px; top:70px; transform: translate(-50%, -50%) rotate(30deg)"></div></div>
<!-- 6: rotateX flattened (a vertical squeeze) -->
<div class="cell" style="left:760px; top:10px"><div class="sq g" style="transform: rotateX(60deg)"></div></div>

<!-- 7: nested: a rotated box holding a scaled one -->
<div class="cell" style="left:10px; top:160px"><div class="sq b" style="transform: rotate(20deg)"><div style="position:absolute; left:20px; top:20px; width:40px; height:40px; background:#fc0; transform: scale(.5) rotate(45deg)"></div></div></div>
<!-- 8: a rotated box with a border, a radius and a shadow -->
<div class="cell" style="left:160px; top:160px"><div class="sq" style="background:#fc0; border:4px solid #00d; border-radius:12px; box-shadow: 3px 3px 6px #000; transform: rotate(-15deg); width:72px; height:72px"></div></div>
<!-- 9: the individual properties: rotate and scale -->
<div class="cell" style="left:310px; top:160px"><div class="sq r" style="rotate: 30deg; scale: 0.8"></div></div>
<!-- 10: a translation only (the layout moves it: no layer) -->
<div class="cell" style="left:460px; top:160px"><div id="tr" class="sq g" style="transform: translate(10px, 20px)"></div></div>
<!-- 11: transform with opacity -->
<div class="cell" style="left:610px; top:160px; background:#ddd"><div class="sq b" style="transform: rotate(45deg) scale(.8); opacity: .5"></div></div>
<!-- 12: a positioned child inside a transformed box (it is transformed with it) -->
<div class="cell" style="left:760px; top:160px"><div class="sq y" style="transform: rotate(10deg)"><div style="position:absolute; left:40px; top:40px; width:50px; height:50px; background:#e00"></div></div></div>

<script>
function rect(id) {
  var r = document.getElementById(id).getBoundingClientRect();
  return Math.round(r.left) + ',' + Math.round(r.top) + ',' + Math.round(r.width) + ',' + Math.round(r.height);
}
console.log('rot rect ' + rect('rot'));
console.log('tr rect ' + rect('tr'));
var clicks = 0;
document.getElementById('rot').addEventListener('click', function () {
  console.log('rot clicked ' + (++clicks));
});
document.addEventListener('click', function (e) {
  console.log('target ' + (e.target.id || e.target.className));
});
</script>
</body></html>
