<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Long page</title>
<style>body{font-family:serif;margin:20px} p{margin:0 0 10px} .n{color:#a33;font-weight:bold}</style></head>
<body><h1>A long page (scrolling)</h1>
<script>
for (var i = 1; i <= 120; i++)
  document.write('<p><span class="n">' + i + '.</span> Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>');
</script>
</body></html>
