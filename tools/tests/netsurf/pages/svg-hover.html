<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SVG hover</title>
<!-- An inline <svg> icon in currentColor, its link's colour changed by :hover: the icon
     follows (a rebox, not a restyle in place). The pointer at (60, 60) is over the link. -->
<style>
body { margin: 20px; font: 16px sans-serif; }
a { color: #1a73e8; text-decoration: none; display: inline-block; padding: 10px; }
a:hover { color: #d93025; }
svg { width: 40px; height: 40px; vertical-align: middle; }
</style></head>
<body>
<a href="#"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg> hover me</a>
</body></html>
