<!doctype html>
<html><head><meta charset="utf-8"><title>a script's scroller</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; font: 15px sans-serif; }
/* a scroller of the page's own: overflow hidden, its content moved by the script at each
   wheel event (preventDefault: the page stays still) */
#view { position: relative; height: 100%; overflow: hidden; }
#content { position: absolute; top: 0; left: 0; right: 0; }
.card { height: 300px; margin: 12px 16px; background: #eee; }
#allow { display: block; margin: 16px; height: 40px; }
</style></head>
<body>
<div id="view"><div id="content">
 <div class="card">1</div><div class="card">2</div><div class="card">3</div><div class="card">4</div>
 <button id="allow" type="button">Autoriser tous les cookies</button>
</div></div>
<script>
var content = document.getElementById('content'), top0 = 0;
document.getElementById('view').addEventListener('wheel', function (e) {
	e.preventDefault();
	top0 = Math.min(0, Math.max(top0 - e.deltaY, innerHeight - content.offsetHeight));
	content.style.top = top0 + 'px';
	console.log('wheel ' + (e.deltaY > 0 ? 'down' : 'up') + ' ' + (e instanceof WheelEvent));
}, { passive: false });
var allow = document.getElementById('allow');
allow.addEventListener('pointerdown', function () { console.log('pointerdown'); });
allow.addEventListener('click', function () { console.log('allowed'); });
</script>
</body></html>
