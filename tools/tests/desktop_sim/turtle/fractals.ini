snowflake.code = SUB Koch (size, depth)\n  IF depth = 0 THEN\n    FORWARD size\n    EXIT SUB\n  END IF\n  Koch size / 3, depth - 1\n  LEFT 60\n  Koch size / 3, depth - 1\n  RIGHT 120\n  Koch size / 3, depth - 1\n  LEFT 60\n  Koch size / 3, depth - 1\nEND SUB\nREPEAT 3\n  Koch 12, 2\n  RIGHT 120\nEND REPEAT\n
