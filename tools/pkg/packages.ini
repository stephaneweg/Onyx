# tools/pkg/packages.ini -- which of sdcard/'s files make each package (docs/pkg/README.md).
# Read by tools/pkg/mkrepo.py. The versions are in versions.ini (the script bumps them).
#
# A section is a package: [name] ([a-z0-9-]). Keys:
#   title, category, summary, author (Onyx when absent)
#   files    = the card's paths it takes: a file, a folder/ (everything under it), a glob (* ?)
#   config   = those of its files that are the user's (written once, never overwritten when changed)
#   needs    = other packages ("onyx >= 2026.10"); "kapi >= N" is added from the kernel's ABI
#   required = 1: cannot be removed      restart = 1: installed at the next boot
#   replaces = packages it takes the place of (one renamed): a card that has them gets this one as
#              their update, and they are removed once it is in (their mode kept)
#   apps     = a category of apps/<x>.app (app.txt's): all of them in this package
# [*apps]'s own `needs` is added to every app's package (the shared libraries they are built against).
# A file is taken by the first section that names it. [*apps] makes every app not taken yet a
# package of its own (its title and category from its app.txt), with [app.<name>] for its extras.

# the package manager: its own package, so that it can be updated without the system (and before it).
# Required (the card cannot update without it); not staged: it installs at once, the running pkgman
# and pkgd go on with their old programs until they start again. onyx needs it (below): a card that
# had them in onyx gets this package first, its files then kept by onyx's update (pkglib's
# owned_elsewhere).
[pkgman]
title    = Package Manager
category = System
summary  = The packages: the pkg command, the Package Manager (the Control Panel's applet), the update daemon pkgd
icon     = apps/pkgman.app/icon.bmp
required = 1
files    = bin/pkg apps/pkgman.app/ apps/pkgd.app/

# JavaScriptCore's shell (the WebKit port's step 1, docs/08-WEBKIT-PORT.md): 33 MB with ICU's data
# inside -- a package of its own, before [onyx] so that the system's bin/ does not take it.
[jsc]
title    = JavaScriptCore shell (jsc)
category = Development
summary  = WebKit's JavaScript engine as a command (JavaScript and WebAssembly): jsc file.js, jsc -e "print(6*7)"; its self-test and timings in docs/jsc
files    = bin/jsc docs/jsc/

# Jet, the browser, on WebKit (docs/08-WEBKIT-PORT.md): one 100 MB program that is the window and
# WebKit's web and network processes. Its program is built by tools/webkit/build-web.sh and not
# kept in the repository (too big for git): publish from a tree where it was built. (Until
# 2026-10-04 "jet" was the NetSurf browser, 1.0.x, and this one the package "web": a card that has
# "web" keeps it, without updates -- `pkg delete web` once jet 2 is installed.)
[jet]
title    = Jet Browser
category = Internet
summary  = The browser, on WebKit: one page per window, HTTPS, JavaScript, video; tip: "preload jet" in SD:/etc/autostart makes it open at once
icon     = apps/jet.app/icon.bmp
files    = apps/jet.app/
needs    = onyx >= 2026.10.39

# The shared libraries (SD:/lib/<name>.so; docs/03 "Shared libraries"): one package each, so that a
# fix in a library reaches every app with one small update. Required: the desktop itself runs on
# them. A library's version is 1.<its table's version when the apps were last rebuilt>.<build>: when
# the apps are rebuilt against a table that grew, raise it in versions.ini and in [*apps]'s needs.
[uikit]
title    = UIKit, the toolkit (shared library)
category = System
replaces = wtk
summary  = The widgets, the windows' frames and the theme every app draws with: one copy in memory, shared by all the apps
icon     = apps/control.app/icon.bmp
required = 1
files    = lib/uikit.so

[ft]
title    = FreeType (shared library)
category = System
summary  = The TrueType text of the apps (FreeType 2.14), shared by all of them
icon     = apps/control.app/icon.bmp
required = 1
files    = lib/ft.so

[printerkit]
title    = Printing (shared library)
category = System
replaces = print
summary  = The Print dialog and the print jobs of the apps (to the print service: PDF files, network printers)
icon     = apps/printconf.app/icon.bmp
required = 1
files    = lib/printerkit.so

[audiokit]
title    = AudioKit (shared library)
category = System
summary  = The sound library: music files (MP3, FLAC, WAV, Ogg, MIDI), a General MIDI synthesizer, mixing -- for Koton, the Media Player, BASIC and the play command
icon     = apps/soundconf.app/icon.bmp
required = 1
files    = lib/audiokit.so

[onyx]
title    = Onyx system
category = System
summary  = The kernel, the commands of /bin, the desktop, the settings, the terminal, the File Viewer, the text editor, the fonts
# (voronoy paints the wallpaper -- autostart, Setup, Theme, Display -- and imageview a picture
#  wallpaper for it; tinypad is the text editor QBasic's help and Lisa's settings open)
icon     = apps/control.app/icon.bmp
required = 1
restart  = 1
files    = kernel8-rpi4.img bin/ lib/ etc/ fonts/ res/fonts/ res/lang/ res/ca-bundle wallpapers/ README.md
	   roms/README.txt apps/terminal.app/ apps/fileviewer.app/ apps/taskman.app/ apps/tinypad.app/
	   apps/voronoy.app/ apps/imageview.app/
apps     = Shell Settings
config   = etc/*
needs    = pkgman, uikit >= 1.683, ft, printerkit >= 1.33, audiokit >= 1.206

[pi-firmware]
title    = Raspberry Pi firmware
category = System
icon     = apps/control.app/icon.bmp
summary  = The Pi 4's boot firmware, its device trees and the Wi-Fi chip's firmware
required = 1
restart  = 1
files    = start4.elf fixup4.dat armstub8-rpi4.bin bcm2711-rpi-4-b.dtb bcm2711-rpi-400.dtb
	   config.txt cmdline.txt firmware/
config   = config.txt cmdline.txt

[demos]
title    = Demos
category = Demos
summary  = The graphics and toolkit demos (demoA..F, the GPU, the widgets, plasma, spin...)
apps     = Demos

# the samples: each with the app that opens them (a user's document: never overwritten once changed)
[basic-samples]
title    = BASIC samples
category = BASIC
summary  = Sample BASIC programs for QBasic (games, graphics, a GUI)
files    = basic/
config   = basic/*
needs    = qbasic

[letters-samples]
title    = Letters samples
category = Productivity
summary  = Documents to try Letters with: a tour, a letter, an RTF sample
files    = docs/*.rtf
config   = docs/*.rtf
needs    = letters
replaces = writer-samples

[sheet-samples]
title    = Spreadsheet samples
category = Productivity
summary  = A workbook to try the Spreadsheet with
files    = docs/*.xlsx
config   = docs/*.xlsx
needs    = sheet

[slides-samples]
title    = Slides samples
category = Productivity
summary  = A presentation to try Slides with (OpenDocument and PowerPoint)
files    = docs/*.odp docs/*.pptx
config   = docs/*.odp docs/*.pptx
needs    = slides

[qbstudio-samples]
title    = QBStudio samples
category = Productivity
summary  = A project to try QBStudio with: the temperature converter
files    = projects/converter/*
config   = projects/converter/*
needs    = qbstudio

[cardfile-samples]
title    = Cardfile samples
category = Productivity
summary  = Card files to try Cardfile with: books, contacts
files    = docs/*.card
config   = docs/*.card
needs    = cardfile

[paint-samples]
title    = Paint samples
category = Graphics
summary  = Two pictures to try Paint's layers with (open one as a layer, fade it into the other)
files    = docs/pictures/
config   = docs/pictures/*
needs    = paint

[ledger-samples]
title    = Ledger samples
category = Productivity
summary  = A company's books and a bank statement (CODA) to try Ledger with
files    = docs/*.ledger docs/*.cod
config   = docs/*.ledger docs/*.cod
needs    = ledger

[koton-samples]
title    = Koton samples
category = Productivity
summary  = A demo song for Koton
files    = koton/songs/
config   = koton/songs/*
needs    = koton

[fmtracker-samples]
title    = FM Tracker samples
category = Productivity
summary  = Songs for the FM Tracker
files    = music/fms/
config   = music/fms/*
needs    = fmtracker

# the SoundFont that plays MIDI: its own package, shared by Koton and Media Player (both need it)
[generaluser-gs]
title    = GeneralUser GS (SoundFont)
category = Multimedia
icon     = apps/media.app/icon.bmp
summary  = The General MIDI SoundFont that plays MIDI files and Koton's instruments (S. Christian Collins, 32 MB)
files    = res/soundfonts/

[*apps]
needs    = uikit >= 1.683, ft

# the apps' own files outside their bundle
[app.koton]
files    = koton/ manuals/koton/
needs    = generaluser-gs, audiokit >= 1.206
[app.media]
needs    = generaluser-gs, audiokit >= 1.206
[app.ledger]
files    = manuals/ledger/
needs    = cardfile
[app.courier]
files    = courier/
[app.doom]
files    = doom/
[app.fmtracker]
files    = music/

# the needs (an app that cannot work without the other; a link to another app -- "Open in Letters",
# Cardfile's mail merge, the agenda reading the Calendar's file -- is not one): the emulators are played from the Game Library; Letters, the Spreadsheet and Ledger use
# Cardfile's records (the mail merge, the lookups)
[app.letters]
needs    = cardfile, printerkit
replaces = writer
[app.sheet]
needs    = cardfile, printerkit
[app.slides]
needs    = printerkit
[app.paint]
needs    = printerkit
[app.photos]
needs    = printerkit
[app.pdf]
needs    = printerkit
[app.gbemu]
needs    = gamelib
[app.gbaemu]
needs    = gamelib
[app.nesemu]
needs    = gamelib
[app.snesemu]
needs    = gamelib
[app.n64emu]
needs    = gamelib
[app.gcemu]
needs    = gamelib
