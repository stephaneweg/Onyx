# tools/pkg/packages.ini -- which of sdcard/'s files make each package (docs/pkg/README.md).
# Read by tools/pkg/mkrepo.py. The versions are in versions.ini (the script bumps them).
#
# A section is a package: [name] ([a-z0-9-]). Keys:
#   title, category, summary, author (Onyx when absent)
#   files    = the card's paths it takes: a file, a folder/ (everything under it), a glob (* ?)
#   config   = those of its files that are the user's (written once, never overwritten when changed)
#   needs    = other packages ("onyx >= 2026.10"); "kapi >= N" is added from the kernel's ABI
#   required = 1: cannot be removed      restart = 1: installed at the next boot
#   replaces = packages it takes the place of (one renamed): a card that has them gets this one as
#              their update, and they are removed once it is in (their mode kept)
#   apps     = a category of apps/<x>.app (app.txt's): all of them in this package
# [*apps]'s own `needs` is added to every app's package (the shared libraries they are built against).
# A file is taken by the first section that names it. [*apps] makes every app not taken yet a
# package of its own (its title and category from its app.txt), with [app.<name>] for its extras.

# the package manager: its own package, so that it can be updated without the system (and before it).
# Required (the card cannot update without it); not staged: it installs at once, the running pkgman
# and pkgd go on with their old programs until they start again. onyx needs it (below): a card that
# had them in onyx gets this package first, its files then kept by onyx's update (pkglib's
# owned_elsewhere).
[pkgman]
title    = Package Manager
category = System
summary  = The packages: the pkg command, the Package Manager (the Control Panel's applet), the update daemon pkgd
icon     = apps/pkgman.app/icon.bmp
required = 1
files    = bin/pkg apps/pkgman.app/ apps/pkgd.app/

# JavaScriptCore's shell (the WebKit port's step 1, docs/08-WEBKIT-PORT.md): 41 MB with ICU's data
# inside. Jet does not need it (it has the engine in itself): an OPTIONAL package, not on the default
# card -- its files are in tools/pkg/extra/jsc (root =), installed on demand (pkg install jsc).
[jsc]
title    = JavaScriptCore shell (jsc)
category = Development
summary  = WebKit's JavaScript engine as a command (JavaScript and WebAssembly): jsc file.js, jsc -e "print(6*7)"; its self-test and timings in docs/jsc
files    = bin/jsc docs/jsc/
root     = tools/pkg/extra/jsc

# Jet, the browser, on WebKit (docs/08-WEBKIT-PORT.md): one 100 MB program that is the window and
# WebKit's web and network processes. Its program is built by tools/webkit/build-web.sh and not
# kept in the repository (too big for git): publish from a tree where it was built. (Until
# 2026-10-04 "jet" was the NetSurf browser, 1.0.x, and this one the package "web": a card that has
# "web" keeps it, without updates -- `pkg delete web` once jet 2 is installed.)
[jet]
title    = Jet Browser
category = Internet
summary  = The browser, on WebKit: one page per window, HTTPS, JavaScript, video; tip: "preload jet" in SD:/etc/autostart makes it open at once
icon     = apps/jet.app/icon.bmp
files    = apps/jet.app/
needs    = onyx >= 2026.10.39, uikit >= 1.686, systemkit >= 1.56

# The shared libraries (SD:/lib/<name>.so; docs/03 "Shared libraries"): one package each, so that a
# fix in a library reaches every app with one small update. Required: the desktop itself runs on
# them. A library's version is 1.<its table's version when the apps were last rebuilt>.<build>: when
# the apps are rebuilt against a table that grew, raise it in versions.ini and in [*apps]'s needs.
[uikit]
title    = UIKit, the toolkit (shared library)
category = System
replaces = wtk
summary  = The widgets, the windows' frames and the theme every app draws with: one copy in memory, shared by all the apps
icon     = apps/control.app/icon.bmp
required = 1
files    = lib/uikit.so lib/uikit.bi
needs    = imagekit >= 1.46, systemkit >= 1.74
# The kernel UIKit needs, stated here and not the build's (mkrepo.py): the package `onyx` brings a kernel
# (installed at the restart) AND programs built against this table -- the dock, the menu bar. UIKit must
# be there before that restart, so it installs on the kernel before: it calls AppKit by name, and uses
# no AppKit call newer than kapi 88's (checked 2026-10-06: `nm -u` of its objects). Raise it when UIKit
# starts using a newer AppKit call. (Since 2026-10-07 it calls kapi_win_new / _select / _destroy, kapi 94's,
# only when kapi_abi_version () says the kernel has them: root.cpp uk_more_windows -- still 88; so do kapi_tray_*,
# v95's, in uk_tray.)
kapi     = 88

[fontkit]
title    = FontKit (FreeType, shared library)
category = System
summary  = The TrueType text of the apps (FreeType 2.14), shared by all of them
icon     = apps/control.app/icon.bmp
required = 1
files    = lib/fontkit.so lib/fontkit.bi
replaces = ft

[printerkit]
title    = Printing (shared library)
category = System
replaces = print
summary  = The Print dialog and the print jobs of the apps (to the print service: PDF files, network printers)
icon     = apps/printconf.app/icon.bmp
required = 1
files    = lib/printerkit.so lib/printerkit.bi

[audiokit]
title    = AudioKit (shared library)
category = System
summary  = The sound library: music files (MP3, FLAC, WAV, Ogg, MIDI, FM Songs), a General MIDI synthesizer, an FM synthesizer, mixing and effects -- for Koton, the Media Player, FM Tracker, the emulators, BASIC and the play command
icon     = apps/soundconf.app/icon.bmp
required = 1
files    = lib/audiokit.so lib/audiokit.bi

[filekit]
title    = FileKit (shared library)
category = System
summary  = The file library: compression (zlib), archives (ZIP read and written; tar, tar.gz, gzip read) on the card and in memory, files and trees copied, moved, removed, paths -- for the Archiver, ImageKit and the programs that work on files
icon     = apps/fileviewer.app/icon.bmp
required = 1
files    = lib/filekit.so lib/filekit.bi

[systemkit]
title    = SystemKit (shared library)
category = System
summary  = What the programs say to the system and to each other: the wallpaper, the volume, the trash, the preload list, the file associations, the notifications, the clipboard
icon     = apps/control.app/icon.bmp
required = 1
files    = lib/systemkit.so lib/systemkit.bi

[netkit]
title    = NetKit (shared library)
category = System
summary  = The network for the programs: the FTP volumes' client, a small HTTP client
icon     = apps/control.app/icon.bmp
required = 1
files    = lib/netkit.so lib/netkit.bi

[imagekit]
title    = ImageKit (shared library)
category = System
summary  = The picture library: BMP, GIF, PNG, JPEG, PCX and WebP read, PNG, JPEG, BMP and GIF written, the resize, the turns, the camera's orientation, the adjustments -- for the Image Viewer and the programs that work on pictures
icon     = apps/imageview.app/icon.bmp
required = 1
files    = lib/imagekit.so lib/imagekit.bi
needs    = filekit >= 1.63

# Notes and Stickies (AutoDev round 1): quick notes on the card (SD:/Notes/*.txt + notes.ini: the user's data,
# made by Notes at run time, never in a package) and the pinned ones on the desktop. Before [onyx]: Stickies'
# category is Shell (hidden from the dock's drawers, as the agenda), which [onyx]'s `apps = Shell` would take.
# Its boot line (`#setup: run stickies`) is in etc/autostart ([onyx]'s, the user's); on a card updated from an
# older one Notes' View > Show Stickies on the Desktop writes it (SystemKit's autostart_ensure).
# The needs: the kits' tables with uk_text_wrap / uk_text_over (uikit.abi 780) and autostart_* (systemkit.abi
# 76).
[notes]
title    = Notes
category = Productivity
summary  = Quick notes kept by themselves (one text file each in SD:/Notes), coloured, pinned on the desktop by Stickies
icon     = apps/notes.app/icon.bmp
files    = apps/notes.app/ apps/stickies.app/
config   = apps/notes.app/config.ini apps/stickies.app/config.ini
needs    = uikit >= 1.781, systemkit >= 1.76, fontkit

# The Clock and clockd (AutoDev round 6): the time here and around the world, alarms, a timer, a stopwatch; clockd,
# its alarm service (no window), rings the alarms with the app closed. Before [onyx]: clockd's category is Shell,
# which [onyx]'s `apps = Shell` would take. Its boot line (`run clockd`) is in etc/autostart ([onyx]'s, the user's);
# on a card updated from an older one the Clock writes it at its start (SystemKit's autostart_ensure). The user's
# files: config.ini and alarms.txt, made by the Clock at run time (never shipped). The needs: the kits' tables with
# locale_zone_sync (systemkit.abi 77) and fk_kv_block_set (filekit.abi 98).
[clock]
title    = Clock
category = Productivity
summary  = The time here and around the world, alarms that ring with the app closed (clockd), a timer, a stopwatch
icon     = apps/clock.app/icon.bmp
files    = apps/clock.app/ apps/clockd.app/
config   = apps/clock.app/config.ini apps/clock.app/alarms.txt
needs    = uikit >= 1.793, systemkit >= 1.78, filekit >= 1.99, audiokit >= 1.232, fontkit

[onyx]
title    = Onyx system
category = System
summary  = The kernel, the commands of /bin, the desktop, the settings, the terminal, the File Viewer, Disks, the text editor, the fonts
# (voronoy paints the wallpaper -- autostart, Setup, Theme, Display -- and imageview a picture
#  wallpaper for it; tinypad is the text editor QBasic's help and Lisa's settings open)
# (filekit >= 1.99: the menu bar's bell reads the Clock's alarms.txt through the Clock's model -- fk_kv_block_*)
icon     = apps/control.app/icon.bmp
required = 1
restart  = 1
files    = kernel8-rpi4.img bin/ lib/ etc/ fonts/ res/fonts/ res/lang/ res/ca-bundle wallpapers/ README.md
	   roms/README.txt apps/terminal.app/ apps/fileviewer.app/ apps/taskman.app/ apps/tinypad.app/
	   apps/voronoy.app/ apps/imageview.app/ apps/disks.app/
apps     = Shell Settings
config   = etc/*
# what the base system's apps open, and its runners (SD:/etc/fileassoc.ini, runners.ini: made from these,
# kept in step on the card by the package manager -- a line the user changed is never touched)
assoc    = txt md ini cfg conf log c h cpp hpp json html htm css kmap sh: tinypad;
	   bmp gif png jpg jpeg jpe pcx webp: imageview
runners  = bax bas: SD:/bin/basic
needs    = pkgman, uikit >= 1.793, fontkit, printerkit >= 1.33, audiokit >= 1.232, filekit >= 1.99, systemkit >= 1.74, netkit >= 1.21, imagekit >= 1.46

[pi-firmware]
title    = Raspberry Pi firmware
category = System
icon     = apps/control.app/icon.bmp
summary  = The Pi 4's boot firmware, its device trees and the Wi-Fi chip's firmware
required = 1
restart  = 1
files    = start4.elf fixup4.dat armstub8-rpi4.bin bcm2711-rpi-4-b.dtb bcm2711-rpi-400.dtb
	   config.txt cmdline.txt firmware/
config   = config.txt cmdline.txt

[demos]
title    = Demos
category = Demos
summary  = The graphics and toolkit demos (demoA..F, the GPU, the widgets, plasma, spin...)
apps     = Demos

