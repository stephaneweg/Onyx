<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onyx WebCore test</title>
<style>
  html, body { margin: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; }
  /* three solid blocks the test reads back from the picture */
  #red   { position: absolute; left: 0;     top: 0; width: 100px; height: 100px; background: rgb(255, 0, 0); }
  #green { position: absolute; left: 100px; top: 0; width: 100px; height: 100px; background: rgb(0, 128, 0); }
  #blue  { position: absolute; left: 200px; top: 0; width: 100px; height: 100px; background: rgb(0, 0, 255); }
  #flex  { position: absolute; left: 0; top: 100px; width: 300px; height: 50px; display: flex; }
  #flex div { flex: 1; }
  #grid  { position: absolute; left: 0; top: 150px; width: 300px; height: 50px; display: grid; grid-template-columns: 1fr 2fr; }
  #text  { position: absolute; left: 10px; top: 220px; width: 600px; }
  h1 { font-size: 32px; margin: 0 0 8px 0; color: #202020; }
  p { margin: 0 0 8px 0; }
  .serif { font-family: serif; }
  .mono { font-family: monospace; }
  #form  { position: absolute; left: 10px; top: 400px; }
  #svg   { position: absolute; left: 400px; top: 0; }
  #canvas { position: absolute; left: 400px; top: 110px; }
  #grad  { position: absolute; left: 600px; top: 0; width: 150px; height: 100px;
           background: linear-gradient(to right, rgb(255, 255, 0), rgb(255, 0, 255)); border-radius: 20px; }
</style>
</head>
<body>
<div id="red"></div><div id="green"></div><div id="blue"></div>
<div id="flex"><div style="background: rgb(10, 20, 30)"></div><div style="background: rgb(40, 50, 60)"></div><div style="background: rgb(70, 80, 90)"></div></div>
<div id="grid"><div style="background: rgb(200, 100, 0)"></div><div style="background: rgb(0, 100, 200)"></div></div>
<div id="text">
  <h1>Hello from WebCore on Onyx</h1>
  <p>Sans-serif text with <b>bold</b>, <i>italic</i> and a <a href="https://example.com/">link</a>.</p>
  <p class="serif">Serif text: the quick brown fox jumps over the lazy dog.</p>
  <p class="mono">Monospace text: 0123456789 {}[]();</p>
  <p>Accents and scripts: été, Ελληνικά, Кириллица.</p>
  <p id="script">script: not run</p>
</div>
<div id="form">
  <input type="text" value="a text field"> <button>A button</button>
  <input type="checkbox" checked> <input type="radio" checked>
  <select><option>a list</option></select> <input type="range" value="30">
  <progress value="0.6"></progress>
</div>
<svg id="svg" width="100" height="100" viewBox="0 0 100 100">
  <rect x="0" y="0" width="100" height="100" fill="rgb(0, 255, 255)"/>
  <circle cx="50" cy="50" r="30" fill="rgb(128, 0, 128)"/>
</svg>
<canvas id="canvas" width="100" height="100"></canvas>
<div id="grad"></div>
<script>
  // the DOM changed by a script, and a canvas drawn by it
  document.getElementById("script").textContent = "script: ran, 6 * 7 = " + (6 * 7);
  var context = document.getElementById("canvas").getContext("2d");
  context.fillStyle = "rgb(255, 128, 0)";
  context.fillRect(0, 0, 100, 100);
  context.fillStyle = "rgb(0, 0, 0)";
  context.beginPath();
  context.arc(50, 50, 25, 0, 2 * Math.PI);
  context.fill();
</script>
</body>
</html>
