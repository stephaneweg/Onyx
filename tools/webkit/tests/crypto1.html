<title>crypto1: running</title>
<!--
  crypto1.html: WebCrypto (crypto.subtle) on the Onyx port of WebKit, where it runs on mbedTLS
  (Source/WebCore/crypto/mbedtls), checked against PUBLISHED TEST VECTORS. Run by
  tools/webkit/test-webcrypto.sh (wctest with WCTEST_WAIT_TITLE=done:), or opened in any browser.

  The page writes one line per check into its body: "PASS name" or "FAIL name: what"; when all
  is done its title becomes "done: N passed, M failed".

  The vectors are the JSON below (each entry names its source in "source"):
    digests              FIPS 180-4's "abc" examples
    HMAC                 RFC 4231 (SHA-256, SHA-384, SHA-512), RFC 2202 (SHA-1)
    AES-CBC, AES-CTR     NIST SP 800-38A appendix F (F.2, F.5)
    AES-CFB8             WebKit refuses "AES-CFB-8" to script in this revision (deprecated, on
                         every port): the page checks that it is refused; SP 800-38A's F.3.7
                         vector is kept below for the day it is not
    AES-GCM              the GCM specification's test cases (McGrew and Viega, appendix B)
    AES-KW               RFC 3394 section 4
    PBKDF2               RFC 6070 (SHA-1), RFC 7914 section 11 (SHA-256)
    HKDF                 RFC 5869 appendix A
    ECDSA                RFC 6979 appendix A.2.5 to A.2.7 (P-256, P-384, P-521): the key pairs and
                         the signatures of "sample", verified here; signing is randomized, so it
                         is checked by signing then verifying
    ECDH                 RFC 5903 section 8 (P-256, P-384, P-521): both key pairs, the shared secret
    RSA                  RFC 7515 appendix A.2: a 2048-bit key (JWK) and its RSASSA-PKCS1-v1_5
                         SHA-256 signature: verified, and made again (that scheme is deterministic)
  What has NO published vector here, and says so in its "source":
    - AES-CTR with the counter wrapping inside its `length` bits (the expected text was computed
      block by block with OpenSSL's AES);
    - the PKCS #7 padding block AES-CBC adds after SP 800-38A's four blocks (OpenSSL);
    - the keys' DER forms (SubjectPublicKeyInfo, PKCS #8), which are the same keys as OpenSSL
      writes them: the exports must be those very bytes; and other encodings of an EC key
      (without its public key, with the curve named twice, a compressed point...), built byte
      by byte: to be taken or refused;
    - RSA-OAEP and RSA-PSS, randomized: cipher texts and signatures made with OpenSSL are
      decrypted and verified here, and the page's own are checked by a round trip.
  Every vector was checked against OpenSSL before it was put here.

-->

<script>
"use strict";

var passed = 0, failed = 0;

function line(kind, name, what)
{
    var div = document.createElement("div");
    div.className = kind;
    // (one word per name, and neither word in a message: the bench cuts the text at PASS and FAIL)
    div.textContent = kind + " " + name + (what ? ": " + String(what).replace(/PASS|FAIL/g, "?").replace(/\s+/g, " ") : "");
    document.getElementById("log").appendChild(div);
    if (kind === "PASS")
        passed++;
    else
        failed++;
}

function hex(string)
{
    var bytes = new Uint8Array(string.length / 2);
    for (var i = 0; i < bytes.length; i++)
        bytes[i] = parseInt(string.substr(2 * i, 2), 16);
    return bytes;
}

function toHex(buffer)
{
    return Array.from(new Uint8Array(buffer), function(byte) { return byte.toString(16).padStart(2, "0"); }).join("");
}

// A copy with one bit changed.
function flip(bytes, index)
{
    var copy = new Uint8Array(bytes);
    copy[index === undefined ? copy.length - 1 : index] ^= 0x01;
    return copy;
}

function short(string)
{
    string = String(string);
    return string.length > 72 ? string.substr(0, 72) + "...(" + string.length + ")" : string;
}

// true, or what differs.
function same(actual, expected)
{
    return actual === expected ? true : "got " + short(actual) + ", expected " + short(expected);
}

function sameFields(actual, expected, fields)
{
    for (var i = 0; i < fields.length; i++) {
        if (actual[fields[i]] !== expected[fields[i]])
            return fields[i] + ": got " + short(actual[fields[i]]) + ", expected " + short(expected[fields[i]]);
    }
    return true;
}

// A check passes when its function gives (a promise of) true; anything else, or an exception, is
// the failure's message.
async function check(name, run)
{
    try {
        var result = await run();
        if (result === true)
            line("PASS", name);
        else
            line("FAIL", name, result === false ? "false" : result);
    } catch (error) {
        line("FAIL", name, "exception " + (error && error.name) + " " + (error && error.message));
    }
}

// true when the promise is rejected (with that error, if one is named).
async function rejects(run, errorName)
{
    try {
        await run();
    } catch (error) {
        return !errorName || error.name === errorName ? true : "rejected with " + error.name + ", expected " + errorName;
    }
    return "was not rejected";
}

async function isFalse(promise, what)
{
    return (await promise) === false ? true : what + " verified";
}

async function main()
{
    var V = JSON.parse(document.getElementById("vectors").textContent);
    var subtle = window.crypto && window.crypto.subtle;

    await check("secure-context-and-subtle", async function() {
        return window.isSecureContext === true && !!subtle ? true : "isSecureContext " + window.isSecureContext + ", crypto.subtle " + subtle;
    });
    if (!subtle)
        return;

    // ---- digests
    for (let v of V.digest) {
        await check(v.name, async function() {
            return same(toHex(await subtle.digest(v.hash, hex(v.data))), v.digest);
        });
    }

    // ---- HMAC
    for (let v of V.hmac) {
        let key = null;
        await check(v.name + "-sign", async function() {
            key = await subtle.importKey("raw", hex(v.key), { name: "HMAC", hash: v.hash }, false, ["sign", "verify"]);
            return same(toHex(await subtle.sign("HMAC", key, hex(v.data))), v.mac);
        });
        if (!key)
            continue;
        await check(v.name + "-verify", async function() {
            return await subtle.verify("HMAC", key, hex(v.mac), hex(v.data));
        });
        await check(v.name + "-reject-corrupted-tag", async function() {
            return isFalse(subtle.verify("HMAC", key, flip(hex(v.mac), 0), hex(v.data)), "a corrupted tag");
        });
        await check(v.name + "-reject-truncated-tag", async function() {
            return isFalse(subtle.verify("HMAC", key, hex(v.mac).slice(0, -1), hex(v.data)), "a truncated tag");
        });
    }

    // ---- AES-CBC (WebCrypto pads: the vector's blocks, then the padding block)
    for (let v of V.aescbc) {
        let key = null;
        let algorithm = { name: "AES-CBC", iv: hex(v.iv) };
        await check(v.name + "-encrypt", async function() {
            key = await subtle.importKey("raw", hex(v.key), "AES-CBC", false, ["encrypt", "decrypt"]);
            return same(toHex(await subtle.encrypt(algorithm, key, hex(v.plaintext))), v.ciphertext + v.paddingBlock);
        });
        if (!key)
            continue;
        await check(v.name + "-decrypt", async function() {
            return same(toHex(await subtle.decrypt(algorithm, key, hex(v.ciphertext + v.paddingBlock))), v.plaintext);
        });
        // (without the padding block the text ends with ...37 10: not a padding)
        await check(v.name + "-reject-bad-padding", async function() {
            return rejects(function() { return subtle.decrypt(algorithm, key, hex(v.ciphertext)); }, "OperationError");
        });
    }

    // ---- AES-CTR
    for (let v of V.aesctr) {
        let key = null;
        let algorithm = { name: "AES-CTR", counter: hex(v.counter), length: v.length };
        await check(v.name + "-encrypt", async function() {
            key = await subtle.importKey("raw", hex(v.key), "AES-CTR", false, ["encrypt", "decrypt"]);
            return same(toHex(await subtle.encrypt(algorithm, key, hex(v.plaintext))), v.ciphertext);
        });
        if (!key)
            continue;
        await check(v.name + "-decrypt", async function() {
            return same(toHex(await subtle.decrypt(algorithm, key, hex(v.ciphertext))), v.plaintext);
        });
    }
    await check("aes-ctr-reject-counter-reuse", async function() {
        // three blocks with a counter of one bit: the third would use the first's counter again
        var v = V.aesctr[0];
        var key = await subtle.importKey("raw", hex(v.key), "AES-CTR", false, ["encrypt"]);
        return rejects(function() { return subtle.encrypt({ name: "AES-CTR", counter: hex(v.counter), length: 1 }, key, new Uint8Array(48)); }, "OperationError");
    });

    // ---- AES-CFB8 (WebKit's "AES-CFB-8": not in the WebCrypto specification). This revision of
    // WebKit refuses it to script on every port ("AES-CFB support is deprecated"), before the back
    // end is asked anything: what is checked here is that refusal. (The back end's function
    // exists, for WebCore; it was checked against this vector by a native program.)
    for (let v of V.aescfb8) {
        await check(v.name + "-refused-to-script", async function() {
            return rejects(function() { return subtle.importKey("raw", hex(v.key), "AES-CFB-8", false, ["encrypt", "decrypt"]); }, "NotSupportedError");
        });
    }

    // ---- AES-GCM (the result is the cipher text, then the tag)
    for (let v of V.aesgcm) {
        let key = null;
        let algorithm = { name: "AES-GCM", iv: hex(v.iv), additionalData: hex(v.aad), tagLength: 128 };
        await check(v.name + "-encrypt", async function() {
            key = await subtle.importKey("raw", hex(v.key), "AES-GCM", false, ["encrypt", "decrypt"]);
            return same(toHex(await subtle.encrypt(algorithm, key, hex(v.plaintext))), v.ciphertext + v.tag);
        });
        if (!key)
            continue;
        await check(v.name + "-decrypt", async function() {
            return same(toHex(await subtle.decrypt(algorithm, key, hex(v.ciphertext + v.tag))), v.plaintext);
        });
        await check(v.name + "-reject-corrupted-tag", async function() {
            return rejects(function() { return subtle.decrypt(algorithm, key, flip(hex(v.ciphertext + v.tag))); }, "OperationError");
        });
        if (v.ciphertext) {
            await check(v.name + "-reject-corrupted-text", async function() {
                return rejects(function() { return subtle.decrypt(algorithm, key, flip(hex(v.ciphertext + v.tag), 0)); }, "OperationError");
            });
        }
        await check(v.name + "-reject-other-additional-data", async function() {
            var other = { name: "AES-GCM", iv: hex(v.iv), additionalData: hex(v.aad + "00"), tagLength: 128 };
            return rejects(function() { return subtle.decrypt(other, key, hex(v.ciphertext + v.tag)); }, "OperationError");
        });
        // a tag of 96 bits is the first 12 bytes of the tag
        await check(v.name + "-tag96", async function() {
            var shortTag = { name: "AES-GCM", iv: hex(v.iv), additionalData: hex(v.aad), tagLength: 96 };
            var result = same(toHex(await subtle.encrypt(shortTag, key, hex(v.plaintext))), v.ciphertext + v.tag.substr(0, 24));
            if (result !== true)
                return result;
            return same(toHex(await subtle.decrypt(shortTag, key, hex(v.ciphertext + v.tag.substr(0, 24)))), v.plaintext);
        });
    }

    // ---- AES-KW (wrapping an AES key given raw)
    for (let v of V.aeskw) {
        let kek = null;
        await check(v.name + "-wrap", async function() {
            kek = await subtle.importKey("raw", hex(v.kek), "AES-KW", false, ["wrapKey", "unwrapKey"]);
            var key = await subtle.importKey("raw", hex(v.key), "AES-CBC", true, ["encrypt"]);
            return same(toHex(await subtle.wrapKey("raw", key, kek, "AES-KW")), v.wrapped);
        });
        if (!kek)
            continue;
        await check(v.name + "-unwrap", async function() {
            var key = await subtle.unwrapKey("raw", hex(v.wrapped), kek, "AES-KW", "AES-CBC", true, ["encrypt"]);
            return same(toHex(await subtle.exportKey("raw", key)), v.key);
        });
        await check(v.name + "-reject-corrupted", async function() {
            return rejects(function() { return subtle.unwrapKey("raw", flip(hex(v.wrapped)), kek, "AES-KW", "AES-CBC", true, ["encrypt"]); }, "OperationError");
        });
    }

    // ---- PBKDF2
    for (let v of V.pbkdf2) {
        await check(v.name, async function() {
            var key = await subtle.importKey("raw", hex(v.password), "PBKDF2", false, ["deriveBits"]);
            var bits = await subtle.deriveBits({ name: "PBKDF2", hash: v.hash, salt: hex(v.salt), iterations: v.iterations }, key, v.output.length * 4);
            return same(toHex(bits), v.output);
        });
    }

    // ---- HKDF
    for (let v of V.hkdf) {
        await check(v.name, async function() {
            var key = await subtle.importKey("raw", hex(v.ikm), "HKDF", false, ["deriveBits"]);
            var bits = await subtle.deriveBits({ name: "HKDF", hash: v.hash, salt: hex(v.salt), info: hex(v.info) }, key, v.okm.length * 4);
            return same(toHex(bits), v.okm);
        });
    }
    await check("hkdf-reject-too-long", async function() {
        // (more than 255 times the digest's size)
        var v = V.hkdf[0];
        var key = await subtle.importKey("raw", hex(v.ikm), "HKDF", false, ["deriveBits"]);
        return rejects(function() { return subtle.deriveBits({ name: "HKDF", hash: "SHA-256", salt: hex(v.salt), info: hex(v.info) }, key, 255 * 32 * 8 + 8); }, "OperationError");
    });

    // ---- the elliptic-curve keys' formats: JWK, raw, SPKI, PKCS #8, in and out
    async function ecFormats(prefix, name, k, privateUsages, publicUsages)
    {
        var algorithm = { name: name, namedCurve: k.curve };
        var publicJwk = { kty: "EC", crv: k.curve, x: k.x, y: k.y };
        var privateJwk = { kty: "EC", crv: k.curve, x: k.x, y: k.y, d: k.d };

        await check(prefix + "-jwk-public-to-raw-spki-jwk", async function() {
            var key = await subtle.importKey("jwk", publicJwk, algorithm, true, publicUsages);
            var result = same(toHex(await subtle.exportKey("raw", key)), k.raw);
            if (result !== true)
                return "raw: " + result;
            result = same(toHex(await subtle.exportKey("spki", key)), k.spki);
            if (result !== true)
                return "spki: " + result;
            var jwk = await subtle.exportKey("jwk", key);
            if (jwk.d !== undefined)
                return "a public key exported with d";
            return key.type === "public" ? sameFields(jwk, publicJwk, ["kty", "crv", "x", "y"]) : "type " + key.type;
        });
        await check(prefix + "-jwk-private-to-pkcs8-jwk", async function() {
            var key = await subtle.importKey("jwk", privateJwk, algorithm, true, privateUsages);
            var result = same(toHex(await subtle.exportKey("pkcs8", key)), k.pkcs8);
            if (result !== true)
                return "pkcs8: " + result;
            return key.type === "private" ? sameFields(await subtle.exportKey("jwk", key), privateJwk, ["kty", "crv", "x", "y", "d"]) : "type " + key.type;
        });
        await check(prefix + "-spki-to-raw-jwk", async function() {
            var key = await subtle.importKey("spki", hex(k.spki), algorithm, true, publicUsages);
            var result = same(toHex(await subtle.exportKey("raw", key)), k.raw);
            if (result !== true)
                return "raw: " + result;
            return sameFields(await subtle.exportKey("jwk", key), publicJwk, ["kty", "crv", "x", "y"]);
        });
        await check(prefix + "-raw-to-spki", async function() {
            var key = await subtle.importKey("raw", hex(k.raw), algorithm, true, publicUsages);
            return same(toHex(await subtle.exportKey("spki", key)), k.spki);
        });
        await check(prefix + "-pkcs8-to-jwk-pkcs8", async function() {
            var key = await subtle.importKey("pkcs8", hex(k.pkcs8), algorithm, true, privateUsages);
            var result = sameFields(await subtle.exportKey("jwk", key), privateJwk, ["kty", "crv", "x", "y", "d"]);
            if (result !== true)
                return result;
            return same(toHex(await subtle.exportKey("pkcs8", key)), k.pkcs8);
        });
        await check(prefix + "-reject-point-off-curve", async function() {
            return rejects(function() { return subtle.importKey("raw", flip(hex(k.raw)), algorithm, true, publicUsages); }, "DataError");
        });
        await check(prefix + "-reject-spki-point-off-curve", async function() {
            return rejects(function() { return subtle.importKey("spki", flip(hex(k.spki)), algorithm, true, publicUsages); }, "DataError");
        });
        await check(prefix + "-reject-spki-trailing-byte", async function() {
            return rejects(function() { return subtle.importKey("spki", hex(k.spki + "00"), algorithm, true, publicUsages); }, "DataError");
        });
        await check(prefix + "-reject-spki-truncated", async function() {
            return rejects(function() { return subtle.importKey("spki", hex(k.spki).slice(0, -1), algorithm, true, publicUsages); }, "DataError");

        var pending = [];

        var results = await Promise.all(pending);
