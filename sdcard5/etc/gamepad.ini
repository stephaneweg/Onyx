# gamepad.ini -- the USB gamepads' buttons, for every app (user/gamepad.h: native apps, BASIC's
# PAD / STICK / STRIG, the Game Boy emulator). The Gamepad app (Onyx menu > System) shows what
# a pad sends and writes its section here with Pad > Map Buttons...
#
# The apps see the buttons by PLACE, as on an Xbox pad: a = bottom, b = right, x = left, y = top
# face button; l / r shoulders, l2 / r2 triggers, select, start, l3 / r3 (the sticks' clicks),
# home; up / down / left / right the d-pad (from a hat, two axes or four buttons, and the left
# stick).
#
# [vvvv:pppp]  a pad model (hex USB vendor:product, shown by the Gamepad app)
# [default]    every pad without its own section that Circle does not know
#              (Xbox 360 / One, PlayStation 3 / 4 and Switch Pro pads need nothing)
#   a = 3          the pad's button number (1 = its first button), 0 = none
#   dpad = hat | axes | buttons | none      hat = 1     x_axis = 1  y_axis = 2
#   rx_axis = 3  ry_axis = 4 (right stick)   stick = 1 (the left stick moves the d-pad too)
#   l2_axis = 5  r2_axis = 6  analog triggers on axes (-n: the axis's lower half, e.g. one Z axis
#                for both triggers: l2_axis = 3, r2_axis = -3)
#   deadzone = 400 (of 1000)
# A section starts from the [default] numbers below; a button it gives to a function is taken
# from the function it had.
#
# [keyboard]   the keyboard as pad 1 in the emulators (the Gamepad app's Keyboard tab writes it): a key
#              for each button and for the right stick (rs_up, rs_down, rs_left, rs_right) -- a letter or
#              a digit, or up, down, left, right, enter, backspace, space, tab, esc, home, end, pgup, pgdn,
#              del, f1..f12, none. Without the section (by place, as Nintendo's pads):
#   up = up  down = down  left = left  right = right  a = z  b = x  x = a  y = s  l = q  r = w
#   l2 = e  r2 = r  select = backspace  start = enter  rs_up = i  rs_down = k  rs_left = j  rs_right = l

[default]
y = 1
b = 2
a = 3
x = 4
l = 5
r = 6
l2 = 7
r2 = 8
select = 9
start = 10
l3 = 11
r3 = 12
home = 13
