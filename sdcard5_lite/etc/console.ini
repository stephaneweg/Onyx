# SD:/etc/console.ini -- the console mode's settings (consolehome, PocketUI's console mode).
#
# [screen] the screen's resolution while an app is in front, by the app's name (SD:/apps/<name>.app): it overrides
# the `resolution =` of that app's app.txt (the emulators say theirs). `system` keeps the system's resolution (the
# Display applet's, SD:/cmdline.txt). At home, the game ended or another app in front: the system's resolution again.
# Sizes from 640x480 to 2560x1600.
[screen]
# gbemu = 640x480
# n64emu = system
